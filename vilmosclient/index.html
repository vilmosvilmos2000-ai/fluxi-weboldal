<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crystal Client - moved</title>
    <link rel="canonical" href="/crystalclient/">
    <meta http-equiv="refresh" content="0; url=/crystalclient/">
    <meta name="robots" content="noindex">
    <style>
        :root {
            color-scheme: dark
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #f1f4ff;
            background:
                radial-gradient(760px 520px at 18% 12%, rgba(168, 85, 247, .42)),
                radial-gradient(820px 560px at 84% 4%, rgba(91, 108, 247, .40)),
                radial-gradient(900px 620px at 50% 108%, rgba(76, 210, 250, .20)),
                linear-gradient(180deg, #0b0926, #06051a 60%, #050414);
        }

        .box {
            max-width: 460px;
            padding: 34px 38px;
            text-align: center;
            border-radius: 22px;
            border: 1px solid rgba(150, 160, 255, .3);
            background: linear-gradient(180deg, rgba(45, 46, 98, .55), rgba(22, 21, 56, .65));
        }

        .mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #a855f7, #5b6cf7);
            box-shadow: 0 10px 30px rgba(124, 92, 246, .45)
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            letter-spacing: 1px
        }

        p {
            margin: 0 0 20px;
            color: #a6aed9;
            line-height: 1.6
        }

        a.btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #5b6cf7, #a855f7);
            box-shadow: 0 8px 26px rgba(91, 108, 247, .35)
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="mark">C</div>
        <h1>CRYSTAL CLIENT</h1>
        <p>This launcher is now called Crystal Client. The download page has moved to a new address.</p>
        <a class="btn" href="/crystalclient/">Open the Crystal Client page</a>
    </div>
</body>

</html>
