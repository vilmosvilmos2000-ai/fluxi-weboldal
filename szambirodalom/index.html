function menu(){$("app").innerHTML=hd("")+'<main class="w"><div class="tabs"><span class="tab on">Évfolyamok <b>'+K.length+'</b></span></div><p class="story">A gonosz sárkány ellopta a Varázskristályt! Kelj át az erdőn, barlangon, hídon, folyón, váron és hegyen – minden akadályt egy feladat őriz. Válaszd ki az évfolyamod, majd a témát:</p><div class="gr">'+K.map((c,k)=>'<div class="c" style="--ac:'+c+'"><div class="top"><span class="nb">'+z(k+1)+'</span><span class="m">7 pálya</span></div><div class="ti"><div class="ic">'+S[k%7][0]+'</div><div><h2>'+(k+1)+'. <span>évfolyam</span></h2><p class="m2">Erdőtől a sárkányig</p></div></div><div><span class="tg">'+H[k].length+' téma</span></div><button class="cta" onclick="topics('+(k+1)+')">Témák</button></div>').join("")+'</div></main>'}
function topics(n){g=n;const L=H[n-1],c=(b,a,ic,nm,ds,tg,go)=>'<div class="c t" style="--ac:'+a+'"><div class="top"><span class="nb">'+b+'</span><span class="m">'+tg+'</span></div><div class="ti"><div class="ic">'+ic+'</div><div><h2>'+nm+'</h2><p class="m2">'+ds+'</p></div></div><button class="cta" onclick="'+go+'">Indítás</button></div>';
$("app").innerHTML=hd('<button class="o" onclick="menu()">Menü</button>')+'<main class="w"><div class="tabs"><span class="tab on">'+n+'. évfolyam <b>'+L.length+' téma</b></span></div><p class="story">Válassz témát, és indulhat a kaland a sárkány felé! Ha mindenből egy kicsit szeretnél, válaszd a vegyes kalandot.</p><div class="gr">'+L.map((e,j)=>c(z(j+1),K[(n+j-1)%K.length],e[0],e[1],e[2],pool(n,j).length+' kérdés','start('+n+','+j+')')).join("")+c("★",K[n-1],"🗺️","Vegyes kaland","Minden téma egyben, a teljes út",T[n-1].length+' kérdés','start('+n+',-1)')+'</div></main>'}
function start(n,t){g=n;th=t;Q=t<0?sh(T[n-1].map(f=>f())):pool(n,t);i=0;h=5;show()}
function show(){const n=Q.length;if(i>=n)return end(1);const x=Math.min(6,Math.floor(i*7/n)),s=S[x];
$("app").innerHTML=hd('<button class="o" onclick="topics('+g+')">Témák</button>')+'<main class="w"><div class="tabs"><span class="tab on">'+g+'. évfolyam</span><span class="tab">Élet <span id="hp">'+hs()+'</span></span></div><div class="m th">'+(th<0?"Vegyes kaland":H[g-1][th][1])+'</div><div class="gm" style="--ac:'+K[x]+'"><div class="pb"><i style="width:'+i/n*100+'%"></i></div><div class="c"><div class="top"><span class="nb">'+z(x+1)+'</span><span class="m">Feladat '+(i+1)+'/'+n+'</span></div><div class="ti"><div class="ic">'+s[0]+'</div><div><h2>'+s[1]+'</h2><p class="m2">'+s[2]+'</p></div></div><p class="q">'+Q[i][0].replace(/(\d)\.(\d)/g,"$1,$2")+'</p><div class="row"><input id="in" autocomplete="off" inputmode="text" placeholder="Válaszod"><button onclick="chk()">Mehet</button></div><div id="m"></div></div></div></main>';
$("in").focus();$("in").onkeydown=e=>e.key=="Enter"&&chk()}
function chk(){const v=parseFloat($("in").value.replace(",",".").replace("−","-"));if(isNaN(v)||$("in").disabled)return;
if(Math.abs(v-Q[i][1])<.001){i++;$("in").disabled=true;$("m").className="ok";$("m").textContent="✅ Helyes! Tovább!";setTimeout(show,700)}
else{h--;if(h<1)return end(0);$("hp").textContent=hs();$("m").className="no";$("m").textContent="❌ Nem jó, vigyázz! Próbáld újra.";$("in").select()}}
function end(w){$("app").innerHTML=hd('<button class="o" onclick="menu()">Menü</button>')+'<main class="w"><div class="gm" style="--ac:'+(w?K[4]:K[1])+'"><div class="c"><div class="top"><span class="nb">'+(w?"Siker":"Vége")+'</span><span class="m">'+(th<0?"":H[g-1][th][1]+" · ")+g+'. évfolyam</span></div><div class="ti"><div class="ic">'+(w?"🏆":"💀")+'</div><div><h2>'+(w?'Legyőzted a <span>sárkányt!</span>':'A sárkány <span>legyőzött...</span>')+'</h2><p class="m2">'+(w?"Visszaszerezted a Varázskristályt! Megmaradt életeid: "+hs():"Elfogytak az életeid, de a kaland újrakezdhető.")+'</p></div></div><div class="row2"><button onclick="start('+g+','+th+')">Újra ('+g+'. évfolyam)</button><button class="o" onclick="topics('+g+')">Másik téma</button><button class="o" onclick="menu()">Másik évfolyam</button></div></div></div></main>'}
menu();
</script></body></html>
