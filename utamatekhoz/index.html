<script>
// ---------- NAT2020 feladatgenerátorok (osztályonként; minden indításkor új paraméterek) ----------
const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[rn(0,a.length-1)],sh=a=>{for(let i=a.length;i>1;){const j=rn(0,--i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>(""+n).replace(".",",").replace("-","−"),pr=n=>n<0?`(${f(n)})`:f(n),sg=(n,v="")=>n?(n<0?"− ":"+ ")+(Math.abs(n)==1&&v?"":Math.abs(n))+v:"";
const SU="⁰¹²³⁴⁵⁶⁷⁸⁹",SB="₀₁₂₃₄₅₆₇₈₉",sup=n=>[...""+n].map(c=>c=="-"?"⁻":SU[c]).join(""),sub=n=>[...""+n].map(c=>SB[c]).join("");
const gcd=(a,b)=>b?gcd(b,a%b):a,fa=n=>n<2?1:n*fa(n-1),cb=(n,k)=>fa(n)/(fa(k)*fa(n-k));
const ad=(l,h)=>()=>{const a=rn(l,h),b=rn(l,h);return[`${a} + ${b}`,a+b]},
sb=(l,h)=>()=>{const a=rn(l+1,h),b=rn(l,a-1);return[`${a} − ${b}`,a-b]},
ml=(a,b,c,d)=>()=>{const x=rn(a,b),y=rn(c,d);return[`${x} · ${y}`,x*y]},
dv=(a,b,c,d)=>()=>{const q=rn(a,b),y=rn(c,d);return[`${q*y} : ${y}`,q]},

  for(let k=0;k<=10;k++){const b=document.createElement("button"),r=k==10?46:36;b.style.left=P[k+1][0]-r+"px";b.style.top=P[k+1][1]-r+"px";b.onclick=()=>tap(k);Wd.appendChild(b);N.push(b)}
  const q=P[11];add("👸","dc q",q[0]+(q[0]>W/2?58:-92),q[1]-50).style.fontSize="48px";
  hero=add("🤴","",0,0,"hero");
}
function refresh(){
  N.forEach((b,k)=>{const st=k==10?(i==10?"done":"lock"):k<i?"done":k==i?"cur":"lock";b.className="node "+(k==10?"cas ":"")+st;b.style.setProperty("--h",k*34);if(k<10)b.dataset.n=k<i?"✓":k+1;b.innerHTML="<i>"+em(k==10?"🏰":k<i?O[k][2]:O[k][0])+"</i>"});
  for(let j=0;j<11;j++)$("g"+j).classList.toggle("d",i>=j);
  $("pill").textContent="⭐ "+i+"/10";$("pill").style.setProperty("--p",i*10+"%");
}
function wv(y,a,p){let d="M0 "+y;for(let x=0;x<=W+12;x+=12)d+="L"+x+" "+(y+a*Math.sin(x/46+p)).toFixed(1);return d+"L"+W+" "+HH+"L0 "+HH+"Z"}
function px(y){for(let j=0;j<11;j++){const a=P[j],b=P[j+1];if(a[1]>=y&&b[1]<=y)return a[0]+(b[0]-a[0])*(a[1]-y)/(a[1]-b[1])}return W/2}
function rb(){const c=W/2,r=Math.min(W*.46,230);return["#ff4d6d","#ff9f1c","#ffe14a","#3ddc84","#2cb5ff","#9b5de5"].map((k,j)=>{const q=r-j*10;return`<path d="M${c-q} 292A${q} ${q} 0 0 1 ${c+q} 292" fill="none" stroke="${k}" stroke-width="11" opacity=".92"/>`}).join("")}
function scene(){
  let t=`<defs><linearGradient id="gz1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2f7ff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient><linearGradient id="gz2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6df08a"/><stop offset="1" stop-color="#1fbf68"/></linearGradient><linearGradient id="gz3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f76e"/><stop offset="1" stop-color="#7fe05a"/></linearGradient><radialGradient id="hl"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient></defs><circle cx="${P[11][0]}" cy="${P[11][1]}" r="150" fill="url(#hl)"/>`;t+=rb();
  for(let x=-30,n=0;x<W;x+=92,n++){const h=60+(n*37)%48,m=x+55,y=275-h,c=h*.28,w=c*55/(h+10);t+=`<path class="z0" d="M${x} 290L${m} ${y}L${x+110} 290Z"/><path class="sn" d="M${m} ${y}L${m-w} ${y+c}L${m+w} ${y+c}Z"/>`}
  t+=`<path class="z1" d="${wv(265,9,0)}"/><path class="z2" d="${wv(620,12,2)}"/><path class="z3" d="${wv(975,12,4)}"/>`;
  [["Hófödte hegyek",265],["Susogó erdő",620],["Zöld rét",975]].forEach(([n,y])=>{const x=px(y)<W/2?W-86:86;t+=`<rect class="rr" x="${x-70}" y="${y-16}" width="140" height="32" rx="16"/><text class="rt" x="${x}" y="${y+5}">${n}</text>`});
  return t}
function burst(x,y){for(let n=0;n<14;n++){const e=add(["✨","⭐","💛","🌟"][n%4],"pt",x,y),a=n/14*6.28,r=60+Math.random()*70;e.style.setProperty("--dx",Math.cos(a)*r+"px");e.style.setProperty("--dy",Math.sin(a)*r+"px");setTimeout(()=>e.remove(),1100)}}
function cam(k,s){const[x,y]=P[k+1];Wd.style.transformOrigin=x+"px "+y+"px";Wd.style.transform=`translate(${W/2-x}px,${innerHeight*.3-(y-V.scrollTop)}px) scale(${s})`}
function focusNode(k,sm=true){V.scrollTo({top:Math.max(0,P[k+1][1]-innerHeight*.58),behavior:sm?"smooth":"auto"})}
const SC={0:6000,1:8300,2:7700,3:8000,4:8400,5:8400,6:7800,7:9200,8:8600,9:8200};/* jelenettel rendelkező akadályok: 0 = széles folyó */
function setSh(){$('scn').style.setProperty('--sh',$('sheet').offsetHeight+'px')}
function openScene(k){const s=$('scn');$('mg').className='';$('mg').textContent=O[k][0]+' '+O[k][1];$('qt').textContent=Q[k][0];setSh();s.className=k?'w'+k:'';void s.getBoundingClientRect();s.classList.add('on')}
function play(){$('scn').classList.add('go')}
function wrongScene(){const s=$('scn');if(!s.classList.contains('on'))return;s.classList.remove('no');void s.getBoundingClientRect();s.classList.add('no')}
function endScene(){const s=$('scn');s.classList.remove('on');setTimeout(()=>{if(!s.classList.contains('on'))s.classList.remove('go','no')},700)}
function finale(){const s=$('scn');s.style.setProperty('--sh','0px');s.className='w10 go';void s.getBoundingClientRect();s.classList.add('on');T(()=>{endScene();fin()},9000)}
function unzoom(){endScene();$("sheet").classList.remove("up");Wd.style.transform="none";V.style.overflow="";document.body.classList.remove("z")}
function start(n){
  run++;g=n;i=0;miss=0;busy=true;Q=gen(n);$("gt").textContent=(n+1)+". osztály";
  $("win").classList.add("hide");show("game");unzoom();build();hp(side(-1));refresh();V.scrollTop=0;
  T(()=>{hp(side(0));focusNode(0)},900);T(()=>busy=false,2300);
}
function tap(k){
  if(busy)return;
  if(k>i||(k==10&&i<10))return void N[k].animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:260});
  if(k<i||k==10)return;
  busy=true;document.body.classList.add("z");if(SC[i])openScene(i);else{V.style.overflow="hidden";cam(i,2.3)}
  T(()=>{$("mg").className="";$("mg").textContent=O[i][0]+" "+O[i][1];$("qt").textContent=Q[i][0];$("in").value="";$("sheet").classList.add("up");busy=false},SC[i]?1300:900);
}
function num(s){
  s=s.trim().replace(/[−–]/g,"-").replace(",",".");if(!s)return null;
  if(/^-?\d+(\.\d+)?\/\d+$/.test(s)){const[a,b]=s.split("/");return +a/+b}
  const n=Number(s);return isNaN(n)?null:n;
}
function check(){
  if(busy)return;const v=num($("in").value);if(v===null)return;
  if(Math.abs(v-Q[i][1])<1e-6){
    busy=true;const k=i;$("mg").className="ok";$("mg").textContent="✅ Helyes! "+O[k][3];
    i++;const S=SC[k]||0;if(S){T(()=>$('sheet').classList.remove('up'),900);T(play,1100);T(()=>{endScene();refresh();N[k].classList.add('pop');hp(on(k));burst(P[k+1][0],P[k+1][1])},S)}else{refresh();N[k].classList.add('pop');hp(on(k));burst(P[k+1][0],P[k+1][1])}
    const nx=i>9?10:i;
    if(!S)T(()=>$("sheet").classList.remove("up"),1500);
    T(()=>{unzoom();hp(side(nx))},S+1900);
    T(()=>focusNode(nx),S+2900);
    T(()=>{i>9?finale():busy=false},S+(i>9?4400:3700));
  }else{
    miss++;wrongScene();$("mg").className="bad";$("mg").textContent="❌ Ez nem az igazi, próbáld újra!";
    const s=$("sheet");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");$("in").select();
  }
}
function fin(){
  const s=miss<=1?3:miss<=4?2:1;
  $("stars").textContent="⭐".repeat(s)+"☆".repeat(3-s);
  $("sum").textContent=(g+1)+". osztály kész! "+(miss?miss+" hibás próbálkozás volt.":"Egyetlen hibád sem volt!");
  for(let n=0;n<40;n++){const c=document.createElement("span");c.className="cf";c.textContent=["🎉","⭐","✨","🎊","💛"][n%5];c.style.left=Math.random()*100+"%";c.style.animationDelay=Math.random()*1.6+"s";c.innerHTML=em(c.textContent);$("win").appendChild(c);setTimeout(()=>c.remove(),5200)}
  $("win").classList.remove("hide");
}
function menu(){run++;unzoom();$("win").classList.add("hide");show("menu")}
$("ok").onclick=check;
$("in").onkeydown=e=>{if(e.key==="Enter")check()};
$("mn").onclick=()=>{$("in").value="-"+$("in").value.replace(/^-/,"");$("in").focus()};
$("x").onclick=()=>{if(busy)return;busy=true;unzoom();T(()=>busy=false,1000)};
$("bk").onclick=menu;$("other").onclick=menu;$("again").onclick=()=>start(g);
</script></body></html>
