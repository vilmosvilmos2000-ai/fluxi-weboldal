<script>
// ---------- NAT2020 feladatgenerátorok (osztályonként; minden indításkor új paraméterek) ----------
const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[rn(0,a.length-1)],sh=a=>{for(let i=a.length;i>1;){const j=rn(0,--i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>(""+n).replace(".",",").replace("-","−"),pr=n=>n<0?`(${f(n)})`:f(n),sg=(n,v="")=>n?(n<0?"− ":"+ ")+(Math.abs(n)==1&&v?"":Math.abs(n))+v:"";
const SU="⁰¹²³⁴⁵⁶⁷⁸⁹",SB="₀₁₂₃₄₅₆₇₈₉",sup=n=>[...""+n].map(c=>c=="-"?"⁻":SU[c]).join(""),sub=n=>[...""+n].map(c=>SB[c]).join("");
const gcd=(a,b)=>b?gcd(b,a%b):a,fa=n=>n<2?1:n*fa(n-1),cb=(n,k)=>fa(n)/(fa(k)*fa(n-k));
const ad=(l,h)=>()=>{const a=rn(l,h),b=rn(l,h);return[`${a} + ${b}`,a+b]},
sb=(l,h)=>()=>{const a=rn(l+1,h),b=rn(l,a-1);return[`${a} − ${b}`,a-b]},
ml=(a,b,c,d)=>()=>{const x=rn(a,b),y=rn(c,d);return[`${x} · ${y}`,x*y]},
dv=(a,b,c,d)=>()=>{const q=rn(a,b),y=rn(c,d);return[`${q*y} : ${y}`,q]},
lin=l=>()=>{const x=rn(l,9)||3,a=rn(3,9),c=rn(1,a-1),b=rn(-9,9)||4;return[`Oldd meg: ${a}x ${sg(b)} = ${c}x ${sg(a*x+b-c*x)}.  x = ?`,x]},
rect=()=>{const a=rn(3,12),b=rn(3,15);return[`Egy téglalap területe ${a*b} cm², egyik oldala ${a} cm. Mekkora a másik oldal (cm)?`,b]},
mean=()=>{const a=[rn(4,20),rn(4,20),rn(4,20),rn(4,20)];a[3]+=(4-a.reduce((x,y)=>x+y)%4)%4;return[`Számítsd ki az átlagot: ${a.join(", ")}`,a.reduce((x,y)=>x+y)/4]};
const NM={2:"fele",3:"harmada",4:"negyede",5:"ötöde",10:"tizede"};
const GEN=[
/*1*/[ad(1,10),sb(2,20),
()=>{const a=rn(3,12),b=rn(2,20-a);return[`${a} piros és ${b} kék lufi van. Hány lufi van összesen?`,a+b]},
()=>{const a=rn(8,20),b=rn(2,a-1);return[`Pistinek ${a} matricája van, ${b} matricát elajándékoz. Hány marad?`,a-b]},
()=>{const a=rn(1,9),s=rn(a+1,20);return[`${a} + ? = ${s}`,s-a]}],
/*2*/[ad(10,50),sb(10,99),
()=>{const a=pk([2,3,4,5,10]),b=rn(1,10);return[`${a} · ${b}`,a*b]},
()=>{const d=pk([2,3,4,5,10]),q=rn(1,10);return[`${d*q} : ${d}`,q]},
()=>{const n=rn(2,5),k=rn(2,6);return[`${n} dobozban ${k}-${k} toll van. Összesen hány toll?`,n*k]}],
/*3*/[ad(100,500),sb(100,999),ml(12,99,2,9),dv(12,99,2,9),
()=>{const a=rn(1,9),b=rn(1,99);return[`${a} m ${b} cm hány centiméter?`,a*100+b]},
()=>{const a=rn(5,40),b=rn(3,a);return[`Egy téglalap oldalai ${a} cm és ${b} cm. Mekkora a kerülete (cm)?`,2*(a+b)]}],
/*4*/[ad(1000,9999),sb(1000,9999),ml(12,99,11,30),dv(20,200,3,25),
()=>{const q=pk([2,3,4,5,10]),k=rn(2,12);return[`Mennyi ${q*k} ${NM[q]}?`,k]},
()=>{const a=rn(2,9),b=rn(10,999);return[`${a} km ${b} m hány méter?`,a*1000+b]},
()=>{const a=rn(5,40),b=rn(3,a);return[`Egy téglalap oldalai ${a} cm és ${b} cm. Mekkora a területe (cm²)?`,a*b]}],
/*5*/[()=>{const a=rn(11,99),b=rn(11,99);return[`${f(a/10)} + ${f(b/10)}`,(a+b)/10]},
()=>{const a=rn(50,99),b=rn(11,a-1);return[`${f(a/10)} − ${f(b/10)}`,(a-b)/10]},
()=>{const a=rn(11,99),k=rn(2,9);return[`${f(a/10)} · ${k}`,a*k/10]},
()=>{const t=pk([[4,6],[6,8],[4,10],[6,9],[8,12],[10,15]]);return[`Legkisebb közös többszörös: ${t[0]} és ${t[1]}`,t[0]*t[1]/gcd(t[0],t[1])]},
()=>{const t=pk([[12,18],[18,24],[20,30],[16,24],[30,45]]);return[`Legnagyobb közös osztó: ${t[0]} és ${t[1]}`,gcd(t[0],t[1])]},
rect,
()=>{const a=rn(2,9),b=rn(2,9),c=rn(2,9),d=rn(1,a+b*c);return[`${a} + ${b} · ${c} − ${d}`,a+b*c-d]}],
/*6*/[()=>{const a=rn(-15,15),b=rn(-15,15);return[`${f(a)} + ${pr(b)}`,a+b]},
()=>{const a=rn(2,9)*pk([-1,1]),b=rn(2,9)*pk([-1,1]);return[`${pr(a)} · ${pr(b)}`,a*b]},
()=>{const a=rn(1,20),b=rn(1,15);return[`${a} − (−${b})`,a+b]},
()=>{const n=rn(1,20)*20,p=pk([5,10,20,25,50]);return[`Mennyi ${n} ${p}%-a?`,n*p/100]},
()=>{const t=pk([[2,3,"kétharmada"],[3,4,"háromnegyede"],[2,5,"kétötöde"],[3,5,"háromötöde"]]),k=rn(2,12);return[`Mennyi ${t[1]*k} ${t[2]}?`,k*t[0]]},
()=>{const a=rn(1,3),b=rn(1,3);return[`${a}/4 + ${b}/2  (tizedes törtként)`,(a+2*b)/4]},
()=>{const a=rn(2,5),b=rn(6,9),u=rn(2,9)*10;return[`${a} kg alma ${a*u} Ft. Mennyibe kerül ${b} kg alma (Ft)?`,b*u]}],
/*7*/[()=>{const x=rn(-9,9)||5,a=rn(2,9),b=rn(-9,9)||3;return[`Oldd meg: ${a}x ${sg(b)} = ${a*x+b}.  x = ?`,x]},
()=>{const a=rn(2,6),b=rn(2,9),k=rn(2,6);return[`${a} : ${b} = ${a*k} : x.  Mennyi x?`,b*k]},
()=>{const a=rn(30,80),b=rn(30,80);return[`Egy háromszög két szöge ${a}° és ${b}°. Mekkora a harmadik (°)?`,180-a-b]},
()=>{const X=rn(2,40)*100,p=pk([10,20,25,30,40]);return[`Egy ${X} Ft-os árut ${p}% kedvezménnyel adnak. Mennyi az új ár (Ft)?`,X*(100-p)/100]},
()=>{const b=rn(2,5)*pk([-1,1]),n=rn(2,4);return[`${pr(b)}${sup(n)}`,b**n]},
()=>{const a=rn(2,9),b=rn(1,9),x=rn(-5,5);return[`Mennyi a ${a}x − ${b} kifejezés értéke, ha x = ${f(x)}?`,a*x-b]}],
/*8*/[()=>{const n=rn(2,20);return[`√${n*n}`,n]},
()=>{const t=pk([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);return[`Derékszögű háromszög befogói ${t[0]} és ${t[1]} cm. Mekkora az átfogó (cm)?`,t[2]]},
lin(1),
()=>{const m=rn(2,6)*pk([-1,1]),c=rn(-9,9)||2,x=rn(-4,6);return[`y = ${f(m)}x ${sg(c)}. Mennyi y, ha x = ${f(x)}?`,m*x+c]},
mean,
()=>{const r=rn(2,12);return[`Egy kör sugara ${r} cm. Mekkora a területe (π ≈ 3,14; cm²)?`,r*r*314/100]},
()=>{const a=rn(2,9),n=rn(2,5);return[`${a} · 10${sup(n)}`,a*10**n]}],
/*9*/[lin(-9),
()=>{const x=rn(1,9),y=rn(1,9),p=rn(2,3);return[`${p}x + y = ${p*x+y}  és  x − y = ${f(x-y)}.  Mennyi x·y?`,x*y]},
()=>{const x=rn(8,16),y=rn(8,16),z=rn(2,6);return[`|A| = ${x}, |B| = ${y}, |A ∩ B| = ${z}. Mennyi |A ∪ B|?`,x+y-z]},
()=>{const o=rn(1,20)*100,p=pk([10,20,25,50]);return[`Egy szám ${p}%-kal nőtt, így ${o*(100+p)/100} lett. Mennyi volt eredetileg?`,o]},
()=>{const x=rn(2,9),a=rn(2,9);return[`Ha x = ${x}, mennyi (x + ${a})² − x² − ${2*a}x ?`,a*a]},
()=>{const a=rn(3,12),b=rn(3,15);return[`Egy téglalap kerülete ${2*(a+b)} cm, egyik oldala ${a} cm. Mekkora a területe (cm²)?`,a*b]}],
/*10*/[()=>{const p=rn(-7,8);let q=rn(-7,8);while(p==q)q=rn(-7,8);return[`Oldd meg: x² ${sg(-(p+q),"x")} ${sg(p*q)} = 0.  Mennyi a nagyobbik gyök?`,Math.max(p,q)]},
()=>{const p=rn(-6,2),q=p+rn(3,7);return[`Hány egész szám megoldása az x² ${sg(-(p+q),"x")} ${sg(p*q)} < 0 egyenlőtlenségnek?`,q-p-1]},
()=>{const k=rn(1,5),w=rn(0,2);return[`Derékszögű háromszög befogói ${3*k} és ${4*k} cm, α a ${3*k} cm-es befogóval szemközti szög. Mennyi ${["sin","cos","tg"][w]} α? (tizedes tört)`,[.6,.8,.75][w]]},
()=>{const k=rn(2,15);return[`Derékszögű háromszög átfogója ${2*k} cm, egyik hegyesszöge 30°. Mekkora a vele szemközti befogó (cm)?`,k]},
()=>{const m=rn(2,4),n=rn(2,4),p=rn(2,6),q=rn(1,5);return[`(x${sup(m)})${sup(n)} · x${sup(p)} : x${sup(q)} = x^k.  Mennyi k?`,m*n+p-q]},
()=>{const m=pk([2,3,5]),u=rn(1,4),v=rn(1,4);return[`Mennyi √${m*u*u} · √${m*v*v} ?`,m*u*v]},
()=>{const a=pk([2,5,10]),n=rn(1,3);return[`${a}${sup(-n)}  (tizedes törtként)`,1/a**n]}],
/*11*/[()=>{const b=pk([2,3,5,10]),m=rn(2,5),n=rn(1,m-1),d=rn(0,1);return[`Mennyi log${sub(b)} ${b**m} ${d?"−":"+"} log${sub(b)} ${b**n} ?`,d?m-n:m+n]},
()=>{let b,a,x,c,k;do{b=pk([2,3,5]);a=rn(1,3);x=rn(-2,4);c=rn(-3,3);k=a*x+c}while(k<1||k>(b==2?9:b==3?5:3));return[`Oldd meg: ${b}^(${((a>1?a:"")+"x "+sg(c)).trim()}) = ${b**k}.  x = ?`,x]},
()=>{const t=pk([[3,4,5],[5,12,13],[6,8,10],[8,6,10]]),x=rn(-5,5),y=rn(-5,5);return[`Mekkora az A(${f(x)}; ${f(y)}) és B(${f(x+pk([-1,1])*t[0])}; ${f(y+pk([-1,1])*t[1])}) pontok távolsága?`,t[2]]},
()=>{if(rn(0,1)){const a=rn(-5,5)||2,b=rn(-5,5)||3,r=rn(2,9);return[`Egy kör egyenlete: (x ${sg(-a)})² + (y ${sg(-b)})² = ${r*r}. Mekkora a sugara?`,r]}const mx=rn(-4,4),my=rn(-4,4),u=rn(1,5),v=rn(1,5);return[`Mennyi az A(${f(mx-u)}; ${f(my-v)}) és B(${f(mx+u)}; ${f(my+v)}) pontok felezőpontja koordinátáinak összege?`,mx+my]},
()=>{const a=rn(-5,9),d=rn(2,6),n=rn(6,12),t=rn(0,2),u=rn(1,4),q=rn(2,3),h=rn(4,6);
 if(t==0)return[`Számtani sorozat: a₁ = ${f(a)}, d = ${d}. Mennyi a${sub(n)}?`,a+(n-1)*d];
 if(t==1)return[`Számtani sorozat: a₁ = ${f(a)}, d = ${d}. Mennyi az első ${n} tag összege?`,n*(2*a+(n-1)*d)/2];
 return[`Mértani sorozat: a₁ = ${u}, q = ${q}. Mennyi a${sub(h)}?`,u*q**(h-1)]},
()=>{if(rn(0,1)){const n=rn(5,9),k=rn(2,3);return[`${n} emberből ${k} főt hányféleképpen választhatunk ki?`,cb(n,k)]}const m=rn(4,7);return[`Hányféleképpen ültethető sorba ${m} ember?`,fa(m)]}],
/*12*/[()=>{const s=rn(3,11),w=6-Math.abs(s-7);return[`Két dobókockával dobunk. Mekkora a valószínűsége, hogy az összeg ${s}? (törtként, pl. 1/6)`,w/36]},
()=>{const r=rn(3,6),b=rn(3,6),n=r+b;return[`Egy urnában ${r} piros és ${b} kék golyó van. Visszatevés nélkül húzunk kettőt. Mekkora a valószínűsége, hogy mindkettő piros? (törtként)`,r*(r-1)/(n*(n-1))]},
()=>{const n=rn(3,5),k=rn(1,n-1);return[`${n} érmét dobunk. Mekkora a valószínűsége, hogy pontosan ${k} fej lesz? (tizedes tört)`,cb(n,k)/2**n]},
()=>{const a=[0,0,0,0,0].map(()=>rn(2,20));a[4]+=(5-a.reduce((x,y)=>x+y)%5)%5;const s=a.reduce((x,y)=>x+y),o=[...a].sort((x,y)=>x-y),m=rn(0,1);return[`Egy dolgozat pontszámai: ${a.join(", ")}. Mennyi ${m?"az átlag":"a medián"}?`,m?s/5:o[2]]},
()=>{const t=rn(0,2),r=pk([3,6,9]),h=3*rn(1,4);return t==0?[`Egy gömb sugara ${r} cm, térfogata k·π cm³. Mennyi k?`,4*r**3/3]:t==1?[`Egy kúp alapkörének sugara ${r} cm, magassága ${h} cm. Térfogata k·π cm³. Mennyi k?`,r*r*h/3]:[`Egy henger sugara ${r} cm, magassága ${h} cm. Térfogata k·π cm³. Mennyi k?`,r*r*h]},
()=>{const d=pk([[1,2,2,3],[2,3,6,7],[4,4,7,9],[1,4,8,9],[6,6,7,11]]);return[`Egy téglatest élei ${d[0]}, ${d[1]} és ${d[2]} cm. Milyen hosszú a testátlója (cm)?`,d[3]]}]
];
// 10 különböző feladat az adott osztályhoz: a sablonok körbejárnak, az ismétlődő szöveget újrasorsoljuk
function gen(n){const G=sh([...GEN[n]]),r=[];let t=0;while(r.length<10&&t++<300){const q=G[r.length%G.length]();if(!r.some(x=>x[0]==q[0]))r.push(q)}return sh(r)}
// ---------- Játékmechanika (az eredeti térképes játékból) ----------
const O=[["🌊","Széles folyó állja az utad!","🌉","Felépült a híd!"],["🧱","Magas fal áll előtted!","🪜","Megvan a létra!"],["🔥","Tűzfal lángol az úton!","💧","Eloltottad a tüzet!"],["🕳️","Mély szakadék tátong előtted!","🪢","Kifeszült a kötélhíd!"],["🌿","Tüskés bozót nőtt az úton!","🪓","Kivágtad az utat!"],["🐊","Krokodilos mocsár következik!","🪨","Átugrálsz a köveken!"],["🚪","Bezárt kapu előtt állsz!","🔑","Kinyílt a kapu!"],["⛰️","Meredek hegy magasodik előtted!","⛏️","Lépcsőt vájtál a hegybe!"],["🐉","Alvó sárkány torlaszolja az utat!","🎵","Elaltattad a sárkányt!"],["🌋","Forró láva folyik előtted!","🧊","Jégösvény fagyott a lávára!"]];
const $=id=>document.getElementById(id);
const V=$("view"),Wd=$("world"),HH=1566,R=118;
const E=["🐣","🐥","🦊","🐯","🦁","🐲","🦄","🚀","🧠","🔮","⚡","🏆"],HU=[340,318,292,266,240,216,194,172,150,128,24,4];
const DC=["🌲","🌳","🌸","🍄","🌾","🪨","🌷","🌲"];
let g=0,i=0,miss=0,busy=true,run=0,W=0,P=[],N=[],hero,Q=[];
const T=(f,ms)=>{const r=run;setTimeout(()=>{if(r===run)f()},ms)};
const show=s=>["menu","game"].forEach(k=>$(k).classList.toggle("hide",k!==s));
["Alsó tagozat (1–4. osztály)","Felső tagozat (5–8. osztály)","Középiskola (9–12. osztály)"].forEach((t,s)=>{const h=document.createElement("div");h.className="sec";h.textContent=t;const gr=document.createElement("div");gr.className="grid";$("gr").append(h,gr);for(let n=s*4;n<s*4+4;n++){const b=document.createElement("button");b.className="t";b.style.setProperty("--h",HU[n]);b.innerHTML=`<span>${E[n]}</span><b>${n+1}.</b>`;b.onclick=()=>start(n);gr.appendChild(b)}});
const side=k=>{const[x,y]=P[k+1];return[x+(x>W/2?-72:32),y-26]};
const on=k=>{const[x,y]=P[k+1];return[x-23,y-48]};
const hp=a=>{hero.style.left=a[0]+"px";hero.style.top=a[1]+"px"};
function add(t,c,l,tp,id){const s=document.createElement("span");s.className=c;s.textContent=t;s.style.left=l+"px";s.style.top=tp+"px";if(id)s.id=id;Wd.appendChild(s);return s}
function build(){
  W=V.clientWidth;Wd.style.width=W+"px";Wd.style.height=HH+"px";
  const A=Math.min(100,W*.27);P=[];
  for(let k=-1;k<=10;k++)P.push([W/2+A*Math.sin(k*1.15),HH-180-k*R]);
  let s="";
  for(let j=0;j<11;j++){const[a,b]=P[j],[c,d]=P[j+1],m=(b+d)/2,p=`M${a} ${b}C${a} ${m} ${c} ${m} ${c} ${d}`;s+=`<g id="g${j}"><path class="sb" d="${p}"/><path class="sg" d="${p}"/></g>`}
  Wd.innerHTML=`<svg id="svg" viewBox="0 0 ${W} ${HH}">${scene()}${s}</svg>`;
  add("☀️","dc c sun",W-90,24);add("☁️","dc c",20,60);add("☁️","dc c",W*.45,120);add("☁️","dc c",W-110,170);add("🎈","dc q",W*.14,200);add("🦋","dc q",W*.62,700);add("🐝","dc q",W*.18,1030);
  add("🏕️","dc",P[0][0]-60,P[0][1]-10);
  for(let k=0;k<=10;k++){const[x,y]=P[k+1],o=(k%3)*16;add(DC[k%8],"dc",x<W/2?W-44-o:10+o,y-22+(k%2)*26);if(k%2)add(DC[(k+3)%8],"dc",x<W/2?W-90-o:60+o,y+40)}
  for(let k=0;k<16;k++)add(["🌼","🌷","🌻","🌺"][k%4],"dc",k%2?8+k*3%30:W-44-k*3%30,330+k*62);N=[];
  for(let k=0;k<=10;k++){const b=document.createElement("button"),r=k==10?46:36;b.style.left=P[k+1][0]-r+"px";b.style.top=P[k+1][1]-r+"px";b.onclick=()=>tap(k);Wd.appendChild(b);N.push(b)}
  const q=P[11];add("👸","dc q",q[0]+(q[0]>W/2?58:-92),q[1]-50).style.fontSize="48px";
  hero=add("🤴","",0,0,"hero");
}
function refresh(){
  N.forEach((b,k)=>{const st=k==10?(i==10?"done":"lock"):k<i?"done":k==i?"cur":"lock";b.className="node "+(k==10?"cas ":"")+st;b.style.setProperty("--h",k*34);if(k<10)b.dataset.n=k<i?"✓":k+1;b.innerHTML="<i>"+(k==10?"🏰":k<i?O[k][2]:O[k][0])+"</i>"});
  for(let j=0;j<11;j++)$("g"+j).classList.toggle("d",i>=j);
  $("pill").textContent="⭐ "+i+"/10";$("pill").style.setProperty("--p",i*10+"%");
}
function wv(y,a,p){let d="M0 "+y;for(let x=0;x<=W+12;x+=12)d+="L"+x+" "+(y+a*Math.sin(x/46+p)).toFixed(1);return d+"L"+W+" "+HH+"L0 "+HH+"Z"}
function px(y){for(let j=0;j<11;j++){const a=P[j],b=P[j+1];if(a[1]>=y&&b[1]<=y)return a[0]+(b[0]-a[0])*(a[1]-y)/(a[1]-b[1])}return W/2}
function rb(){const c=W/2,r=Math.min(W*.46,230);return["#ff4d6d","#ff9f1c","#ffe14a","#3ddc84","#2cb5ff","#9b5de5"].map((k,j)=>{const q=r-j*10;return`<path d="M${c-q} 292A${q} ${q} 0 0 1 ${c+q} 292" fill="none" stroke="${k}" stroke-width="11" opacity=".92"/>`}).join("")}
function scene(){
  let t=`<defs><linearGradient id="gz1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2f7ff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient><linearGradient id="gz2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6df08a"/><stop offset="1" stop-color="#1fbf68"/></linearGradient><linearGradient id="gz3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f76e"/><stop offset="1" stop-color="#7fe05a"/></linearGradient><radialGradient id="hl"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient></defs><circle cx="${P[11][0]}" cy="${P[11][1]}" r="150" fill="url(#hl)"/>`;t+=rb();
  for(let x=-30,n=0;x<W;x+=92,n++){const h=60+(n*37)%48,m=x+55,y=275-h,c=h*.28,w=c*55/(h+10);t+=`<path class="z0" d="M${x} 290L${m} ${y}L${x+110} 290Z"/><path class="sn" d="M${m} ${y}L${m-w} ${y+c}L${m+w} ${y+c}Z"/>`}
  t+=`<path class="z1" d="${wv(265,9,0)}"/><path class="z2" d="${wv(620,12,2)}"/><path class="z3" d="${wv(975,12,4)}"/>`;
  [["Hófödte hegyek",265],["Susogó erdő",620],["Zöld rét",975]].forEach(([n,y])=>{const x=px(y)<W/2?W-86:86;t+=`<rect class="rr" x="${x-70}" y="${y-16}" width="140" height="32" rx="16"/><text class="rt" x="${x}" y="${y+5}">${n}</text>`});
  return t}
function burst(x,y){for(let n=0;n<14;n++){const e=add(["✨","⭐","💛","🌟"][n%4],"pt",x,y),a=n/14*6.28,r=60+Math.random()*70;e.style.setProperty("--dx",Math.cos(a)*r+"px");e.style.setProperty("--dy",Math.sin(a)*r+"px");setTimeout(()=>e.remove(),1100)}}
function cam(k,s){const[x,y]=P[k+1];Wd.style.transformOrigin=x+"px "+y+"px";Wd.style.transform=`translate(${W/2-x}px,${innerHeight*.3-(y-V.scrollTop)}px) scale(${s})`}
function focusNode(k,sm=true){V.scrollTo({top:Math.max(0,P[k+1][1]-innerHeight*.58),behavior:sm?"smooth":"auto"})}
const SC={0:1};/* jelenettel rendelkező akadályok: 0 = széles folyó */
function setSh(){$('scn').style.setProperty('--sh',$('sheet').offsetHeight+'px')}
function openScene(k){const s=$('scn');$('mg').className='';$('mg').textContent=O[k][0]+' '+O[k][1];$('qt').textContent=Q[k][0];setSh();s.className='';void s.getBoundingClientRect();s.classList.add('on')}
function play(){$('scn').classList.add('go')}
function wrongScene(){const s=$('scn');if(!s.classList.contains('on'))return;s.classList.remove('no');void s.getBoundingClientRect();s.classList.add('no')}
function endScene(){const s=$('scn');s.classList.remove('on');setTimeout(()=>{if(!s.classList.contains('on'))s.classList.remove('go','no')},700)}
function unzoom(){endScene();$("sheet").classList.remove("up");Wd.style.transform="none";V.style.overflow="";document.body.classList.remove("z")}
function start(n){
  run++;g=n;i=0;miss=0;busy=true;Q=gen(n);$("gt").textContent=(n+1)+". osztály";
  $("win").classList.add("hide");show("game");unzoom();build();hp(side(-1));refresh();V.scrollTop=0;
  T(()=>{hp(side(0));focusNode(0)},900);T(()=>busy=false,2300);
}
function tap(k){
  if(busy)return;
  if(k>i||(k==10&&i<10))return void N[k].animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:260});
  if(k<i||k==10)return;
  busy=true;document.body.classList.add("z");if(SC[i])openScene(i);else{V.style.overflow="hidden";cam(i,2.3)}
  T(()=>{$("mg").className="";$("mg").textContent=O[i][0]+" "+O[i][1];$("qt").textContent=Q[i][0];$("in").value="";$("sheet").classList.add("up");busy=false},SC[i]?1300:900);
}
function num(s){
  s=s.trim().replace(/[−–]/g,"-").replace(",",".");if(!s)return null;
  if(/^-?\d+(\.\d+)?\/\d+$/.test(s)){const[a,b]=s.split("/");return +a/+b}
  const n=Number(s);return isNaN(n)?null:n;
}
function check(){
  if(busy)return;const v=num($("in").value);if(v===null)return;
  if(Math.abs(v-Q[i][1])<1e-6){
    busy=true;const k=i;$("mg").className="ok";$("mg").textContent="✅ Helyes! "+O[k][3];
    i++;const S=SC[k]?6000:0;if(S){T(()=>$('sheet').classList.remove('up'),900);T(play,1100);T(()=>{endScene();refresh();N[k].classList.add('pop');hp(on(k));burst(P[k+1][0],P[k+1][1])},S)}else{refresh();N[k].classList.add('pop');hp(on(k));burst(P[k+1][0],P[k+1][1])}
    const nx=i>9?10:i;
    if(!S)T(()=>$("sheet").classList.remove("up"),1500);
    T(()=>{unzoom();hp(side(nx))},S+1900);
    T(()=>focusNode(nx),S+2900);
    T(()=>{i>9?fin():busy=false},S+(i>9?4400:3700));
  }else{
    miss++;wrongScene();$("mg").className="bad";$("mg").textContent="❌ Ez nem az igazi, próbáld újra!";
    const s=$("sheet");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");$("in").select();
  }
}
function fin(){
  const s=miss<=1?3:miss<=4?2:1;
  $("stars").textContent="⭐".repeat(s)+"☆".repeat(3-s);
  $("sum").textContent=(g+1)+". osztály kész! "+(miss?miss+" hibás próbálkozás volt.":"Egyetlen hibád sem volt!");
  for(let n=0;n<40;n++){const c=document.createElement("span");c.className="cf";c.textContent=["🎉","⭐","✨","🎊","💛"][n%5];c.style.left=Math.random()*100+"%";c.style.animationDelay=Math.random()*1.6+"s";$("win").appendChild(c);setTimeout(()=>c.remove(),5200)}
  $("win").classList.remove("hide");
}
function menu(){run++;unzoom();$("win").classList.add("hide");show("menu")}
$("ok").onclick=check;
$("in").onkeydown=e=>{if(e.key==="Enter")check()};
$("mn").onclick=()=>{$("in").value="-"+$("in").value.replace(/^-/,"");$("in").focus()};
$("x").onclick=()=>{if(busy)return;busy=true;unzoom();T(()=>busy=false,1000)};
$("bk").onclick=menu;$("other").onclick=menu;$("again").onclick=()=>start(g);
</script></body></html>
