<style>
:root{--ink:#2b1a5c;--card:#fff;--s1:#2fb4ff;--s2:#c9f3ff;--g1:#b8f26a;--g2:#22c870;--line:#d9ccff;--acc:#9b3dff;--accd:#6a1fd1;--gold:#ffd21f;--goldd:#e29a00;--lock:#e6e0ff;--lockd:#b9aef0;--path:#ffe27a;--pathd:#f3a52b;--ok:#15803d;--bad:#d92d2d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#mn{width:52px;border-radius:14px;background:#ffd21f;box-shadow:0 4px 0 #e29a00;font-size:26px}
.btn{display:block;width:100%;border-radius:16px;padding:12px;font-weight:800;font-size:19px;color:#fff;background:linear-gradient(#6ee787,#22c55e);box-shadow:0 6px 0 #138a40;margin-top:12px}

.node[data-n]::after{content:attr(data-n);position:absolute;top:-8px;right:-10px;min-width:27px;height:27px;border-radius:14px;background:#fff;color:var(--ink);font:800 15px/27px "Baloo 2",sans-serif;text-align:center;box-shadow:0 3px 0 var(--line)}

</style></head><body>
<section id="menu">
<div class="scene"><span style="left:7%;top:16px;font-size:46px">☁️</span><span style="right:9%;top:10px;font-size:52px">☀️</span><span style="left:50%;top:28px;font-size:100px;transform:translateX(-50%)">🏰</span><span style="left:15%;bottom:34px;font-size:54px">🤴</span><span class="q" style="right:14%;bottom:40px;font-size:54px">👸</span></div>
<h1 class="logo">Út a királynőhöz</h1>
<p>Válaszd ki az osztályodat! A feladatok a NAT2020 tananyagát követik, és minden indításkor újak.</p>

</section>

</div>

<button class="btn" id="again">Újra ezt az osztályt (új feladatok)</button><button class="btn alt" id="other">Másik osztály</button></div></div>
<script>
const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[rn(0,a.length-1)],sh=a=>{for(let i=a.length;i>1;){const j=rn(0,--i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>(""+n).replace(".",",").replace("-","−"),pr=n=>n<0?`(${f(n)})`:f(n),sg=(n,v="")=>n?(n<0?"− ":"+ ")+(Math.abs(n)==1&&v?"":Math.abs(n))+v:"";
const SU="⁰¹²³⁴⁵⁶⁷⁸⁹",SB="₀₁₂₃₄₅₆₇₈₉",sup=n=>[...""+n].map(c=>c=="-"?"⁻":SU[c]).join(""),sub=n=>[...""+n].map(c=>SB[c]).join("");
const gcd=(a,b)=>b?gcd(b,a%b):a,fa=n=>n<2?1:n*fa(n-1),cb=(n,k)=>fa(n)/(fa(k)*fa(n-k));
const ad=(l,h)=>()=>{const a=rn(l,h),b=rn(l,h);return[`${a} + ${b}`,a+b]},sb=(l,h)=>()=>{const a=rn(l+1,h),b=rn(l,a-1);return[`${a} − ${b}`,a-b]},ml=(a,b,c,d)=>()=>{const x=rn(a,b),y=rn(c,d);return[`${x} · ${y}`,x*y]},dv=(a,b,c,d)=>()=>{const q=rn(a,b),y=rn(c,d);return[`${q*y} : ${y}`,q]},lin=l=>()=>{const x=rn(l,9)||3,a=rn(3,9),c=rn(1,a-1),b=rn(-9,9)||4;return[`Oldd meg: ${a}x ${sg(b)} = ${c}x ${sg(a*x+b-c*x)}.  x = ?`,x]},rect=()=>{const a=rn(3,12),b=rn(3,15);return[`Egy téglalap területe ${a*b} cm², egyik oldala ${a} cm. Mekkora a másik oldal (cm)?`,b]},mean=()=>{const a=[rn(4,20),rn(4,20),rn(4,20),rn(4,20)];a[3]+=(4-a.reduce((x,y)=>x+y)%4)%4;return[`Számítsd ki az átlagot: ${a.join(", ")}`,a.reduce((x,y)=>x+y)/4]};
const NM={2:"fele",3:"harmada",4:"negyede",5:"ötöde",10:"tizede"};
