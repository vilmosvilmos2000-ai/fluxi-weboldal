<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pénz Követés Egyszerűen</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4ef;--panel:#fff;--deep:#e0ebe3;--line:#d3e0d7;--text:#14201a;--muted:#5a6b60;--acc:#1c9a52;--ink:#fff;--exp:#cf3248;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--panel:#1a211d;--deep:#131b17;--line:#28342c;--text:#e8ece9;--muted:#8d9b92;--acc:#b3f5c2;--ink:#121614;--exp:#fb7185}}
:root[data-theme="dark"]{--bg:#121614;--panel:#1a211d;--deep:#131b17;--line:#28342c;--text:#e8ece9;--muted:#8d9b92;--acc:#b3f5c2;--ink:#121614;--exp:#fb7185}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{margin:0;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px}
@media(min-width:900px){main{grid-template-columns:5fr 7fr;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
h2{font-size:15px;font-weight:800;margin:0 0 14px}
.col{display:grid;gap:20px}
.wallet{position:relative;width:300px;max-width:100%;height:240px;margin:8px auto 0;cursor:pointer;border:0;background:none;padding:0;display:block}
.back{position:absolute;left:5px;bottom:0;width:290px;height:190px;border-radius:24px 24px 48px 48px;background:var(--deep);border:1px solid var(--line)}
.card{position:absolute;left:20px;bottom:46px;width:260px;height:150px;border-radius:16px;padding:16px;text-align:left;color:#14201a;background:linear-gradient(135deg,#b3f5c2,#6fd490);box-shadow:0 8px 22px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.card b{font-weight:800}
.card .lbl{font-size:11px;opacity:.75;margin-top:46px}
.card .amt{font-size:22px;font-weight:800;letter-spacing:-.01em}
.chip{position:absolute;right:16px;top:16px;width:34px;height:24px;border-radius:6px;background:#1e2822;opacity:.85}
.pocket{position:absolute;left:5px;bottom:0;width:290px;height:128px;border-radius:0 0 46px 46px;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--acc);padding-top:16px;text-align:center}
.pocket small{color:var(--muted);font-size:12px}
.pocket div{font-weight:800;color:var(--acc);filter:brightness(.9)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .pocket div{color:var(--text)}}
.wallet.open .card{transform:translateY(-78px) scale(1.04)}
@media(hover:hover){.wallet:hover .card{transform:translateY(-78px) scale(1.04)}}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat strong{font-size:16px;font-weight:800}
.inc{color:var(--acc)}.exp{color:var(--exp)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .inc{color:#12794010;color:#127940}}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px}
input:focus{border-color:var(--acc);outline:none}
.field{margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.q{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.q:hover{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;background:none;transition:background .15s}
.btn.i{border-color:var(--acc);background:var(--acc);color:var(--ink)}
.btn.e{border-color:var(--exp);color:var(--exp)}
.btn.e:hover,.btn.danger:hover{background:color-mix(in srgb,var(--exp) 12%,transparent)}
.btn.i:hover{filter:brightness(1.08)}
.btn.danger{width:100%;border-color:var(--line);color:var(--exp);font-size:13px}
.btn.danger.sure{border-color:var(--exp);background:var(--exp);color:#fff}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
#list{display:grid;gap:8px;max-height:560px;overflow-y:auto}
.tx{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 12%,transparent)}
.tx .m{flex:1;min-width:0}
.tx .n{font-weight:700;overflow-wrap:anywhere}
.tx .d{font-size:12px;color:var(--muted)}
.tx .v{font-weight:800;white-space:nowrap}
.x{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.x:hover{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--acc);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--exp);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<div><h1>Pénz Követés Egyszerűen</h1><p class="sub">Az adataid csak ezen az eszközön vannak</p></div>
<span class="sub"><span class="dot"></span>Aktív</span>
</div></header>

<main>
<div class="col">
<section class="panel">
<button class="wallet" id="wallet" aria-expanded="false" aria-label="Kártya kihúzása és visszatétele">
<span class="back"></span>
<span class="card"><b>Digital Card</b><span class="chip"></span><div class="lbl">Elérhető egyenleg</div><div class="amt bal">0 Ft</div></span>
<span class="pocket"><small>Tárca állapota</small><div class="bal">0 Ft</div></span>
</button>
<p class="hint">Koppints a tárcára, és kihúzod a kártyát</p>
</section>

<section class="panel">
<div class="stats">
<div class="stat"><span>Bevételek</span><strong class="inc" id="sInc">0 Ft</strong></div>
<div class="stat"><span>Kiadások</span><strong class="exp" id="sExp">0 Ft</strong></div>
</div>
</section>

<section class="panel">
<h2>Új tranzakció</h2>
<div class="field"><label for="txName">Megnevezés</label><input id="txName" maxlength="60" placeholder="pl. Zsebpénz, Játék" autocomplete="off"></div>
<div class="field"><label for="txAmount">Összeg (Ft)</label><input id="txAmount" type="number" inputmode="numeric" min="1" placeholder="0"></div>
<div class="chips" id="chips"><button class="q" data-v="500">500</button><button class="q" data-v="1000">1 000</button><button class="q" data-v="5000">5 000</button><button class="q" data-v="10000">10 000</button></div>
<div class="two">
<button class="btn i" id="bInc">Bevétel hozzáadása</button>
<button class="btn e" id="bExp">Kiadás levonása</button>
</div>
</section>

<section class="panel">
<button class="btn danger" id="clear">Az eszköz adatainak törlése</button>
<p class="note">Véglegesen törli az egyenleget és az előzményeket erről az eszközről.</p>
</section>
</div>

<section class="panel">
<div class="head">
<h2>Előzmények <span class="sub" id="count"></span></h2>
<div class="tabs" id="tabs">
<button class="tab" data-f="all" aria-pressed="true">Mind</button>
<button class="tab" data-f="income" aria-pressed="false">Bevétel</button>
<button class="tab" data-f="expense" aria-pressed="false">Kiadás</button>
</div>
</div>
<div id="list"></div>
</section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='digital_wallet_device_data_v2';
let tx=[],filter='all',clearTimer=null,toastTimer=null;
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('hu-HU',{style:'currency',currency:'HUF',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const sum=t=>tx.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);
const balance=()=>sum('income')-sum('expense');
const when=id=>new Date(id).toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.transactions))
      tx=s.transactions.filter(t=>t&&isFinite(t.amount)&&isFinite(t.id)).map(t=>({id:+t.id,name:String(t.name),amount:+t.amount,type:t.type==='income'?'income':'expense'}));
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({balance:balance(),transactions:tx}));}catch(e){}
}
function toast(msg,err){
  const t=$('toast');t.textContent=msg;t.className='show'+(err?' err':'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',2600);
}
const upI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
const dnI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
const xI='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function render(){
  document.querySelectorAll('.bal').forEach(e=>e.textContent=fmt(balance()));
  $('sInc').textContent=fmt(sum('income'));$('sExp').textContent=fmt(sum('expense'));
  const rows=tx.filter(t=>filter==='all'||t.type===filter);
  $('count').textContent='('+rows.length+' db)';
  $('list').innerHTML=rows.length?rows.map(t=>{
    const inc=t.type==='income';
    return `<div class="tx"><div class="ic ${inc?'inc':'exp'}">${inc?upI:dnI}</div>
<div class="m"><div class="n">${esc(t.name)}</div><div class="d">${when(t.id)}</div></div>
<div class="v ${inc?'inc':'exp'}">${inc?'+':'−'}${fmt(t.amount)}</div>
<button class="x" data-id="${t.id}" aria-label="Tranzakció törlése: ${esc(t.name)}">${xI}</button></div>`;
  }).join(''):`<div class="empty">${tx.length?'Ebben a nézetben nincs tranzakció.':'Még nincs tranzakció. Adj hozzá egyet a bal oldali űrlapon.'}</div>`;
}
function add(type){
  const name=$('txName').value.trim(),amount=Math.round(parseFloat($('txAmount').value));
  if(!name)return toast('Add meg, mire szól a tranzakció.',true);
  if(!isFinite(amount)||amount<=0)return toast('Az összeg legyen nagyobb, mint 0.',true);
  if(type==='expense'&&amount>balance())return toast('Nincs elég egyenleg: '+fmt(balance())+' van a kártyán.',true);
  tx.unshift({id:Date.now(),name,amount,type});
  save();render();
  $('txName').value='';$('txAmount').value='';
  toast(type==='income'?'Bevétel hozzáadva':'Kiadás levonva');
}
function remove(id){
  const t=tx.find(x=>x.id===id);if(!t)return;
  if(t.type==='income'&&balance()-t.amount<0)return toast('Ezt a bevételt nem törölheted, mert az egyenleg negatív lenne.',true);
  tx=tx.filter(x=>x.id!==id);save();render();toast('Tranzakció törölve');
}

$('bInc').onclick=()=>add('income');
$('bExp').onclick=()=>add('expense');
$('txAmount').addEventListener('keydown',e=>{if(e.key==='Enter')$('txName').value.trim()?add('income'):$('txName').focus();});
$('chips').onclick=e=>{const v=e.target.dataset.v;if(v){$('txAmount').value=v;$('txAmount').focus();}};
$('list').onclick=e=>{const b=e.target.closest('.x');if(b)remove(+b.dataset.id);};
$('tabs').onclick=e=>{
  const f=e.target.dataset.f;if(!f)return;filter=f;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));render();
};
$('wallet').onclick=()=>{const w=$('wallet');w.setAttribute('aria-expanded',w.classList.toggle('open'));};
$('clear').onclick=()=>{
  const b=$('clear');
  if(!b.classList.contains('sure')){
    b.classList.add('sure');b.textContent='Biztosan? Koppints még egyszer';
    clearTimer=setTimeout(()=>{b.classList.remove('sure');b.textContent='Az eszköz adatainak törlése';},4000);return;
  }
  clearTimeout(clearTimer);b.classList.remove('sure');b.textContent='Az eszköz adatainak törlése';
  tx=[];try{localStorage.removeItem(KEY);}catch(e){}
  render();toast('Az adatok törölve',true);
};
load();render();
</script>
</body>
</html>
