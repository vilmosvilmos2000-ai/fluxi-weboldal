<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Schematic Nézegető</title>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            width: 100%;
        }
        canvas { display: block; touch-action: none; }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 85%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: white;
        }

        input[type="file"] { display: none; }

        .upload-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        .upload-btn:active { transform: scale(0.97); }

        #instructions {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
            word-break: break-word;
        }

        #status-banner {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            max-width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="status-banner"></div>
    <div id="ui-container">
        <label class="upload-btn">
            📁 Schematic kiválasztása
            <input type="file" id="fileInput" accept=".schematic,.litematic,.mcstructure">
        </label>
        <div id="instructions">
            Kezdéshez válassz ki egy fájlt!<br>
            👆 1 ujj: Forgatás | ✌️ 2 ujj / görgő: Nagyítás
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.2.0/pako.min.js"></script>
    <script>
    (function () {
        'use strict';

        // ---------- Alapjelenet ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 40, 200);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        document.body.appendChild(renderer.domElement);

        // Jobb Minecraft-szerű világítás
        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a5a2a, 0.55);
        scene.add(hemiLight);
        const directionalLight = new THREE.DirectionalLight(0xfff5e0, 0.85);
        directionalLight.position.set(30, 50, 20);
        scene.add(directionalLight);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0xffffff);
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        let schematicGroup = new THREE.Group();
        scene.add(schematicGroup);

        // ---------- Kamera vezérlés ----------
        let target = new THREE.Vector3(0, 3, 0);
        let radius = 18, theta = Math.PI / 4, phi = Math.PI / 3;

        function updateCamera() {
            phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi));
            radius = Math.max(0.3, Math.min(400, radius));
            const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
            const y = target.y + radius * Math.cos(phi);
            const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
            camera.position.set(x, y, z);
            camera.lookAt(target);
        }
        updateCamera();

        const pointers = new Map();
        let lastPinchDist = null;
        const dom = renderer.domElement;

        dom.addEventListener('pointerdown', (e) => {
            dom.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        dom.addEventListener('pointerup', (e) => { pointers.delete(e.pointerId); lastPinchDist = null; });
        dom.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); lastPinchDist = null; });
        dom.addEventListener('pointermove', (e) => {
            if (!pointers.has(e.pointerId)) return;
            const prev = pointers.get(e.pointerId);
            const curr = { x: e.clientX, y: e.clientY };
            pointers.set(e.pointerId, curr);

            if (pointers.size === 1) {
                const dx = curr.x - prev.x, dy = curr.y - prev.y;
                theta -= dx * 0.006;
                phi -= dy * 0.006;
                updateCamera();
            } else if (pointers.size >= 2) {
                const pts = Array.from(pointers.values());
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                if (lastPinchDist != null) {
                    radius -= (dist - lastPinchDist) * 0.05;
                    updateCamera();
                }
                lastPinchDist = dist;
            }
        });
        dom.addEventListener('wheel', (e) => {
            radius += e.deltaY * 0.02;
            updateCamera();
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        const instructionsEl = document.getElementById('instructions');
        const bannerEl = document.getElementById('status-banner');
        function setStatus(text) { instructionsEl.innerHTML = text; }
        function setBanner(text, show) {
            bannerEl.innerHTML = text;
            bannerEl.style.display = show ? 'block' : 'none';
        }

        // ---------- NBT olvasó (ugyanaz) ----------
        function NBTReader(buffer, littleEndian) {
            this.view = new DataView(buffer);
            this.offset = 0;
            this.little = !!littleEndian;
            this.decoder = new TextDecoder('utf-8');
        }
        NBTReader.prototype.readByte = function () { const v = this.view.getInt8(this.offset); this.offset += 1; return v; };
        NBTReader.prototype.readUByte = function () { const v = this.view.getUint8(this.offset); this.offset += 1; return v; };
        NBTReader.prototype.readShort = function () { const v = this.view.getInt16(this.offset, this.little); this.offset += 2; return v; };
        NBTReader.prototype.readUShort = function () { const v = this.view.getUint16(this.offset, this.little); this.offset += 2; return v; };
        NBTReader.prototype.readInt = function () { const v = this.view.getInt32(this.offset, this.little); this.offset += 4; return v; };
        NBTReader.prototype.readLong = function () { const v = this.view.getBigInt64(this.offset, this.little); this.offset += 8; return v; };
        NBTReader.prototype.readFloat = function () { const v = this.view.getFloat32(this.offset, this.little); this.offset += 4; return v; };
        NBTReader.prototype.readDouble = function () { const v = this.view.getFloat64(this.offset, this.little); this.offset += 8; return v; };
        NBTReader.prototype.readString = function () {
            const len = this.readUShort();
            const bytes = new Uint8Array(this.view.buffer, this.offset, len);
            this.offset += len;
            return this.decoder.decode(bytes);
        };
        NBTReader.prototype.readByteArray = function () {
            const len = this.readInt();
            const arr = new Int8Array(this.view.buffer.slice(this.offset, this.offset + len));
            this.offset += len;
            return arr;
        };
        NBTReader.prototype.readIntArray = function () {
            const len = this.readInt();
            const arr = new Int32Array(len);
            for (let i = 0; i < len; i++) arr[i] = this.readInt();
            return arr;
        };
        NBTReader.prototype.readLongArray = function () {
            const len = this.readInt();
            const arr = new BigInt64Array(len);
            for (let i = 0; i < len; i++) arr[i] = this.readLong();
            return arr;
        };
        NBTReader.prototype.readTagPayload = function (type) {
            switch (type) {
                case 1: return this.readByte();
                case 2: return this.readShort();
                case 3: return this.readInt();
                case 4: return this.readLong();
                case 5: return this.readFloat();
                case 6: return this.readDouble();
                case 7: return this.readByteArray();
                case 8: return this.readString();
                case 9: return this.readList();
                case 10: return this.readCompound();
                case 11: return this.readIntArray();
                case 12: return this.readLongArray();
                default: throw new Error('Ismeretlen NBT tag típus: ' + type + ' (offset ' + this.offset + ')');
            }
        };
        NBTReader.prototype.readList = function () {
            const type = this.readUByte();
            const len = this.readInt();
            const arr = [];
            for (let i = 0; i < len; i++) arr.push(this.readTagPayload(type));
            return arr;
        };
        NBTReader.prototype.readCompound = function () {
            const obj = {};
            while (true) {
                const type = this.readUByte();
                if (type === 0) break;
                const name = this.readString();
                obj[name] = this.readTagPayload(type);
            }
            return obj;
        };
        NBTReader.prototype.readNamedTag = function () {
            const type = this.readUByte();
            if (type === 0) return null;
            const name = this.readString();
            const value = this.readTagPayload(type);
            return { name: name, type: type, value: value };
        };

        function decompress(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
                return pako.ungzip(bytes).buffer;
            }
            try {
                return pako.inflate(bytes).buffer;
            } catch (e) {
                return buffer;
            }
        }

        // ---------- Blokk-szín paletta ----------
        const BLOCK_COLORS = {

            diorite: 0xc0c0c0, polished_diorite: 0xc8c8c8,
            andesite: 0x8a8a8a, polished_andesite: 0x8a8a8a,
            deepslate: 0x3a3a3e, cobbled_deepslate: 0x3a3a3e, polished_deepslate: 0x3a3a3e,
            deepslate_bricks: 0x3a3a3e, deepslate_tiles: 0x3a3a3e, chiseled_deepslate: 0x3a3a3e,
            tuff: 0x6a6a5a, polished_tuff: 0x6a6a5a, tuff_bricks: 0x6a6a5a,
            basalt: 0x4a4a4a, polished_basalt: 0x4a4a4a, smooth_basalt: 0x4a4a4a,
            blackstone: 0x2a2a2a, polished_blackstone: 0x2a2a2a, gilded_blackstone: 0x3a2a1a,
            calcite: 0xe8e4d8, dripstone_block: 0x8a6a4a,

            grass_block: 0x5a8f3c, grass: 0x5a8f3c, farmland: 0x5a3d23,
            podzol: 0x6b4a2b, mycelium: 0x6b5a6b, mud: 0x4c4032,
            moss_block: 0x4a7a3a,
            oak_planks: 0xb08552, spruce_planks: 0x7a5836, birch_planks: 0xd8c98a,
            jungle_planks: 0xb07a4a, acacia_planks: 0xc07a4a, dark_oak_planks: 0x4a2a1a,
            mangrove_planks: 0x7a3a3a, cherry_planks: 0xe8b0b0, bamboo_planks: 0xc8b050,
            crimson_planks: 0x6a2a3a, warped_planks: 0x2a6a6a,
            oak_log: 0x6b4a2f, spruce_log: 0x4a3a28, birch_log: 0xd9d3bd,
            jungle_log: 0x5a3a2a, acacia_log: 0x6a4a2a, dark_oak_log: 0x3a2a1a,
            mangrove_log: 0x5a2a2a, cherry_log: 0x5a3a3a, bamboo_block: 0xc8b050,
            oak_leaves: 0x4a7a2e, spruce_leaves: 0x2e5a33, birch_leaves: 0x6fa83f,
            jungle_leaves: 0x3a7a2a, acacia_leaves: 0x5a8a2a, dark_oak_leaves: 0x2a5a2a,
            mangrove_leaves: 0x3a6a3a, cherry_leaves: 0xe8a0b0,
            sand: 0xe0d3a0, red_sand: 0xc46a2b, sandstone: 0xdccd94, red_sandstone: 0xc46a2b,

            white_stained_glass: 0xf0f0f0, orange_stained_glass: 0xe08030,
            magenta_stained_glass: 0xb050b0, light_blue_stained_glass: 0x60a0d0,
            yellow_stained_glass: 0xe0d030, lime_stained_glass: 0x80c030,
            pink_stained_glass: 0xe080a0, gray_stained_glass: 0x606060,

            purple_stained_glass: 0x8030b0, blue_stained_glass: 0x3030a0,
            brown_stained_glass: 0x6a4a2a, green_stained_glass: 0x4a7a2a,

            white_wool: 0xe9ecec, orange_wool: 0xf07613, magenta_wool: 0xbd44b3,
            light_blue_wool: 0x3aafd9, yellow_wool: 0xf8c627, lime_wool: 0x70b919,
            pink_wool: 0xed8dac, gray_wool: 0x3e4447, light_gray_wool: 0x8e8e86,
            cyan_wool: 0x158991, purple_wool: 0x792aac, blue_wool: 0x35399d,
            brown_wool: 0x724728, green_wool: 0x546d1b, red_wool: 0xa12722,
            black_wool: 0x141519, wool: 0xe9ecec,
            white_concrete: 0xcfd5d6, orange_concrete: 0xe06101, magenta_concrete: 0xa9309f,
            light_blue_concrete: 0x2389c7, yellow_concrete: 0xf1af15, lime_concrete: 0x5ea818,
            pink_concrete: 0xd5658f, gray_concrete: 0x36393d, light_gray_concrete: 0x7d7d73,
            cyan_concrete: 0x157788, purple_concrete: 0x64209c, blue_concrete: 0x2c2e8f,
            brown_concrete: 0x603b1f, green_concrete: 0x495b1a, red_concrete: 0x8e2121,
            black_concrete: 0x080a0f, concrete: 0xb0b0b0,
            terracotta: 0x9c5a44, white_terracotta: 0xd1b1a1, orange_terracotta: 0x9f5224,
            magenta_terracotta: 0x95576c, light_blue_terracotta: 0x706c8a, yellow_terracotta: 0xba8524,
            lime_terracotta: 0x677534, pink_terracotta: 0xa04d4e, gray_terracotta: 0x392a23,
            light_gray_terracotta: 0x876b61, cyan_terracotta: 0x565b5b, purple_terracotta: 0x764556,
            blue_terracotta: 0x4a3b5b, brown_terracotta: 0x4d3323, green_terracotta: 0x4c532a,
            red_terracotta: 0x8e3c2e, black_terracotta: 0x251610,
            coal_ore: 0x3a3a3a, iron_ore: 0xc2b8a3, gold_ore: 0xd9c04a, redstone_ore: 0xb4302a,
            emerald_ore: 0x3fcf7a, lapis_ore: 0x2b53c9, diamond_ore: 0x6be0d8,
            iron_block: 0xd8d8d8, gold_block: 0xf0d84a, diamond_block: 0x6be0d8,
            emerald_block: 0x3fcf7a, redstone_block: 0xb4302a, lapis_block: 0x2b53c9,

            soul_sand: 0x5a4a3a, magma_block: 0xc04a1a, glowstone: 0xe8c96b,
            end_stone: 0xdbd5a0, purpur_block: 0xa070a0,
            water: 0x3a6fd8, lava: 0xe25c22, ice: 0xa8d8f0, packed_ice: 0x9cc7e8, blue_ice: 0x70b0e0,
            snow: 0xf0f5f7, snow_block: 0xf0f5f7,
            clay: 0xa2a8b0, bricks: 0x9c5a4a, mud_bricks: 0x8a6a4f,
            quartz_block: 0xece5d8, prismarine: 0x62a89c, dark_prismarine: 0x2e6b62,
            sea_lantern: 0xcfe8e0, melon: 0x6a9e2f, pumpkin: 0xd6892a,
            hay_block: 0xc7a83a, obsidian: 0x14121a, bedrock: 0x333333, gravel: 0x8f8a83,
            bone_block: 0xe8e0d0, sculk: 0x0a2a2a, slime_block: 0x7ac030,
            door: 0x8a6a3a, fence: 0x8a6a3a, stairs: 0x9c8058, slab: 0x9c8058
        };

        const LEGACY_ID_NAMES = {
            0: 'air', 1: 'stone', 2: 'grass_block', 3: 'dirt', 4: 'cobblestone', 5: 'oak_planks',
            6: 'sapling', 7: 'bedrock', 8: 'water', 9: 'water', 10: 'lava', 11: 'lava',
            12: 'sand', 13: 'gravel', 14: 'gold_ore', 15: 'iron_ore', 16: 'coal_ore',
            17: 'oak_log', 18: 'oak_leaves', 20: 'glass', 21: 'lapis_ore', 22: 'lapis_block',
            24: 'sandstone', 35: 'wool', 41: 'gold_block', 42: 'iron_block', 43: 'stone_bricks',
            45: 'bricks', 48: 'mossy_cobblestone', 49: 'obsidian', 52: 'spawner',
            56: 'diamond_ore', 57: 'diamond_block', 58: 'oak_planks', 61: 'stone', 62: 'stone',
            79: 'ice', 80: 'snow_block', 82: 'clay', 86: 'pumpkin', 87: 'netherrack',
            89: 'glowstone', 91: 'pumpkin', 98: 'stone_bricks', 103: 'melon', 121: 'quartz_block',
            152: 'redstone_block', 153: 'nether_brick', 155: 'quartz_block', 159: 'terracotta',
            168: 'prismarine', 169: 'sea_lantern', 172: 'terracotta', 173: 'redstone_block'
        };

        function normalizeName(name) {
            let n = (name || 'unknown').replace('minecraft:', '');
            n = n.split('[')[0];
            return n;
        }
        function hashColor(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
            const hue = Math.abs(h) % 360;
            return new THREE.Color('hsl(' + hue + ', 45%, 55%)').getHex();
        }
        function getBlockAppearance(rawName) {
            const name = normalizeName(rawName);
            let color = BLOCK_COLORS[name];
            if (color === undefined) {
                for (const key in BLOCK_COLORS) {
                    if (name === key || name.startsWith(key + '_') || name.indexOf(key) !== -1) {
                        color = BLOCK_COLORS[key];
                        break;
                    }
                }
            }
            if (color === undefined) color = hashColor(name);
            const alpha = (name.indexOf('glass') !== -1 || name === 'water' || name.indexOf('ice') !== -1 || name.indexOf('slime') !== -1) ? 0.55 : 1;
            return { color: color, alpha: alpha };
        }
        function isAir(name) {
            const n = normalizeName(name);
            return n === 'air' || n === 'cave_air' || n === 'void_air' || n === '';
        }

        // ---------- Minecraft-szerű pixel textúra generátor ----------
        const textureCache = new Map();

        function createBlockTexture(hexColor, size) {
            size = size || 16;
            const key = hexColor + '_' + size;
            if (textureCache.has(key)) return textureCache.get(key);

            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const r = (hexColor >> 16) & 255;
            const g = (hexColor >> 8) & 255;
            const b = hexColor & 255;

            // Alap szín + enyhe zaj (Minecraft-szerű)
            const imageData = ctx.createImageData(size, size);
            const data = imageData.data;

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = (y * size + x) * 4;
                    // Enyhe pixelzaj + enyhe sötétítés a széleken
                    const noise = (Math.random() - 0.5) * 28;
                    const edge = (x === 0 || y === 0 || x === size - 1 || y === size - 1) ? -18 : 0;
                    data[i]     = Math.max(0, Math.min(255, r + noise + edge));
                    data[i + 1] = Math.max(0, Math.min(255, g + noise + edge));
                    data[i + 2] = Math.max(0, Math.min(255, b + noise + edge));
                    data[i + 3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.generateMipmaps = false;
            textureCache.set(key, tex);
            return tex;
        }

        // ---------- Formátum-parszerek (ugyanaz) ----------
        function parseLegacySchematic(root) {
            const width = root.Width, height = root.Height, length = root.Length;
            const blocksArr = root.Blocks;
            const add = root.AddBlocks;
            const result = [];
            for (let y = 0; y < height; y++) {
                for (let z = 0; z < length; z++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * length + z) * width + x;
                        let id = blocksArr[idx] & 0xFF;
                        if (add) {
                            const addIdx = idx >> 1;
                            const nibble = (idx % 2 === 0) ? (add[addIdx] & 0x0F) : ((add[addIdx] >> 4) & 0x0F);
                            id |= nibble << 8;
                        }
                        if (id === 0) continue;
                        const name = LEGACY_ID_NAMES[id] || ('id_' + id);
                        if (isAir(name)) continue;
                        result.push({ x: x, y: y, z: z, name: name });
                    }
                }
            }
            return result;
        }

        function parseLitematic(root) {
            const regions = root.Regions;
            const result = [];
            if (!regions) throw new Error('Nem található "Regions" mező — nem litematic fájl?');
            for (const regionName in regions) {
                const region = regions[regionName];
                const size = region.Size, pos = region.Position;
                if (!size || !pos) continue;
                const sx = size.x, sy = size.y, sz = size.z;
                const absX = Math.abs(sx), absY = Math.abs(sy), absZ = Math.abs(sz);
                const minX = sx < 0 ? pos.x + sx + 1 : pos.x;
                const minY = sy < 0 ? pos.y + sy + 1 : pos.y;
                const minZ = sz < 0 ? pos.z + sz + 1 : pos.z;
                const palette = region.BlockStatePalette;
                const states = region.BlockStates;
                if (!palette || !states || absX === 0 || absY === 0 || absZ === 0) continue;
                const bitsPerEntry = Math.max(2, Math.ceil(Math.log2(palette.length)));
                const mask = (1n << BigInt(bitsPerEntry)) - 1n;
                const total = absX * absY * absZ;
                for (let i = 0; i < total; i++) {
                    const y = Math.floor(i / (absX * absZ));
                    const rem = i % (absX * absZ);
                    const z = Math.floor(rem / absX);
                    const x = rem % absX;
                    const startBit = BigInt(i) * BigInt(bitsPerEntry);
                    const longIndex = Number(startBit / 64n);
                    const startOffset = Number(startBit % 64n);
                    let value;
                    const lo = BigInt.asUintN(64, states[longIndex]) >> BigInt(startOffset);
                    if (startOffset + bitsPerEntry <= 64) {
                        value = lo & mask;
                    } else {
                        const hi = BigInt.asUintN(64, states[longIndex + 1]) << BigInt(64 - startOffset);
                        value = (lo | hi) & mask;
                    }
                    const paletteIndex = Number(value);
                    const entry = palette[paletteIndex];
                    if (!entry || !entry.Name || isAir(entry.Name)) continue;
                    result.push({ x: minX + x, y: minY + y, z: minZ + z, name: entry.Name });
                }
            }
            return result;
        }

        function parseMcstructure(buffer) {
            const reader = new NBTReader(buffer, true);
            const rootTag = reader.readNamedTag();
            if (!rootTag) throw new Error('Üres mcstructure fájl.');
            const root = rootTag.value;
            const size = root.size;
            if (!size) throw new Error('Hiányzó "size" mező az mcstructure fájlban.');
            const sx = size[0], sy = size[1], sz = size[2];
            const structure = root.structure;
            const layer0 = structure.block_indices[0];
            const paletteList = structure.palette.default.block_palette;
            const result = [];
            for (let x = 0; x < sx; x++) {
                for (let y = 0; y < sy; y++) {
                    for (let z = 0; z < sz; z++) {
                        const idx = (x * sy + y) * sz + z;
                        const pIdx = layer0[idx];
                        if (pIdx === undefined || pIdx < 0) continue;
                        const entry = paletteList[pIdx];
                        if (!entry) continue;
                        const name = entry.name || 'unknown';
                        if (isAir(name)) continue;
                        result.push({ x: x, y: y, z: z, name: name });
                    }
                }
            }
            return result;
        }

        // ---------- Megjelenítés textúrákkal ----------
        function renderBlocks(blocks, filename) {
            scene.remove(schematicGroup);
            schematicGroup = new THREE.Group();
            scene.add(schematicGroup);

            if (!blocks || blocks.length === 0) {
                setBanner('Nem sikerült blokkot kiolvasni ebből a fájlból.', true);
                return;
            }

            const MAX_BLOCKS = 350000;
            if (blocks.length > MAX_BLOCKS) {
                const stride = Math.ceil(blocks.length / MAX_BLOCKS);
                blocks = blocks.filter((_, i) => i % stride === 0);
            }

            let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            for (const b of blocks) {
                if (b.x < minX) minX = b.x; if (b.x > maxX) maxX = b.x;
                if (b.y < minY) minY = b.y; if (b.y > maxY) maxY = b.y;
                if (b.z < minZ) minZ = b.z; if (b.z > maxZ) maxZ = b.z;
            }

            const groups = new Map();
            for (const b of blocks) {
                const app = getBlockAppearance(b.name);
                const key = app.color + '_' + app.alpha;
                if (!groups.has(key)) groups.set(key, { color: app.color, alpha: app.alpha, items: [] });
                groups.get(key).items.push(b);
            }

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const dummy = new THREE.Object3D();

            groups.forEach(function (g) {
                const tex = createBlockTexture(g.color, 16);
                const material = new THREE.MeshLambertMaterial({
                    map: tex,
                    transparent: g.alpha < 1,
                    opacity: g.alpha,
                    color: 0xffffff
                });
                const mesh = new THREE.InstancedMesh(geometry, material, g.items.length);
                g.items.forEach((b, i) => {
                    dummy.position.set(b.x - minX, b.y - minY, b.z - minZ);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });
                mesh.instanceMatrix.needsUpdate = true;
                schematicGroup.add(mesh);
            });

            const cx = (maxX - minX) / 2, cy = (maxY - minY) / 2, cz = (maxZ - minZ) / 2;
            target.set(cx, cy, cz);
            const dim = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 5);
            radius = dim * 1.6;
            theta = Math.PI / 4;
            phi = Math.PI / 3;
            updateCamera();

            setBanner('', false);
            setStatus('<b>' + filename + '</b> — ' + blocks.length.toLocaleString('hu-HU') + ' blokk<br>👆 1 ujj: Forgatás | ✌️ 2 ujj / görgő: Nagyítás');
        }

        // ---------- Fájlfeltöltés ----------
        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;
            setBanner('Betöltés: ' + file.name + '...', true);
            const reader = new FileReader();
            reader.onerror = function () {
                setBanner('Nem sikerült beolvasni a fájlt.', true);
            };
            reader.onload = function () {
                try {
                    const buffer = reader.result;
                    const ext = file.name.split('.').pop().toLowerCase();
                    let blocks;
                    if (ext === 'mcstructure') {
                        blocks = parseMcstructure(buffer);
                    } else {
                        const nbtBuffer = decompress(buffer);
                        const nbtReader = new NBTReader(nbtBuffer, false);
                        const root = nbtReader.readNamedTag();
                        if (!root) throw new Error('Üres vagy érvénytelen NBT fájl.');
                        if (ext === 'litematic') {
                            blocks = parseLitematic(root.value);
                        } else {
                            blocks = parseLegacySchematic(root.value);
                        }
                    }
                    renderBlocks(blocks, file.name);
                } catch (err) {
                    console.error(err);
                    setBanner('Hiba a fájl feldolgozása közben: ' + err.message, true);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    })();
    </script>
