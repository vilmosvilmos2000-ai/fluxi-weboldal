<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Schematic Nézegető</title>
    <style>
        html, body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; width: 100%; }
        canvas { display: block; touch-action: none; }
        #ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; width: 85%; max-width: 400px; background: rgba(20, 20, 20, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); color: white; }
        input[type="file"] { display: none; }
        .upload-btn { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; padding: 14px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; display: block; width: 100%; box-sizing: border-box; }
        .upload-btn:active { transform: scale(0.97); }
        #instructions { margin-top: 15px; font-size: 13px; opacity: 0.9; line-height: 1.4; word-break: break-word; }
        #status-banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 20; color: white; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; max-width: 90%; text-align: center; }
    </style>
</head>
<body>
    <div id="status-banner"></div>
    <div id="ui-container">
        <label class="upload-btn">📁 Schematic kiválasztása<input type="file" id="fileInput" accept=".schematic,.litematic,.mcstructure"></label>
        <div id="instructions">Kezdéshez válassz ki egy fájlt!<br>👆 1 ujj: Forgatás | ✌️ 2 ujj / görgő: Nagyítás</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.2.0/pako.min.js"></script>
    <script>
    (function () {
        'use strict';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 40, 200);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        document.body.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a5a2a, 0.55);
        scene.add(hemiLight);
        const directionalLight = new THREE.DirectionalLight(0xfff5e0, 0.85);
        directionalLight.position.set(30, 50, 20);
        scene.add(directionalLight);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0xffffff);
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        let schematicGroup = new THREE.Group();
        scene.add(schematicGroup);

        let target = new THREE.Vector3(0, 3, 0);
        let radius = 18, theta = Math.PI / 4, phi = Math.PI / 3;

        function updateCamera() {
            phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi));
            radius = Math.max(0.3, Math.min(400, radius));
            const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
            const y = target.y + radius * Math.cos(phi);
            const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
            camera.position.set(x, y, z);
            camera.lookAt(target);
        }
        updateCamera();

        const pointers = new Map();
        let lastPinchDist = null;
        const dom = renderer.domElement;

        dom.addEventListener('pointerdown', (e) => { dom.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
        dom.addEventListener('pointerup', (e) => { pointers.delete(e.pointerId); lastPinchDist = null; });
        dom.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); lastPinchDist = null; });
        dom.addEventListener('pointermove', (e) => {
            if (!pointers.has(e.pointerId)) return;
            const prev = pointers.get(e.pointerId);
            const curr = { x: e.clientX, y: e.clientY };
            pointers.set(e.pointerId, curr);
            if (pointers.size === 1) {
                const dx = curr.x - prev.x, dy = curr.y - prev.y;
                theta -= dx * 0.006; phi -= dy * 0.006; updateCamera();
            } else if (pointers.size >= 2) {
                const pts = Array.from(pointers.values());
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                if (lastPinchDist != null) { radius -= (dist - lastPinchDist) * 0.05; updateCamera(); }
                lastPinchDist = dist;
            }
        });
        dom.addEventListener('wheel', (e) => { radius += e.deltaY * 0.02; updateCamera(); e.preventDefault(); }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();

        const instructionsEl = document.getElementById('instructions');
        const bannerEl = document.getElementById('status-banner');
        function setStatus(text) { instructionsEl.innerHTML = text; }
        function setBanner(text, show) { bannerEl.innerHTML = text; bannerEl.style.display = show ? 'block' : 'none'; }

        // NBT Reader (rövidítve a lényeg)
        function NBTReader(buffer, littleEndian) {
            this.view = new DataView(buffer); this.offset = 0; this.little = !!littleEndian; this.decoder = new TextDecoder('utf-8');
        }
        NBTReader.prototype.readByte = function () { const v = this.view.getInt8(this.offset); this.offset += 1; return v; };
        NBTReader.prototype.readUByte = function () { const v = this.view.getUint8(this.offset); this.offset += 1; return v; };
        NBTReader.prototype.readShort = function () { const v = this.view.getInt16(this.offset, this.little); this.offset += 2; return v; };
        NBTReader.prototype.readUShort = function () { const v = this.view.getUint16(this.offset, this.little); this.offset += 2; return v; };
        NBTReader.prototype.readInt = function () { const v = this.view.getInt32(this.offset, this.little); this.offset += 4; return v; };
        NBTReader.prototype.readLong = function () { const v = this.view.getBigInt64(this.offset, this.little); this.offset += 8; return v; };
        NBTReader.prototype.readFloat = function () { const v = this.view.getFloat32(this.offset, this.little); this.offset += 4; return v; };
        NBTReader.prototype.readDouble = function () { const v = this.view.getFloat64(this.offset, this.little); this.offset += 8; return v; };
        NBTReader.prototype.readString = function () { const len = this.readUShort(); const bytes = new Uint8Array(this.view.buffer, this.offset, len); this.offset += len; return this.decoder.decode(bytes); };
        NBTReader.prototype.readByteArray = function () { const len = this.readInt(); const arr = new Int8Array(this.view.buffer.slice(this.offset, this.offset + len)); this.offset += len; return arr; };
        NBTReader.prototype.readIntArray = function () { const len = this.readInt(); const arr = new Int32Array(len); for (let i = 0; i < len; i++) arr[i] = this.readInt(); return arr; };
        NBTReader.prototype.readLongArray = function () { const len = this.readInt(); const arr = new BigInt64Array(len); for (let i = 0; i < len; i++) arr[i] = this.readLong(); return arr; };
        NBTReader.prototype.readTagPayload = function (type) {
            switch (type) {
                case 1: return this.readByte(); case 2: return this.readShort(); case 3: return this.readInt(); case 4: return this.readLong();
                case 5: return this.readFloat(); case 6: return this.readDouble(); case 7: return this.readByteArray(); case 8: return this.readString();
                case 9: return this.readList(); case 10: return this.readCompound(); case 11: return this.readIntArray(); case 12: return this.readLongArray();
                default: throw new Error('Ismeretlen NBT tag típus: ' + type);
            }
        };
        NBTReader.prototype.readList = function () { const type = this.readUByte(); const len = this.readInt(); const arr = []; for (let i = 0; i < len; i++) arr.push(this.readTagPayload(type)); return arr; };
        NBTReader.prototype.readCompound = function () { const obj = {}; while (true) { const type = this.readUByte(); if (type === 0) break; const name = this.readString(); obj[name] = this.readTagPayload(type); } return obj; };
        NBTReader.prototype.readNamedTag = function () { const type = this.readUByte(); if (type === 0) return null; const name = this.readString(); const value = this.readTagPayload(type); return { name, type, value }; };

        function decompress(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes[0] === 0x1f && bytes[1] === 0x8b) return pako.ungzip(bytes).buffer;
            try { return pako.inflate(bytes).buffer; } catch (e) { return buffer; }
        }

        const BLOCK_COLORS = {
            stone: 0x7d7d7d, cobblestone: 0x828282, dirt: 0x8b5a2b, grass_block: 0x5a8f3c,
            oak_planks: 0xb08552, spruce_planks: 0x7a5836, birch_planks: 0xd8c98a,
            oak_log: 0x6b4a2f, sand: 0xe0d3a0, glass: 0x9fd8e8, water: 0x3a6fd8, lava: 0xe25c22,
            white_wool: 0xe9ecec, orange_wool: 0xf07613, red_wool: 0xa12722, black_wool: 0x141519,
            white_concrete: 0xcfd5d6, iron_block: 0xd8d8d8, gold_block: 0xf0d84a, diamond_block: 0x6be0d8,
            netherrack: 0x6b3030, obsidian: 0x14121a, bedrock: 0x333333, ice: 0xa8d8f0
            // ... (a többi a korábbi bővített listából)
        };

        function normalizeName(name) {
            let n = (name || 'unknown').replace('minecraft:', '');
            return n.split('[')[0];
        }
        function isAir(name) {
            const n = normalizeName(name);
            return n === 'air' || n === 'cave_air' || n === 'void_air' || n === '';
        }

        // Pixeles fallback textúra
        const textureCache = new Map();
        function createBlockTexture(hexColor) {
            const key = 'gen_' + hexColor;
            if (textureCache.has(key)) return textureCache.get(key);
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const r = (hexColor >> 16) & 255, g = (hexColor >> 8) & 255, b = hexColor & 255;
            const imageData = ctx.createImageData(size, size);
            const data = imageData.data;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = (y * size + x) * 4;
                    const noise = (Math.random() - 0.5) * 28;
                    const edge = (x === 0 || y === 0 || x === size-1 || y === size-1) ? -18 : 0;
                    data[i] = Math.max(0, Math.min(255, r + noise + edge));
                    data[i+1] = Math.max(0, Math.min(255, g + noise + edge));
                    data[i+2] = Math.max(0, Math.min(255, b + noise + edge));
                    data[i+3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
            textureCache.set(key, tex);
            return tex;
        }

        // Valódi textúra betöltés (jsDelivr)
        const loader = new THREE.TextureLoader();
        const realTextureCache = new Map();
        const TEXTURE_BASE = 'https://cdn.jsdelivr.net/gh/InventivetalentDev/minecraft-assets@1.20.1/assets/minecraft/textures/block/';

        function loadRealTexture(blockName) {
            return new Promise((resolve) => {
                if (realTextureCache.has(blockName)) {
                    resolve(realTextureCache.get(blockName));
                    return;
                }
                const url = TEXTURE_BASE + blockName + '.png';
                loader.load(url, (tex) => {
                    tex.magFilter = THREE.NearestFilter;
                    tex.minFilter = THREE.NearestFilter;
                    tex.generateMipmaps = false;
                    realTextureCache.set(blockName, tex);
                    resolve(tex);
                }, undefined, () => {
                    // fallback
                    resolve(null);
                });
            });
        }

        function getBlockAppearance(rawName) {
            const name = normalizeName(rawName);
            let color = BLOCK_COLORS[name];
            if (color === undefined) {
                for (const key in BLOCK_COLORS) {
                    if (name.indexOf(key) !== -1) { color = BLOCK_COLORS[key]; break; }
                }
            }
            if (color === undefined) color = 0x888888;
            const alpha = (name.indexOf('glass') !== -1 || name === 'water' || name.indexOf('ice') !== -1) ? 0.55 : 1;
            return { name, color, alpha };
        }

        // Parserek (egyszerűsítve a lényeg)
        function parseLegacySchematic(root) {
            const width = root.Width, height = root.Height, length = root.Length;
            const blocksArr = root.Blocks;
            const result = [];
            for (let y = 0; y < height; y++) for (let z = 0; z < length; z++) for (let x = 0; x < width; x++) {
                const idx = (y * length + z) * width + x;
                let id = blocksArr[idx] & 0xFF;
                if (id === 0) continue;
                const name = (id === 1 ? 'stone' : id === 2 ? 'grass_block' : id === 3 ? 'dirt' : id === 4 ? 'cobblestone' : id === 5 ? 'oak_planks' : 'stone');
                result.push({ x, y, z, name });
            }
            return result;
        }

        function parseLitematic(root) {
            const regions = root.Regions || {};
            const result = [];
            for (const regionName in regions) {
                const region = regions[regionName];
                const size = region.Size, pos = region.Position;
                if (!size || !pos) continue;
                const absX = Math.abs(size.x), absY = Math.abs(size.y), absZ = Math.abs(size.z);
                const minX = size.x < 0 ? pos.x + size.x + 1 : pos.x;
                const minY = size.y < 0 ? pos.y + size.y + 1 : pos.y;
                const minZ = size.z < 0 ? pos.z + size.z + 1 : pos.z;
                const palette = region.BlockStatePalette || [];
                const states = region.BlockStates || [];
                const bitsPerEntry = Math.max(2, Math.ceil(Math.log2(palette.length || 1)));
                const mask = (1n << BigInt(bitsPerEntry)) - 1n;
                const total = absX * absY * absZ;
                for (let i = 0; i < total; i++) {
                    const y = Math.floor(i / (absX * absZ));
                    const rem = i % (absX * absZ);
                    const z = Math.floor(rem / absX);
                    const x = rem % absX;
                    const startBit = BigInt(i) * BigInt(bitsPerEntry);
                    const longIndex = Number(startBit / 64n);
                    const startOffset = Number(startBit % 64n);
                    let value = (BigInt.asUintN(64, states[longIndex] || 0n) >> BigInt(startOffset)) & mask;
                    if (startOffset + bitsPerEntry > 64) {
                        const hi = BigInt.asUintN(64, states[longIndex + 1] || 0n) << BigInt(64 - startOffset);
                        value = (value | hi) & mask;
                    }
                    const entry = palette[Number(value)];
                    if (!entry || !entry.Name || isAir(entry.Name)) continue;
                    result.push({ x: minX + x, y: minY + y, z: minZ + z, name: entry.Name });
                }
            }
            return result;
        }

        function parseMcstructure(buffer) {
            const reader = new NBTReader(buffer, true);
            const rootTag = reader.readNamedTag();
            if (!rootTag) throw new Error('Üres mcstructure');
            const root = rootTag.value;
            const size = root.size || [0,0,0];
            const sx = size[0], sy = size[1], sz = size[2];
            const structure = root.structure || {};
            const layer0 = (structure.block_indices || [])[0] || [];
            const paletteList = ((structure.palette || {}).default || {}).block_palette || [];
            const result = [];
            for (let x = 0; x < sx; x++) for (let y = 0; y < sy; y++) for (let z = 0; z < sz; z++) {
                const idx = (x * sy + y) * sz + z;
                const pIdx = layer0[idx];
                if (pIdx === undefined || pIdx < 0) continue;
                const entry = paletteList[pIdx];
                if (!entry) continue;
                const name = entry.name || 'unknown';
                if (isAir(name)) continue;
                result.push({ x, y, z, name });
            }
            return result;
        }

        async function renderBlocks(blocks, filename) {
            scene.remove(schematicGroup);
            schematicGroup = new THREE.Group();
            scene.add(schematicGroup);

            if (!blocks || blocks.length === 0) {
                setBanner('Nem sikerült blokkot kiolvasni.', true);
                return;
            }

            const MAX_BLOCKS = 300000;
            if (blocks.length > MAX_BLOCKS) {
                const stride = Math.ceil(blocks.length / MAX_BLOCKS);
                blocks = blocks.filter((_, i) => i % stride === 0);
            }

            let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            for (const b of blocks) {
                if (b.x < minX) minX = b.x; if (b.x > maxX) maxX = b.x;
                if (b.y < minY) minY = b.y; if (b.y > maxY) maxY = b.y;
                if (b.z < minZ) minZ = b.z; if (b.z > maxZ) maxZ = b.z;
            }

            // Csoportosítás név szerint (textúra alapján)
            const groups = new Map();
            for (const b of blocks) {
                const app = getBlockAppearance(b.name);
                const key = app.name;
                if (!groups.has(key)) groups.set(key, { name: app.name, color: app.color, alpha: app.alpha, items: [] });
                groups.get(key).items.push(b);
            }

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const dummy = new THREE.Object3D();

            setBanner('Textúrák betöltése...', true);

            const entries = Array.from(groups.entries());
            for (const [key, g] of entries) {
                let tex = await loadRealTexture(g.name);
                if (!tex) tex = createBlockTexture(g.color);

                const material = new THREE.MeshLambertMaterial({
                    map: tex,
                    transparent: g.alpha < 1,
                    opacity: g.alpha,
                    color: 0xffffff
                });
                const mesh = new THREE.InstancedMesh(geometry, material, g.items.length);
                g.items.forEach((b, i) => {
                    dummy.position.set(b.x - minX, b.y - minY, b.z - minZ);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });
                mesh.instanceMatrix.needsUpdate = true;
                schematicGroup.add(mesh);
            }

            const cx = (maxX - minX) / 2, cy = (maxY - minY) / 2, cz = (maxZ - minZ) / 2;
            target.set(cx, cy, cz);
            const dim = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 5);
            radius = dim * 1.6;
            theta = Math.PI / 4; phi = Math.PI / 3;
            updateCamera();

            setBanner('', false);
            setStatus('<b>' + filename + '</b> — ' + blocks.length.toLocaleString('hu-HU') + ' blokk<br>👆 1 ujj: Forgatás | ✌️ 2 ujj / görgő: Nagyítás');
        }

        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;
            setBanner('Betöltés: ' + file.name + '...', true);
            const reader = new FileReader();
            reader.onerror = function () { setBanner('Nem sikerült beolvasni a fájlt.', true); };
            reader.onload = function () {
                try {
                    const buffer = reader.result;
                    const ext = file.name.split('.').pop().toLowerCase();
                    let blocks;
                    if (ext === 'mcstructure') {
                        blocks = parseMcstructure(buffer);
                    } else {
                        const nbtBuffer = decompress(buffer);
                        const nbtReader = new NBTReader(nbtBuffer, false);
                        const root = nbtReader.readNamedTag();
                        if (!root) throw new Error('Üres NBT');
                        if (ext === 'litematic') blocks = parseLitematic(root.value);
                        else blocks = parseLegacySchematic(root.value);
                    }
                    renderBlocks(blocks, file.name);
                } catch (err) {
                    console.error(err);
                    setBanner('Hiba: ' + err.message, true);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    })();
    </script>
</body>
</html>
