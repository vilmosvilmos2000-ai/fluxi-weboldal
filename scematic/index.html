<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Schematic Nézegető</title>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            width: 100%;
        }
        canvas { display: block; touch-action: none; }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 85%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: white;
        }

        input[type="file"] { display: none; }

        .upload-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        .upload-btn:active { transform: scale(0.97); }

        #instructions {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
            word-break: break-word;
        }

        #status-banner {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            max-width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="status-banner"></div>
    <div id="ui-container">
        <label class="upload-btn">
            📁 Schematic kiválasztása
            <input type="file" id="fileInput" accept=".schematic,.litematic,.mcstructure">
        </label>
        <div id="instructions">
            Kezdéshez válassz ki egy fájlt!<br>
            👆 1 ujj: Forgatás | ✌️ 2 ujj / görgő: Nagyítás
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.2.0/pako.min.js"></script>
    <script>
    (function () {
        'use strict';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 40, 200);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        document.body.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a5a2a, 0.55);
        scene.add(hemiLight);
        const directionalLight = new THREE.DirectionalLight(0xfff5e0, 0.85);
        directionalLight.position.set(30, 50, 20);
        scene.add(directionalLight);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0xffffff);
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        let schematicGroup = new THREE.Group();
        scene.add(schematicGroup);

        let target = new THREE.Vector3(0, 3, 0);
        let radius = 18, theta = Math.PI / 4, phi = Math.PI / 3;

        function updateCamera() {
            phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi));
            radius = Math.max(0.3, Math.min(400, radius));
            const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
            const y = target.y + radius * Math.cos(phi);
            const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
            camera.position.set(x, y, z);
            camera.lookAt(target);
        }
        updateCamera();

        const pointers = new Map();
        let lastPinchDist = null;
        const dom = renderer.domElement;

        dom.addEventListener('pointerdown', (e) => {
            dom.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        dom.addEventListener('pointerup', (e) => { pointers.delete(e.pointerId); lastPinchDist = null; });
        dom.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); lastPinchDist = null; });
        dom.addEventListener('pointermove', (e) => {
            if (!pointers.has(e.pointerId)) return;
            const prev = pointers.get(e.pointerId);
            const curr = { x: e.clientX, y: e.clientY };
            pointers.set(e.pointerId, curr);

            if (pointers.size === 1) {
                const dx = curr.x - prev.x, dy = curr.y - prev.y;
                theta -= dx * 0.006;
                phi -= dy * 0.006;
                updateCamera();
            } else if (pointers.size >= 2) {
                const pts = Array.from(pointers.values());
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                if (lastPinchDist != null) {
                    radius -= (dist - lastPinchDist) * 0.05;
                    updateCamera();
                }
                lastPinchDist = dist;
            }
        });
        dom.addEventListener('wheel', (e) => {
            radius += e.deltaY * 0.02;
            updateCamera();
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        const instructionsEl = document.getElementById('instructions');
        const bannerEl = document.getElementById('status-banner');
        function setStatus(text) { instructionsEl.innerHTML = text; }
        function setBanner(text, show) {
            bannerEl.innerHTML = text;
            bannerEl.style.display = show ? 'block' : 'none';
        }

        function NBTReader(buffer, littleEndian) {
            this.view = new DataView(buffer);
            this.offset = 0;
            this.little = !!littleEndian;
            this.decoder = new TextDecoder('utf-8');
        }
        NBTReader.prototype.readByte = function () { const v = this.view.getInt8(this.offset); this.offset += 1; return v; };
        NBTReader.prototype.readUByte = function () { const v = this.view.getUint8(this.offset); this.offset += 1; return v; };
        NBTReader.prototype.readShort = function () { const v = this.view.getInt16(this.offset, this.little); this.offset += 2; return v; };
        NBTReader.prototype.readUShort = function () { const v = this.view.getUint16(this.offset, this.little); this.offset += 2; return v; };
        NBTReader.prototype.readInt = function () { const v = this.view.getInt32(this.offset, this.little); this.offset += 4; return v; };
        NBTReader.prototype.readLong = function () { const v = this.view.getBigInt64(this.offset, this.little); this.offset += 8; return v; };
        NBTReader.prototype.readFloat = function () { const v = this.view.getFloat32(this.offset, this.little); this.offset += 4; return v; };
        NBTReader.prototype.readDouble = function () { const v = this.view.getFloat64(this.offset, this.little); this.offset += 8; return v; };
        NBTReader.prototype.readString = function () {
            const len = this.readUShort();
            const bytes = new Uint8Array(this.view.buffer, this.offset, len);
            this.offset += len;
            return this.decoder.decode(bytes);
        };
        NBTReader.prototype.readByteArray = function () {
            const len = this.readInt();
            const arr = new Int8Array(this.view.buffer.slice(this.offset, this.offset + len));
            this.offset += len;
            return arr;
        };
        NBTReader.prototype.readIntArray = function () {
            const len = this.readInt();
            const arr = new Int32Array(len);
            for (let i = 0; i < len; i++) arr[i] = this.readInt();
            return arr;
        };
        NBTReader.prototype.readLongArray = function () {
            const len = this.readInt();
            const arr = new BigInt64Array(len);
            for (let i = 0; i < len; i++) arr[i] = this.readLong();
            return arr;
        };
        NBTReader.prototype.readTagPayload = function (type) {
            switch (type) {
                case 1: return this.readByte();
                case 2: return this.readShort();
                case 3: return this.readInt();
                case 4: return this.readLong();
                case 5: return this.readFloat();
                case 6: return this.readDouble();
                case 7: return this.readByteArray();
                case 8: return this.readString();
                case 9: return this.readList();
                case 10: return this.readCompound();
                case 11: return this.readIntArray();
                case 12: return this.readLongArray();
                default: throw new Error('Ismeretlen NBT tag típus: ' + type + ' (offset ' + this.offset + ')');
            }
        };
        NBTReader.prototype.readList = function () {
            const type = this.readUByte();
            const len = this.readInt();
            const arr = [];
            for (let i = 0; i < len; i++) arr.push(this.readTagPayload(type));
            return arr;
        };
        NBTReader.prototype.readCompound = function () {
            const obj = {};
            while (true) {
                const type = this.readUByte();
                if (type === 0) break;
                const name = this.readString();
                obj[name] = this.readTagPayload(type);
            }
            return obj;
        };
        NBTReader.prototype.readNamedTag = function () {
            const type = this.readUByte();
            if (type === 0) return null;
            const name = this.readString();
            const value = this.readTagPayload(type);
            return { name: name, type: type, value: value };
        };

        function decompress(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
                return pako.ungzip(bytes).buffer;
            }
            try {
                return pako.inflate(bytes).buffer;
            } catch (e) {
                return buffer;
            }
        }

        function isStairName(name) {
            return normalizeName(name).indexOf('stairs') !== -1;
        }

        function stairTextureFor(name) {
            if (STAIR_TEXTURES[name]) return STAIR_TEXTURES[name];
            const base = name.replace(/_stairs$/, '');
            if (TEXTURE_ALIASES[base] !== undefined || FACE_TEXTURES[base] !== undefined || BLOCK_COLORS[base] !== undefined) return base;
            return name;
        }

        function normalizeName(name) {
            let n = (name || 'unknown').replace('minecraft:', '');
            n = n.split('[')[0];
            return n;
        }
        function hashColor(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
            const hue = Math.abs(h) % 360;
            return new THREE.Color('hsl(' + hue + ', 45%, 55%)').getHex();
        }
        function getBlockAppearance(rawName) {
            const name = normalizeName(rawName);
            let color = BLOCK_COLORS[name];
            if (color === undefined) {
                for (const key in BLOCK_COLORS) {
                    if (name === key || name.startsWith(key + '_') || name.indexOf(key) !== -1) {
                        color = BLOCK_COLORS[key];
                        break;
                    }
                }
            }
            if (color === undefined) color = hashColor(name);
            const alpha = (name.indexOf('glass') !== -1 || name === 'water' || name.indexOf('ice') !== -1 || name.indexOf('slime') !== -1) ? 0.55 : 1;
            let faces;
            if (FACE_TEXTURES[name]) {
                faces = FACE_TEXTURES[name];
            } else {
                faces = { all: TEXTURE_ALIASES[name] || name };
            }
            return { color: color, alpha: alpha, faces: faces };
        }
        function isAir(name) {
            const n = normalizeName(name);
            return n === 'air' || n === 'cave_air' || n === 'void_air' || n === '';
        }

        const textureCache = new Map();
        function createBlockTexture(hexColor) {
            const key = hexColor;
            if (textureCache.has(key)) return textureCache.get(key);
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const r = (hexColor >> 16) & 255, g = (hexColor >> 8) & 255, b = hexColor & 255;
            const imageData = ctx.createImageData(size, size);
            const data = imageData.data;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = (y * size + x) * 4;
                    const noise = (Math.random() - 0.5) * 28;
                    const edge = (x === 0 || y === 0 || x === size - 1 || y === size - 1) ? -18 : 0;
                    data[i] = Math.max(0, Math.min(255, r + noise + edge));
                    data[i + 1] = Math.max(0, Math.min(255, g + noise + edge));
                    data[i + 2] = Math.max(0, Math.min(255, b + noise + edge));
                    data[i + 3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.generateMipmaps = false;
            textureCache.set(key, tex);
            return tex;
        }

        const textureLoader = new THREE.TextureLoader();
        function makeBlockMaterial(file, fallbackTex, alpha) {
            const material = new THREE.MeshLambertMaterial({
                map: fallbackTex,
                transparent: alpha < 1,
                opacity: alpha,
                color: 0xffffff
            });
            textureLoader.load(TEX_BASE + file + '.png', function (tex) {
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                tex.generateMipmaps = false;
                material.map = tex;
                material.needsUpdate = true;
            }, undefined, function () { });
            return material;
        }

        function stairYRotation(shape, facing, half) {
            const straight = { east: 0, south: 90, west: 180, north: 270 };
            const cornerLeftBottom = { east: 270, south: 0, west: 90, north: 180 };
            const cornerRightBottom = { east: 0, south: 90, west: 180, north: 270 };
            const cornerLeftTop = { east: 0, south: 90, west: 180, north: 270 };
            const cornerRightTop = { east: 90, south: 180, west: 270, north: 0 };
            if (shape.indexOf('left') !== -1) {
                return half === 'top' ? cornerLeftTop[facing] : cornerLeftBottom[facing];
            }
            if (shape.indexOf('right') !== -1) {
                return half === 'top' ? cornerRightTop[facing] : cornerRightBottom[facing];
            }
            return straight[facing];
        }

        function rotateStairBox(box, yDeg, top) {
            let x = box.x, z = box.z, y = box.y;
            const a = ((yDeg % 360) + 360) % 360;
            let nx, nz;
            if (a === 90) { nx = [1 - z[1], 1 - z[0]]; nz = x; }
            else if (a === 180) { nx = [1 - x[1], 1 - x[0]]; nz = [1 - z[1], 1 - z[0]]; }
            else if (a === 270) { nx = z; nz = [1 - x[1], 1 - x[0]]; }
            else { nx = x; nz = z; }
            if (top) {
                y = [1 - y[1], 1 - y[0]];
                nz = [1 - nz[1], 1 - nz[0]];
            }
            return { x: nx, y: y, z: nz };
        }

        function getStairParts(shape) {
            if (shape === 'inner') {
                return [
                    { x: [0, 1], y: [0, 0.5], z: [0, 1] },
                    { x: [0.5, 1], y: [0.5, 1], z: [0, 1] },
                    { x: [0, 0.5], y: [0.5, 1], z: [0.5, 1] }
                ];
            }
            if (shape === 'outer') {
                return [
                    { x: [0, 1], y: [0, 0.5], z: [0, 1] },
                    { x: [0.5, 1], y: [0.5, 1], z: [0.5, 1] }
                ];
            }
            return [
                { x: [0, 1], y: [0, 0.5], z: [0, 1] },
                { x: [0.5, 1], y: [0.5, 1], z: [0, 1] }
            ];
        }

        function addStairBox(data, x0, x1, y0, y1, z0, z1) {
            const faces = [
                { n: [1, 0, 0], c: [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], u: function (p) { return p[2] - z0; }, v: function (p) { return p[1] - y0; } },
                { n: [-1, 0, 0], c: [[x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [x0, y0, z0]], u: function (p) { return z1 - p[2]; }, v: function (p) { return p[1] - y0; } },
                { n: [0, 1, 0], c: [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], u: function (p) { return p[0] - x0; }, v: function (p) { return p[2] - z0; } },
                { n: [0, -1, 0], c: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], u: function (p) { return p[0] - x0; }, v: function (p) { return p[2] - z0; } },
                { n: [0, 0, 1], c: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], u: function (p) { return p[0] - x0; }, v: function (p) { return p[1] - y0; } },
                { n: [0, 0, -1], c: [[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], u: function (p) { return x1 - p[0]; }, v: function (p) { return p[1] - y0; } }
            ];
            for (const f of faces) {
                const base = data.position.length / 3;
                for (const p of f.c) {
                    data.position.push(p[0], p[1], p[2]);
                    data.normal.push(f.n[0], f.n[1], f.n[2]);
                    data.uv.push(f.u(p), f.v(p));
                }
                data.index.push(base, base + 1, base + 2, base, base + 2, base + 3);
            }
        }

        const stairGeoCache = new Map();
        function buildStairGeometry(shape, facing, half) {
            const yDeg = stairYRotation(shape, facing, half);
            const top = half === 'top';
            const shapeKey = shape.indexOf('inner') === 0 ? 'inner' : (shape.indexOf('outer') === 0 ? 'outer' : 'straight');
            const data = { position: [], normal: [], uv: [], index: [] };
            for (const p of getStairParts(shapeKey)) {
                const b = rotateStairBox(p, yDeg, top);
                addStairBox(data, b.x[0] - 0.5, b.x[1] - 0.5, b.y[0] - 0.5, b.y[1] - 0.5, b.z[0] - 0.5, b.z[1] - 0.5);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(data.position, 3));
            geo.setAttribute('normal', new THREE.Float32BufferAttribute(data.normal, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(data.uv, 2));
            geo.setIndex(data.index);
            geo.computeBoundingSphere();
            return geo;
        }
        function getStairGeometry(shape, facing, half) {
            const key = shape + '|' + facing + '|' + half;
            if (!stairGeoCache.has(key)) stairGeoCache.set(key, buildStairGeometry(shape, facing, half));
            return stairGeoCache.get(key);
        }

        function renderStairs(items, minX, minY, minZ) {
            const dummy = new THREE.Object3D();
            const groups2 = new Map();
            for (const s of items) {
                const n = normalizeName(s.b.name);
                const texName = stairTextureFor(n);
                const key = texName + '_' + s.shape + '_' + s.facing + '_' + s.half;
                if (!groups2.has(key)) groups2.set(key, { texName: texName, shape: s.shape, facing: s.facing, half: s.half, items: [] });
                groups2.get(key).items.push(s);
            }
            groups2.forEach(function (g) {
                const fallbackTex = createBlockTexture(hashColor(g.texName));
                const material = makeBlockMaterial(g.texName, fallbackTex, 1);
                const geo = getStairGeometry(g.shape, g.facing, g.half);
                const mesh = new THREE.InstancedMesh(geo, material, g.items.length);
                g.items.forEach(function (s, i) {
                    dummy.position.set(s.b.x - minX, s.b.y - minY, s.b.z - minZ);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });
                mesh.instanceMatrix.needsUpdate = true;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                schematicGroup.add(mesh);
            });
        }

        function parseLegacySchematic(root) {
            const width = root.Width, height = root.Height, length = root.Length;
            const blocksArr = root.Blocks;
            const add = root.AddBlocks;
            const result = [];
            for (let y = 0; y < height; y++) {
                for (let z = 0; z < length; z++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * length + z) * width + x;
                        let id = blocksArr[idx] & 0xFF;
                        if (add) {
                            const addIdx = idx >> 1;
                            const nibble = (idx % 2 === 0) ? (add[addIdx] & 0x0F) : ((add[addIdx] >> 4) & 0x0F);
                            id |= nibble << 8;
                        }
                        if (id === 0) continue;
                        const name = LEGACY_ID_NAMES[id] || ('id_' + id);
                        if (isAir(name)) continue;
                        const props = {};
                        if (root.Data && isStairName(name)) {
                            const data = root.Data[idx] & 0x0F;
                            const facings = ['east', 'west', 'south', 'north'];
                            props.facing = facings[data & 3] || 'east';
                            props.half = (data & 4) ? 'top' : 'bottom';
                            props.shape = (data & 8) ? 'inner_right' : 'straight';
                        }
                        result.push({ x: x, y: y, z: z, name: name, props: props });
                    }
                }
            }
            return result;
        }

        function parseLitematic(root) {
            const regions = root.Regions;
            const result = [];
            if (!regions) throw new Error('Nem található "Regions" mező — nem litematic fájl?');
            for (const regionName in regions) {
                const region = regions[regionName];
                const size = region.Size, pos = region.Position;
                if (!size || !pos) continue;
                const sx = size.x, sy = size.y, sz = size.z;
                const absX = Math.abs(sx), absY = Math.abs(sy), absZ = Math.abs(sz);
                const minX = sx < 0 ? pos.x + sx + 1 : pos.x;
                const minY = sy < 0 ? pos.y + sy + 1 : pos.y;
                const minZ = sz < 0 ? pos.z + sz + 1 : pos.z;
                const palette = region.BlockStatePalette;
                const states = region.BlockStates;
                if (!palette || !states || absX === 0 || absY === 0 || absZ === 0) continue;
                const bitsPerEntry = Math.max(2, Math.ceil(Math.log2(palette.length)));
                const mask = (1n << BigInt(bitsPerEntry)) - 1n;
                const total = absX * absY * absZ;
                for (let i = 0; i < total; i++) {
                    const y = Math.floor(i / (absX * absZ));
                    const rem = i % (absX * absZ);
                    const z = Math.floor(rem / absX);
                    const x = rem % absX;
                    const startBit = BigInt(i) * BigInt(bitsPerEntry);
                    const longIndex = Number(startBit / 64n);
                    const startOffset = Number(startBit % 64n);
                    let value;
                    const lo = BigInt.asUintN(64, states[longIndex]) >> BigInt(startOffset);
                    if (startOffset + bitsPerEntry <= 64) {
                        value = lo & mask;
                    } else {
                        const hi = BigInt.asUintN(64, states[longIndex + 1]) << BigInt(64 - startOffset);
                        value = (lo | hi) & mask;
                    }
                    const paletteIndex = Number(value);
                    const entry = palette[paletteIndex];
                    if (!entry || !entry.Name || isAir(entry.Name)) continue;
                    const props = {};
                    let baseName = entry.Name;
                    const bracket = entry.Name.indexOf('[');
                    if (bracket !== -1) {
                        baseName = entry.Name.slice(0, bracket);
                        const inner = entry.Name.slice(bracket + 1, entry.Name.length - 1);
                        if (inner) {
                            for (const pair of inner.split(',')) {
                                const eq = pair.indexOf('=');
                                if (eq !== -1) props[pair.slice(0, eq)] = pair.slice(eq + 1);
                            }
                        }
                    }
                    result.push({ x: minX + x, y: minY + y, z: minZ + z, name: baseName, props: props });
                }
            }
            return result;
        }

        function parseMcstructure(buffer) {
            const reader = new NBTReader(buffer, true);
            const rootTag = reader.readNamedTag();
            if (!rootTag) throw new Error('Üres mcstructure fájl.');
            const root = rootTag.value;
            const size = root.size;
            if (!size) throw new Error('Hiányzó "size" mező az mcstructure fájlban.');
            const sx = size[0], sy = size[1], sz = size[2];
            const structure = root.structure;
            const layer0 = structure.block_indices[0];
            const paletteList = structure.palette.default.block_palette;
            const result = [];
            for (let x = 0; x < sx; x++) {
                for (let y = 0; y < sy; y++) {
                    for (let z = 0; z < sz; z++) {
                        const idx = (x * sy + y) * sz + z;
                        const pIdx = layer0[idx];
                        if (pIdx === undefined || pIdx < 0) continue;
                        const entry = paletteList[pIdx];
                        if (!entry) continue;
                        const name = entry.name || 'unknown';
                        if (isAir(name)) continue;
                        const props = {};
                        let baseName = name;
                        const bracket = name.indexOf('[');
                        if (bracket !== -1) {
                            baseName = name.slice(0, bracket);
                            const inner = name.slice(bracket + 1, name.length - 1);
                            if (inner) {
                                for (const pair of inner.split(',')) {
                                    const eq = pair.indexOf('=');
                                    if (eq !== -1) props[pair.slice(0, eq)] = pair.slice(eq + 1);
                                }
                            }
                        }
                        result.push({ x: x, y: y, z: z, name: baseName, props: props });
                    }
                }
            }
            return result;
        }

        function renderBlocks(blocks, filename) {
            scene.remove(schematicGroup);
            schematicGroup = new THREE.Group();
            scene.add(schematicGroup);

            if (!blocks || blocks.length === 0) {
                setBanner('Nem sikerült blokkot kiolvasni ebből a fájlból.', true);
                return;
            }

            const MAX_BLOCKS = 350000;
            if (blocks.length > MAX_BLOCKS) {
                const stride = Math.ceil(blocks.length / MAX_BLOCKS);
                blocks = blocks.filter((_, i) => i % stride === 0);
            }

            let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            for (const b of blocks) {
                if (b.x < minX) minX = b.x; if (b.x > maxX) maxX = b.x;
                if (b.y < minY) minY = b.y; if (b.y > maxY) maxY = b.y;
                if (b.z < minZ) minZ = b.z; if (b.z > maxZ) maxZ = b.z;
            }

            const stairItems = [], normalBlocks = [];
            for (const b of blocks) {
                if (isStairName(b.name)) {
                    const props = b.props || {};
                    let facing = props.facing || 'east';
                    if (facing !== 'east' && facing !== 'west' && facing !== 'south' && facing !== 'north') facing = 'east';
                    stairItems.push({ b: b, facing: facing, half: props.half === 'top' ? 'top' : 'bottom', shape: props.shape || 'straight' });
                } else {
                    normalBlocks.push(b);
                }
            }

            const groups = new Map();
            for (const b of normalBlocks) {
                const app = getBlockAppearance(b.name);
                const key = JSON.stringify(app.faces) + '_' + app.alpha;
                if (!groups.has(key)) groups.set(key, { app: app, items: [] });
                groups.get(key).items.push(b);
            }

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const dummy = new THREE.Object3D();

            groups.forEach(function (g) {
                const app = g.app;
                const fallbackTex = createBlockTexture(app.color);
                let materials;
                if (app.faces.all) {
                    materials = makeBlockMaterial(app.faces.all, fallbackTex, app.alpha);
                } else {
                    const f = app.faces;
                    materials = [
                        makeBlockMaterial(f.side, fallbackTex, app.alpha),
                        makeBlockMaterial(f.side, fallbackTex, app.alpha),
                        makeBlockMaterial(f.top, fallbackTex, app.alpha),
                        makeBlockMaterial(f.bottom, fallbackTex, app.alpha),
                        makeBlockMaterial(f.side, fallbackTex, app.alpha),
                        makeBlockMaterial(f.side, fallbackTex, app.alpha)
                    ];
                }
                const mesh = new THREE.InstancedMesh(geometry, materials, g.items.length);
                g.items.forEach((b, i) => {
                    dummy.position.set(b.x - minX, b.y - minY, b.z - minZ);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });
                mesh.instanceMatrix.needsUpdate = true;
                schematicGroup.add(mesh);
            });

            if (stairItems.length) renderStairs(stairItems, minX, minY, minZ);

            const cx = (maxX - minX) / 2, cy = (maxY - minY) / 2, cz = (maxZ - minZ) / 2;
            target.set(cx, cy, cz);
            const dim = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 5);
            radius = dim * 1.6;
            theta = Math.PI / 4;
            phi = Math.PI / 3;
            updateCamera();

            setBanner('', false);
            setStatus('<b>' + filename + '</b> — ' + blocks.length.toLocaleString('hu-HU') + ' blokk<br>👆 1 ujj: Forgatás | ✌️ 2 ujj / görgő: Nagyítás');
        }

        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;
            setBanner('Betöltés: ' + file.name + '...', true);
            const reader = new FileReader();
            reader.onerror = function () {
                setBanner('Nem sikerült beolvasni a fájlt.', true);
            };
            reader.onload = function () {
                try {
                    const buffer = reader.result;
                    const ext = file.name.split('.').pop().toLowerCase();
                    let blocks;
                    if (ext === 'mcstructure') {
                        blocks = parseMcstructure(buffer);
                    } else {
                        const nbtBuffer = decompress(buffer);
                        const nbtReader = new NBTReader(nbtBuffer, false);
                        const root = nbtReader.readNamedTag();
                        if (!root) throw new Error('Üres vagy érvénytelen NBT fájl.');
                        if (ext === 'litematic') {
                            blocks = parseLitematic(root.value);
                        } else {
                            blocks = parseLegacySchematic(root.value);
                        }
                    }
                    renderBlocks(blocks, file.name);
                } catch (err) {
                    console.error(err);
                    setBanner('Hiba a fájl feldolgozása közben: ' + err.message, true);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    })();
    </script>
</body>
