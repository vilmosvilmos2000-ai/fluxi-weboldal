<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vilmos201_official - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace, cursive;
            /* Minecraft háttérkép beállítása */
            background-image: url('https://abfielder.com/Partners/PartnerUploadedImages/IZSDeImaOR-Projekt%20bez%20nazwy%20(23).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            border: 4px solid #555;
            padding: 40px 30px;
            text-align: center;
            max-width: 90%;
            width: 450px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        .title {
            font-size: 16px;
            color: #55FF55; /* Minecraft zöld szöveg */
            text-shadow: 2px 2px #00aa00;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .subtitle {
            font-size: 12px;
            color: #FFFF55; /* Minecraft sárga szöveg */
            text-shadow: 2px 2px #aa1000;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .tiktok-btn {
            display: inline-block;
            padding: 15px 20px;
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            background-color: #ff0050;
            text-decoration: none;
            border: 3px solid #ffffff;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .tiktok-btn:hover {
            background-color: #00f2fe;
            color: #000000;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        .tiktok-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">vilmos201_offical</h1>
        <p class="subtitle">PROFI SCHEMATIC BUILDER</p>
        
        <a href="https://www.tiktok.com/@vilmos201_offical" target="_blank" class="tiktok-btn">
            TIKTOK PROFILOM
        </a>
    </div>

</body>
</html>
