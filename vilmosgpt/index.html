<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VilmosGPT</title>
  <meta name="description" content="VilmosGPT – személyes AI, tanul, emlékezik, keres" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VilmosGPT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="180x180" href="https://i.imgur.com/kzTgIsW.png" />
  <link rel="apple-touch-icon" href="https://i.imgur.com/kzTgIsW.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/kzTgIsW.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.imgur.com/LZuVuqC.png" />
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=6" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030712;
      --panel: rgba(15, 23, 42, 0.85);
      --panel-solid: #0f172a;
      --panel-2: #111827;
      --accent: #38bdf8;
      --accent-2: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user: #2563eb;
      --bot: #1e293b;
      --good: #34d399;
      --border: rgba(255, 255, 255, 0.1);
      --glass: rgba(15, 23, 42, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: #000;
      color: var(--text);
    }
    .app {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      grid-template-rows: 56px 1fr;
      height: 100vh; width: 100vw; height: 100dvh;
    }
    .header {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0);
      background: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(20,20,30,0.95));
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; image-rendering: pixelated;
      background: #000; flex-shrink: 0;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-sub { display: none; }
    .badge { display: none; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-actions > button#theme-toggle {
      border: none; background: rgba(255,255,255,0.15); color: white;
      border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px;
    }
    .btn-google {
      display: inline-flex; align-items: center; gap: 6px;
      border: none; background: #fff; color: #3c4043;
      border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-google span.label { display: none; }
    .user-chip {
      display: none; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15); border-radius: 999px;
      padding: 4px 8px 4px 4px; font-size: 12px; font-weight: 600; color: white;
    }
    .user-chip.visible { display: inline-flex; }
    .user-chip .user-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, #4285f4, #34a853);
      display: grid; place-items: center; font-size: 11px; overflow: hidden;
    }
    .user-chip .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-chip .logout-btn {
      border: none; background: rgba(0,0,0,0.25); color: white;
      border-radius: 999px; padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .auth-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 100;
      align-items: center; justify-content: center; padding: 16px;
    }
    .auth-overlay.open { display: flex; }
    .auth-modal-wrap { position: relative; width: min(400px, 100%); }
    .auth-modal {
      background: #0f172a; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 24px; color: #f8fafc;
    }
    .auth-logo-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
    .auth-logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: #000; }
    .auth-modal h2 { font-size: 18px; text-align: center; margin-bottom: 6px; }
    .auth-modal > p { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 16px; }
    .auth-close { position: absolute; top: 10px; right: 12px; border: none; background: transparent; color: #94a3b8; font-size: 22px; cursor: pointer; }
    #google-btn-slot { display: flex; justify-content: center; min-height: 44px; }
    .auth-divider { display: flex; align-items: center; gap: 10px; color: #64748b; font-size: 12px; margin: 12px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .auth-modal input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); color: #f8fafc; font-size: 14px; margin-bottom: 8px; outline: none;
    }
    .auth-actions { display: flex; gap: 8px; }
    .auth-actions button { flex: 1; border: none; border-radius: 12px; padding: 11px; font-weight: 700; cursor: pointer; }
    .auth-primary { background: linear-gradient(90deg, #38bdf8, #8b5cf6); color: white; }
    .auth-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .auth-note { font-size: 11px; color: #64748b; margin-top: 10px; }
    .sidebar-left, .sidebar-right {
      display: flex; flex-direction: column;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(16px);
      overflow-y: auto; min-height: 0;
    }
    .sidebar-left { border-right: 1px solid var(--border); }
    .sidebar-right { border-left: 1px solid var(--border); }
    .panel-section { padding: 14px; border-bottom: 1px solid var(--border); }
    .panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.05em; }
    .mode-switch { display: flex; flex-direction: column; gap: 6px; }
    .mode-switch button {
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--text); border-radius: 12px; padding: 10px 12px;
      cursor: pointer; font-size: 13px; font-weight: 600; text-align: left;
    }
    .mode-switch button.active {
      background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(139,92,246,0.25));
      border-color: rgba(56,189,248,0.5);
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
      font-size: 12px; color: #d1fae5; padding: 6px 10px; border-radius: 999px;
      background: rgba(52,211,153,0.12);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
    .mentor-list, .prompt-bank, .memory-list { display: flex; flex-direction: column; gap: 6px; }
    .mentor-item, .memory-item {
      border: 1px solid var(--border); border-radius: 11px; padding: 9px 11px;
      background: rgba(255,255,255,0.03); font-size: 12.5px; color: #cbd5e1; line-height: 1.4;
    }
    .prompt-item button {
      display: block; width: 100%; border: 1px solid var(--border);
      background: rgba(255,255,255,0.04); color: var(--text); text-align: left;
      cursor: pointer; padding: 9px 11px; border-radius: 11px; font-size: 12.5px;
    }
    .main-chat { display: flex; flex-direction: column; min-height: 0; background: rgba(0,0,0,0.4); }
    .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; gap: 8px; align-items: flex-end; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .message.user { justify-content: flex-end; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 700; font-size: 11px; flex-shrink: 0;
    }
    .message.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .message.user .avatar { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .message.system .avatar { background: rgba(52,211,153,0.3); color: #a7f3d0; }
    .bubble {
      max-width: min(640px, 82%); padding: 11px 14px; border-radius: 16px;
      line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; font-size: 14px;
      background: rgba(20,20,25,0.9); border: 1px solid var(--border);
    }
    .message.user .bubble { background: linear-gradient(135deg, #1e3a5f, #2d1b4e); color: white; border: none; }
    .message.system .bubble { background: rgba(52,211,153,0.1); color: #dcfce7; border-color: rgba(52,211,153,0.2); }
    .message.typing .bubble { color: var(--muted); font-style: italic; }
    .composer-wrap {
      padding: 12px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.7);
    }
    .composer { display: flex; gap: 8px; align-items: center; }
    .composer input {
      flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 999px;
      outline: none; font-size: 15px; background: rgba(248,250,252,0.95); color: #0f172a;
    }
    .composer button {
      border: none; border-radius: 999px; padding: 11px 16px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    #send { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: white; }
    #reset { background: rgba(71,85,105,0.8); color: white; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 6px; text-align: center; }
    .card-actions { display: flex; gap: 8px; margin-top: 8px; }
    .card-actions button, .import-btn {
      border: none; color: white; background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .import-btn { position: relative; overflow: hidden; display: inline-flex; }
    .import-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .mobile-tabs {
      display: none; grid-column: 1 / -1; background: rgba(0,0,0,0.95);
      border-bottom: 1px solid var(--border); padding: 6px 8px; gap: 6px;
    }
    .mobile-tabs button {
      flex: 1; border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--muted); border-radius: 10px; padding: 10px 6px; font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    .mobile-tabs button.active {
      background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(139,92,246,0.2));
      color: var(--text); border-color: rgba(56,189,248,0.4);
    }
    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr; }
      .mobile-tabs { display: flex; }
      .sidebar-left, .sidebar-right {
        display: none; position: absolute; top: 52px; left: 0; right: 0; bottom: 0; z-index: 20; border: none;
      }
      .sidebar-left.visible, .sidebar-right.visible { display: flex; }
      .bubble { max-width: 88%; }
      .header h1 { font-size: 16px; }
      .header-logo { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <img class="header-logo" src="logo.svg?v=6" alt="VilmosGPT" width="40" height="40" />
        <h1>VilmosGPT 0.3</h1>
      </div>
      <div class="header-actions">
        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <span id="user-name">Felhasználó</span>
          <button class="logout-btn" id="logout-btn" type="button">Kilépés</button>
        </div>
        <button class="btn-google" id="login-btn" type="button" title="Bejelentkezés">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span class="label">Bejelentkezés</span>
        </button>
        <button id="theme-toggle" title="Téma">☀️</button>
      </div>
    </header>
    <div class="mobile-tabs" id="mobile-tabs">
      <button data-panel="left">Módok</button>
      <button data-panel="chat" class="active">Chat</button>
      <button data-panel="right">Kérdések</button>
    </div>
    <aside class="sidebar-left" id="sidebar-left">
      <div class="panel-section">
        <div class="panel-title">AI módok</div>
        <div class="mode-switch" id="mode-switch">
          <button class="mode active" data-mode="learn">📚 Tanulás</button>
          <button class="mode" data-mode="research">🔍 Kutatás</button>
          <button class="mode" data-mode="practice">✏️ Gyakorlás</button>
          <button class="mode" data-mode="creative">✨ Kreatív</button>
        </div>
        <div class="status-pill"><span class="status-dot"></span> Aktív: <span id="mode-label">Tanulás</span></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">Mentor tippek</div>
        <div id="mentor-list" class="mentor-list"></div>
      </div>
    </aside>
    <main class="main-chat" id="main-chat">
      <div class="chat" id="chat"></div>
      <div class="composer-wrap">
        <div class="composer">
          <input id="input" type="text" placeholder="Írd be a kérdésed..." autocomplete="off" />
          <button id="send">Küldés</button>
          <button id="reset">Töröl</button>
        </div>
        <div class="hint">Kérdezz bármit — a bot tanul, emlékezik és keres.</div>
      </div>
    </main>
    <aside class="sidebar-right" id="sidebar-right">
      <div class="panel-section">
        <div class="panel-title">Gyors kérdések</div>
        <div id="prompt-bank" class="prompt-bank"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">Mentett ismeretek</div>
        <div id="memory-list" class="memory-list"></div>
        <div class="card-actions">
          <button id="export-memory">Mentés</button>
          <label class="import-btn"><input type="file" id="import-memory" accept="application/json" />Betöltés</label>
        </div>
      </div>
    </aside>
  </div>
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-modal-wrap">
      <button class="auth-close" id="auth-close" type="button">×</button>
      <div class="auth-modal">
        <div class="auth-logo-wrap"><img class="auth-logo" src="logo.svg?v=6" alt="VilmosGPT" width="72" height="72" /></div>
        <h2>Bejelentkezés</h2>
        <p>Google-lel vagy névvel.</p>
        <div id="google-btn-slot"></div>
        <button class="btn-google" id="google-fallback-btn" type="button" style="width:100%;justify-content:center;margin:8px 0;">Folytatás Google-lel</button>
        <div class="auth-divider">vagy</div>
        <input id="auth-name" type="text" placeholder="A neved" maxlength="40" />
        <input id="auth-email" type="email" placeholder="Email (opcionális)" maxlength="80" />
        <div class="auth-actions">
          <button class="auth-secondary" id="auth-cancel" type="button">Mégse</button>
          <button class="auth-primary" id="auth-local" type="button">Belépés</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const GOOGLE_CLIENT_ID = '906956499349-fuqvjroddnh5fsi6tt6s9e21vd9qfq93.apps.googleusercontent.com';
    const AUTH_KEY = 'vilmosgpt-user-v1';
    function getUser(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch{ return null; } }
    function setUser(u){ if(u) localStorage.setItem(AUTH_KEY, JSON.stringify(u)); else localStorage.removeItem(AUTH_KEY); renderAuthUI(); }
    function renderAuthUI(){
      const user=getUser(), chip=document.getElementById('user-chip'), loginBtn=document.getElementById('login-btn');
      const nameEl=document.getElementById('user-name'), av=document.getElementById('user-avatar');
      if(user&&user.name){ chip.classList.add('visible'); loginBtn.style.display='none'; nameEl.textContent=user.name.split(' ')[0];
        if(user.picture) av.innerHTML='<img src="'+user.picture+'" alt="" />'; else av.textContent=(user.name[0]||'?').toUpperCase();
      } else { chip.classList.remove('visible'); loginBtn.style.display=''; }
    }
    function openAuth(){ document.getElementById('auth-overlay').classList.add('open'); initGoogleButton(); }
    function closeAuth(){ document.getElementById('auth-overlay').classList.remove('open'); }
    function parseJwt(t){ try{ const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+(('00'+c.charCodeAt(0).toString(16)).slice(-2))).join(''))); }catch{ return null; } }
    function handleGoogleCredential(r){
      const d=parseJwt(r.credential); if(!d) return;
      setUser({ name:d.name||d.email||'Google', email:d.email||'', picture:d.picture||'', provider:'google', sub:d.sub||'' });
      closeAuth();
      if(typeof addMessage==='function') addMessage('Szia, '+(d.name||'')+'! Bejelentkeztél Google-lel.', 'system');
    }
    function initGoogleButton(){
      const slot=document.getElementById('google-btn-slot');
      if(!GOOGLE_CLIENT_ID||!window.google||!google.accounts){ slot.innerHTML=''; return; }
      slot.innerHTML='';
      google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:handleGoogleCredential, auto_select:false });
      google.accounts.id.renderButton(slot, { theme:'outline', size:'large', shape:'pill', text:'continue_with', width:300 });
    }
    window.addEventListener('load', ()=>{ renderAuthUI(); if(GOOGLE_CLIENT_ID&&window.google) initGoogleButton(); });
    document.getElementById('login-btn').addEventListener('click', openAuth);
    document.getElementById('auth-close').addEventListener('click', closeAuth);
    document.getElementById('auth-cancel').addEventListener('click', closeAuth);
    document.getElementById('auth-overlay').addEventListener('click', e=>{ if(e.target.id==='auth-overlay') closeAuth(); });
    document.getElementById('logout-btn').addEventListener('click', ()=>{ setUser(null); if(typeof addMessage==='function') addMessage('Kijelentkeztél.', 'system'); });
    document.getElementById('auth-local').addEventListener('click', ()=>{
      const name=document.getElementById('auth-name').value.trim();
      const email=document.getElementById('auth-email').value.trim();
      if(!name){ document.getElementById('auth-name').focus(); return; }
      setUser({ name, email, picture:'', provider:'local' }); closeAuth();
      if(typeof addMessage==='function') addMessage('Szia, '+name+'! Beléptél.', 'system');
    });
    document.getElementById('google-fallback-btn').addEventListener('click', ()=>{
      if(GOOGLE_CLIENT_ID&&window.google&&google.accounts) google.accounts.id.prompt();
    });
  </script>
  <script src="app.js"></script>
  <script src="logo-inject.js?v=6"></script>
</body>
</html>
