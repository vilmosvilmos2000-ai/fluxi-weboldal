<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>VilmosGPT 0.4</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VilmosGPT" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="180x180" href="https://i.imgur.com/kzTgIsW.png" />
  <link rel="apple-touch-icon" href="https://i.imgur.com/kzTgIsW.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/kzTgIsW.png" />
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=7" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.VILMOS_FB_APP_ID = '2749285785466566';
    window.VILMOS_APPLE_CLIENT_ID = '';
    window.VILMOS_APPLE_REDIRECT = 'https://fluxi.hu/vilmosgpt/';
    window.fbAsyncInit = function() {
      if (window.VILMOS_FB_APP_ID) {
        FB.init({ appId: window.VILMOS_FB_APP_ID, cookie: true, xfbml: false, version: 'v21.0' });
      }
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/hu_HU/sdk.js"></script>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #000; color: #f8fafc;
    }
    .app { display: flex; flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden; }
    .header {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top, 10px));
      background: #0a0a0f; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 30;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .header-logo {
      width: 36px; height: 36px; min-width: 36px; border-radius: 50%;
      object-fit: cover; image-rendering: pixelated; background: #000; display: block; flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; }
    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    #theme-toggle {
      border: none; background: rgba(255,255,255,0.15); color: white;
      border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px;
    }
    .btn-google {
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: #fff; color: #3c4043; border-radius: 999px; padding: 6px; cursor: pointer;
    }
    .btn-google span.label { display: none; }
    .user-chip {
      display: none; align-items: center; gap: 6px; background: rgba(255,255,255,0.15);
      border-radius: 999px; padding: 3px 8px 3px 3px; font-size: 12px; font-weight: 600; color: white;
    }
    .user-chip.visible { display: inline-flex; }
    .user-chip .user-avatar {
      width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #4285f4, #34a853);
      display: grid; place-items: center; font-size: 11px; overflow: hidden;
    }
    .user-chip .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-chip .logout-btn {
      border: none; background: rgba(0,0,0,0.25); color: white; border-radius: 999px; padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .mobile-tabs {
      flex: 0 0 auto; display: flex; gap: 6px; background: #000;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding: 6px 8px;
    }
    .mobile-tabs button {
      flex: 1; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: #94a3b8; border-radius: 10px; padding: 10px 4px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .mobile-tabs button.active {
      background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(139,92,246,0.2));
      color: #f8fafc; border-color: rgba(56,189,248,0.4);
    }
    .main-chat { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: rgba(0,0,0,0.4); }
    .chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; gap: 8px; align-items: flex-end; }
    .message.user { justify-content: flex-end; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
    .message.bot .avatar { background: linear-gradient(135deg, #38bdf8, #8b5cf6); }
    .message.user .avatar { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .message.system .avatar { background: rgba(52,211,153,0.3); color: #a7f3d0; }
    .bubble {
      max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.5;
      word-wrap: break-word; white-space: pre-wrap; font-size: 14px;
      background: rgba(20,20,25,0.9); border: 1px solid rgba(255,255,255,0.1);
    }
    .message.user .bubble { background: linear-gradient(135deg, #1e3a5f, #2d1b4e); color: white; border: none; }
    .message.system .bubble { background: rgba(52,211,153,0.1); color: #dcfce7; border-color: rgba(52,211,153,0.2); }
    .message.typing .bubble { color: #94a3b8; font-style: italic; }
    .bubble.markdown { white-space: normal; line-height: 1.55; }
    .composer-wrap {
      flex: 0 0 auto; padding: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
      border-top: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.75);
    }
    .composer { display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea#input,
    .composer #input {
      flex: 1; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px; outline: none; font-size: 15px; background: #f8fafc; color: #0f172a;
      font-family: inherit; line-height: 1.4; resize: none; overflow-y: hidden;
      min-height: 44px; max-height: calc(1.4em * 5 + 24px); height: 44px;
    }
    .composer textarea#input:focus {
      border-color: rgba(56,189,248,0.55);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }
    .composer button { border: none; border-radius: 999px; padding: 11px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
    #send { background: linear-gradient(90deg, #38bdf8, #8b5cf6); color: white; }
    #reset { background: rgba(71,85,105,0.9); color: white; }
    .hint { color: #64748b; font-size: 11px; margin-top: 6px; text-align: center; }
    .sidebar-left, .sidebar-right {
      display: none; position: fixed; inset: 0; z-index: 25; flex-direction: column; overflow-y: auto;
      background: rgba(0,0,0,0.95); padding-top: max(70px, calc(env(safe-area-inset-top, 0px) + 56px));
    }
    .sidebar-left.visible, .sidebar-right.visible { display: flex; }
    .panel-section { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; }
    .mode-switch { display: flex; flex-direction: column; gap: 6px; }
    .mode-switch button {
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #f8fafc;
      border-radius: 12px; padding: 12px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left;
    }
    .mode-switch button.active {
      background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(139,92,246,0.25)); border-color: rgba(56,189,248,0.5);
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: #d1fae5;
      padding: 6px 10px; border-radius: 999px; background: rgba(52,211,153,0.12);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
    .mentor-list, .prompt-bank, .memory-list { display: flex; flex-direction: column; gap: 6px; }
    .mentor-item, .memory-item {
      border: 1px solid rgba(255,255,255,0.1); border-radius: 11px; padding: 10px;
      background: rgba(255,255,255,0.03); font-size: 13px; color: #cbd5e1; line-height: 1.4;
    }
    .prompt-item button {
      display: block; width: 100%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: #f8fafc; text-align: left; cursor: pointer; padding: 10px; border-radius: 11px; font-size: 13px;
    }
    .card-actions { display: flex; gap: 8px; margin-top: 8px; }
    .card-actions button, .import-btn {
      border: none; color: white; background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      border-radius: 999px; padding: 8px 12px; cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .import-btn { position: relative; overflow: hidden; display: inline-flex; }
    .import-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .auth-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .auth-overlay.open { display: flex; }
    .auth-modal-wrap { position: relative; width: min(400px, 100%); }
    .auth-modal { background: #0f172a; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 24px; color: #f8fafc; }
    .auth-logo-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
    .auth-logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: #000; }
    .auth-modal h2 { font-size: 18px; text-align: center; margin-bottom: 6px; }
    .auth-modal > p { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 16px; }
    .auth-close { position: absolute; top: 10px; right: 12px; border: none; background: transparent; color: #94a3b8; font-size: 22px; cursor: pointer; }
    #google-btn-slot { display: flex; justify-content: center; min-height: 40px; margin-bottom: 8px; }
    .btn-facebook, .btn-apple {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      border: none; border-radius: 999px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
    }
    .btn-facebook { background: #1877f2; color: #fff; }
    .btn-apple { background: #fff; color: #000; margin-bottom: 4px; }
    .auth-divider { display: flex; align-items: center; gap: 10px; color: #64748b; font-size: 12px; margin: 12px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .auth-modal input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); color: #f8fafc; font-size: 14px; margin-bottom: 8px; outline: none;
    }
    .auth-actions { display: flex; gap: 8px; }
    .auth-actions button { flex: 1; border: none; border-radius: 12px; padding: 11px; font-weight: 700; cursor: pointer; }
    .auth-primary { background: linear-gradient(90deg, #38bdf8, #8b5cf6); color: white; }
    .auth-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    @media (min-width: 961px) {
      .app { display: grid; grid-template-columns: 260px 1fr 280px; grid-template-rows: auto 1fr; }
      .header { grid-column: 1 / -1; }
      .mobile-tabs { display: none; }
      .sidebar-left, .sidebar-right {
        display: flex; position: relative; inset: auto; padding-top: 0;
        background: rgba(0,0,0,0.55); overflow-y: auto;
      }
      .sidebar-left { border-right: 1px solid rgba(255,255,255,0.1); }
      .sidebar-right { border-left: 1px solid rgba(255,255,255,0.1); }
      .main-chat { grid-column: 2; }
      .header h1 { max-width: none; font-size: 18px; }
      .btn-google span.label { display: inline; }
      .btn-google { padding: 7px 12px; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <img class="header-logo" src="logo.svg?v=7" alt="VilmosGPT" width="36" height="36" />
        <h1>VilmosGPT 0.4</h1>
      </div>
      <div class="header-actions">
        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <span id="user-name">Felhasználó</span>
          <button class="logout-btn" id="logout-btn" type="button">Kilépés</button>
        </div>
        <button class="btn-google" id="login-btn" type="button" title="Bejelentkezés">
          <span class="label">Bejelentkezés</span>
        </button>
        <button id="theme-toggle" title="Téma">☀️</button>
      </div>
    </header>
    <div class="mobile-tabs" id="mobile-tabs">
      <button data-panel="left">Módok</button>
      <button data-panel="chat" class="active">Chat</button>
      <button data-panel="right">Kérdések</button>
    </div>
    <aside class="sidebar-left" id="sidebar-left">
      <div class="panel-section">
        <div class="panel-title">AI módok</div>
        <div class="mode-switch" id="mode-switch">
          <button class="mode active" data-mode="learn">📚 Tanulás</button>
          <button class="mode" data-mode="research">🔍 Kutatás</button>
          <button class="mode" data-mode="practice">✏️ Gyakorlás</button>
          <button class="mode" data-mode="creative">✨ Kreatív</button>
        </div>
        <div class="status-pill"><span class="status-dot"></span> Aktív: <span id="mode-label">Tanulás</span></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">Mentor tippek</div>
        <div id="mentor-list" class="mentor-list"></div>
      </div>
    </aside>
    <main class="main-chat" id="main-chat">
      <div class="chat" id="chat"></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Írd be a kérdésed..." autocomplete="off"></textarea>
          <button id="send">Küldés</button>
          <button id="reset">Töröl</button>
        </div>
        <div class="hint">Enter = küldés · Shift+Enter = új sor</div>
      </div>
    </main>
    <aside class="sidebar-right" id="sidebar-right">
      <div class="panel-section">
        <div class="panel-title">Gyors kérdések</div>
        <div id="prompt-bank" class="prompt-bank"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">Mentett ismeretek</div>
        <div id="memory-list" class="memory-list"></div>
        <div class="card-actions">
          <button id="export-memory">Mentés</button>
          <label class="import-btn"><input type="file" id="import-memory" accept="application/json" />Betöltés</label>
        </div>
      </div>
    </aside>
  </div>
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-modal-wrap">
      <button class="auth-close" id="auth-close" type="button">×</button>
      <div class="auth-modal">
        <div class="auth-logo-wrap"><img class="auth-logo" src="logo.svg?v=7" alt="VilmosGPT" width="72" height="72" /></div>
        <h2>Bejelentkezés</h2>
        <p>Google, Facebook, Apple vagy név.</p>
        <div id="google-btn-slot"></div>
        <button class="btn-facebook" id="facebook-login-btn" type="button">Folytatás Facebookkal</button>
        <button class="btn-apple" id="apple-login-btn" type="button">Folytatás Apple-lel</button>
        <div class="auth-divider">vagy</div>
        <input id="auth-name" type="text" placeholder="A neved" maxlength="40" />
        <input id="auth-email" type="email" placeholder="Email (opcionális)" maxlength="80" />
        <div class="auth-actions">
          <button class="auth-secondary" id="auth-cancel" type="button">Mégse</button>
          <button class="auth-primary" id="auth-local" type="button">Belépés</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const GOOGLE_CLIENT_ID = '906956499349-fuqvjroddnh5fsi6tt6s9e21vd9qfq93.apps.googleusercontent.com';
    const FB_APP_ID = window.VILMOS_FB_APP_ID || '';
    const APPLE_CLIENT_ID = window.VILMOS_APPLE_CLIENT_ID || '';
    const APPLE_REDIRECT = window.VILMOS_APPLE_REDIRECT || (location.origin + location.pathname);
    const AUTH_KEY = 'vilmosgpt-user-v1';
    function getUser(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch{ return null; } }
    function setUser(u){ if(u) localStorage.setItem(AUTH_KEY, JSON.stringify(u)); else localStorage.removeItem(AUTH_KEY); renderAuthUI(); }
    function renderAuthUI(){
      const user=getUser(), chip=document.getElementById('user-chip'), loginBtn=document.getElementById('login-btn');
      const nameEl=document.getElementById('user-name'), av=document.getElementById('user-avatar');
      if(user&&user.name){ chip.classList.add('visible'); loginBtn.style.display='none'; nameEl.textContent=user.name.split(' ')[0];
        if(user.picture) av.innerHTML='<img src="'+user.picture+'" alt="" />'; else av.textContent=(user.name[0]||'?').toUpperCase();
      } else { chip.classList.remove('visible'); loginBtn.style.display=''; }
    }
    function openAuth(){ document.getElementById('auth-overlay').classList.add('open'); if(window.google) try{ initGoogleButton(); }catch(e){} }
    function closeAuth(){ document.getElementById('auth-overlay').classList.remove('open'); }
    function parseJwt(t){ try{ const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+(('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); }catch{ return null; } }
    function handleGoogleCredential(r){
      const d=parseJwt(r.credential); if(!d) return;
      setUser({ name:d.name||d.email||'Google', email:d.email||'', picture:d.picture||'', provider:'google', sub:d.sub||'' });
      closeAuth();
      if(typeof addMessage==='function') addMessage('Szia, '+(d.name||'')+'! Bejelentkeztél Google-lel.', 'system');
    }
    function initGoogleButton(){
      const slot=document.getElementById('google-btn-slot');
      if(!GOOGLE_CLIENT_ID||!window.google||!google.accounts){ slot.innerHTML=''; return; }
      slot.innerHTML='';
      google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:handleGoogleCredential, auto_select:false });
      google.accounts.id.renderButton(slot, { theme:'outline', size:'large', shape:'pill', text:'continue_with', width:300 });
    }
    function handleFacebookLogin() {
      if (!FB_APP_ID || !window.FB) { alert('Facebook bejelentkezés nem elérhető.'); return; }
      FB.login(function(response) {
        if (!response.authResponse) return;
        FB.api('/me', { fields: 'id,name,email,picture.type(large)' }, function(me) {
          if (!me || me.error) return;
          var pic = (me.picture && me.picture.data && me.picture.data.url) || '';
          setUser({ name: me.name || 'Facebook', email: me.email || '', picture: pic, provider: 'facebook', sub: me.id || '' });
          closeAuth();
          if (typeof addMessage === 'function') addMessage('Szia, ' + (me.name || '') + '! Bejelentkeztél Facebookkal.', 'system');
        });
      }, { scope: 'public_profile,email' });
    }
    async function handleAppleLogin() {
      if (!APPLE_CLIENT_ID || !window.AppleID) { alert('Apple bejelentkezéshez Services ID kell.'); return; }
      try {
        AppleID.auth.init({ clientId: APPLE_CLIENT_ID, scope: 'name email', redirectURI: APPLE_REDIRECT, usePopup: true });
        var data = await AppleID.auth.signIn();
        var name = 'Apple felhasználó';
        setUser({ name: name, email: '', picture: '', provider: 'apple', sub: name });
        closeAuth();
        if (typeof addMessage === 'function') addMessage('Szia! Bejelentkeztél Apple-lel.', 'system');
      } catch (err) {}
    }
    window.addEventListener('load', ()=>{ renderAuthUI(); });
    document.getElementById('facebook-login-btn').addEventListener('click', handleFacebookLogin);
    document.getElementById('apple-login-btn').addEventListener('click', handleAppleLogin);
    document.getElementById('login-btn').addEventListener('click', openAuth);
    document.getElementById('auth-close').addEventListener('click', closeAuth);
    document.getElementById('auth-cancel').addEventListener('click', closeAuth);
    document.getElementById('auth-overlay').addEventListener('click', e=>{ if(e.target.id==='auth-overlay') closeAuth(); });
    document.getElementById('logout-btn').addEventListener('click', ()=>{ setUser(null); if(typeof addMessage==='function') addMessage('Kijelentkeztél.', 'system'); });
    document.getElementById('auth-local').addEventListener('click', ()=>{
      const name=document.getElementById('auth-name').value.trim();
      const email=document.getElementById('auth-email').value.trim();
      if(!name){ document.getElementById('auth-name').focus(); return; }
      setUser({ name, email, picture:'', provider:'local' }); closeAuth();
      if(typeof addMessage==='function') addMessage('Szia, '+name+'! Beléptél.', 'system');
    });
  </script>
  <script src="logo-inject.js?v=15"></script>
  <script src="app.js?v=31"></script>
</body>
</html>
