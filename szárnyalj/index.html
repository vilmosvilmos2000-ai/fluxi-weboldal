<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Játék Frissítések Évente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2b36;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: #4CAF50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #3f3f4e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        select:focus {
            border-color: #4CAF50;
        }
        /* Alapból rejtjük az év, az update és az infó szekciókat */
        #year-section, #update-section, #info-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .info-box {
            background-color: #3f3f4e;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4CAF50;
            margin-top: 20px;
        }
        .info-box h3 {
            margin-top: 0;
        }
        ul {
            padding-left: 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Játék Adatbázis</h1>
    
    <!-- 1. Játék választó -->
    <div class="form-group">
        <label for="game-select">Válassz egy játékot:</label>
        <select id="game-select">
            <option value="">-- Válassz --</option>
            <!-- A JavaScript tölti fel -->
        </select>
    </div>

    <!-- 2. Év választó (ÚJ) -->
    <div class="form-group" id="year-section">
        <label for="year-select">Válassz egy évet:</label>
        <select id="year-select">
            <option value="">-- Válassz --</option>
            <!-- A JavaScript tölti fel -->
        </select>
    </div>

    <!-- 3. Frissítés választó -->
    <div class="form-group" id="update-section">
        <label for="update-select">Válassz egy frissítést:</label>
        <select id="update-select">
            <option value="">-- Válassz --</option>
            <!-- A JavaScript tölti fel -->
        </select>
    </div>

    <!-- 4. Információs doboz -->
    <div id="info-section">
        <div class="info-box">
            <h3 id="update-title">Frissítés címe</h3>
            <p id="update-desc">Itt jelenik meg a leírás...</p>
            <h4>Kérdések:</h4>
            <ul id="update-questions">
                <!-- A JavaScript tölti fel a kérdéseket -->
            </ul>
        </div>
    </div>
</div>

<script>
    // Kibővített adatbázis évekkel
    const gameData = {
        "minecraft": {
            name: "Minecraft",
            years: {
                "2024": {
                    updates: {
                        "1_21": {
                            name: "1.21 - Tricky Trials",
                            desc: "A Tricky Trials frissítés új kihívásokat, Trial Chambereket, a Breeze mobot és a Crafter blokkot hozta el.",
                            questions: ["Milyen lootot ad az Ominous Vault?", "Mire lehet használni a Mace (Buzogány) fegyvert?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "1_20": {
                            name: "1.20 - Trails & Tales",
                            desc: "Behozta a cseresznyefás ligeteket (Cherry Grove), az archeológiát, az ecsetet, a tevét és a Sniffert.",
                            questions: ["Hogyan lehet kikelteni egy Sniffer tojást?", "Hol találhatók a gyanús homok (suspicious sand) blokkok?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "1_19": {
                            name: "1.19 - The Wild Update",
                            desc: "Megérkezett a Deep Dark biome, az Ancient City, a félelmetes Warden és a mocsári békák.",
                            questions: ["Hogyan lehet elkerülni, hogy a Warden meghalljon?", "Mit esznek a békák a játékban?"]
                        }
                    }
                }
            }
        },
        "roblox": {
            name: "Roblox",
            years: {
                "2024": {
                    updates: {
                        "dynamic_heads": {
                            name: "Dynamic Heads & Facial Animation",
                            desc: "A Roblox karakterek arcai animálttá váltak, és a kamerán keresztül a valós arckifejezésünket is átvihetjük a játékba.",
                            questions: ["Hogyan kell bekapcsolni a kamera-alapú arckövetést?", "Minden játék (élmény) támogatja az animált arcokat?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "voice_chat": {
                            name: "Voice Chat széleskörű kiterjesztése",
                            desc: "A térbeli hangalapú csevegés (Spatial Voice) elérhetőbbé vált, sokaknak már személyi igazolvány sem kellett hozzá.",
                            questions: ["Hány éves kortól használható a Voice Chat hivatalosan?", "Hogyan működik a Spatial Audio (térbeli hang) a játékokban?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "layered_clothing": {
                            name: "Layered Clothing (Réteges ruházat)",
                            desc: "A játékosok végre 3D-s ruhákat (kabátokat, pulóvereket, cipőket) vehettek fel egymásra rétegezve az avatárjukon.",
                            questions: ["Hány réteg ruhát lehet maximum ráadni egy karakterre?", "Működik a Layered Clothing a régi blokkos (R6) avatárokon is?"]
                        }
                    }
                }
            }
        },
        "fortnite": {
            name: "Fortnite",
            years: {
                "2024": {
                    updates: {
                        "ch5_s2": {
                            name: "Chapter 5 Season 2 - Myths & Mortals",
                            desc: "A görög mitológia ihlette szezon, ahol Zeusz, Hádész és más istenek képességeit (pl. villámcsapás) lehetett használni.",
                            questions: ["Milyen mitológiai képességeket lehetett találni a pályán?", "Hol volt Hádész alvilági bázisa?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "og": {
                            name: "Fortnite OG",
                            desc: "Egy nosztalgikus szezon, ami visszahozta az eredeti Chapter 1 térképeit, fegyvereit és járműveit heti forgásban.",
                            questions: ["Melyik ikonikus helyszín (POI) volt a legnépszerűbb?", "Milyen régi járművek tértek vissza a játékba?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "zero_build": {
                            name: "Zero Build mód bevezetése",
                            desc: "Megjelent a Chapter 3 Season 2, ami bevezette a Zero Build módot – a klasszikus építés nélküli Battle Royale élményt.",
                            questions: ["Milyen új védelmi funkciót kaptak a játékosok az építés helyett (Overshield)?", "Hogyan változtatta meg a Zero Build a játékmenetet?"]
                        }
                    }
                }
            }
        },
        "fnaf": {
            name: "Five Nights at Freddy's",
            years: {
                "2024": {
                    updates: {
                        "into_the_pit": {
                            name: "Into the Pit Megjelenés",
                            desc: "Egy vadonatúj, 2D-s pixel art stílusú túlélő horror, ami a Fazbear Frights könyvsorozat első történetét dolgozza fel.",
                            questions: ["Hogyan lehet utazni az időben a játékban?", "Ki a főellenség, aki üldözi Oswaldot?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "ruin": {
                            name: "Security Breach - Ruin DLC",
                            desc: "Cassie a lepusztult Pizzaplexben próbálja megtalálni Gregory-t a V.A.N.N.I. kiterjesztett valóság maszk segítségével.",
                            questions: ["Hogyan változtatja meg a maszk a környezetet?", "Mi a Mimic igazi célja?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "xbox_port": {
                            name: "Security Breach Xbox & Switch Port",
                            desc: "A hatalmas PizzaPlex megnyitotta kapuit az Xbox és a Nintendo Switch konzolokon is, rengeteg hibajavítással.",
                            questions: ["Milyen nehézséget okozott a Switch portolása a játéknak?", "Melyik animatronic üldöz folyamatosan a játék elején?"]
                        }
                    }
                }
            }
        },
        "gtav": {
            name: "Grand Theft Auto V",
            years: {
                "2024": {
                    updates: {
                        "bottom_dollar": {
                            name: "Bottom Dollar Bounties",
                            desc: "Saját fejvadász irodát nyithatunk, és Maude Eccles lányával, Jenette-tel kaphatjuk el Los Santos bűnözőit.",
                            questions: ["Hogyan működik az óvadék (Bail) rendszer a játékban?", "Kiket kell elkapni a legnagyobb jutalomért?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "chop_shop": {
                            name: "The Chop Shop",
                            desc: "Egy autóbontó (salvage yard) vállalkozás, ahol Yusuf Amir (GTA IV) tér vissza, hogy luxusautókat lopjunk el neki.",
                            questions: ["Milyen ekstra bevételt hoz a bontóüzem (Tow Truck missions)?", "Hogyan működnek a heti autólopós küldetések?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "drug_wars": {
                            name: "Los Santos Drug Wars",
                            desc: "Csatlakozunk a Fooliganz csapatához, hogy egy hatalmas mozgó laboratóriumban (Acid Lab) indítsunk új bizniszt.",
                            questions: ["Melyik járműben (kamionban) található az Acid Lab?", "Ki vezeti a Fooliganz bandát?"]
                        }
                    }
                }
            }
        }
    };

    // Elemek lekérése
    const gameSelect = document.getElementById('game-select');
    const yearSection = document.getElementById('year-section');
    const yearSelect = document.getElementById('year-select');
    const updateSection = document.getElementById('update-section');
    const updateSelect = document.getElementById('update-select');
    const infoSection = document.getElementById('info-section');
    const updateTitle = document.getElementById('update-title');
    const updateDesc = document.getElementById('update-desc');
    const updateQuestions = document.getElementById('update-questions');

    // 1. Játék lista feltöltése
    for (const [key, game] of Object.entries(gameData)) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = game.name;
        gameSelect.appendChild(option);
    }

    // 2. Játék kiválasztása -> Évek betöltése
    gameSelect.addEventListener('change', (e) => {
        const selectedGame = e.target.value;
        
        // Alaphelyzet: elrejtjük az alsóbb szinteket
        yearSelect.innerHTML = '<option value="">-- Válassz --</option>';
        updateSelect.innerHTML = '<option value="">-- Válassz --</option>';
        updateSection.style.display = 'none';
        infoSection.style.display = 'none';

        if (selectedGame) {
            // Betöltjük a játékhoz tartozó éveket (fordított sorrendben, pl. 2024, 2023, 2022)
            const years = Object.keys(gameData[selectedGame].years).sort((a, b) => b - a);
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
            yearSection.style.display = 'block';
        } else {
            yearSection.style.display = 'none';
        }
    });

    // 3. Év kiválasztása -> Frissítések betöltése
    yearSelect.addEventListener('change', (e) => {
        const selectedGame = gameSelect.value;
        const selectedYear = e.target.value;

        // Alaphelyzet
        updateSelect.innerHTML = '<option value="">-- Válassz --</option>';
        infoSection.style.display = 'none';

        if (selectedYear) {
            const updates = gameData[selectedGame].years[selectedYear].updates;
            for (const [updateKey, updateInfo] of Object.entries(updates)) {
                const option = document.createElement('option');
                option.value = updateKey;
                option.textContent = updateInfo.name;
                updateSelect.appendChild(option);
            }
            updateSection.style.display = 'block';
        } else {
            updateSection.style.display = 'none';
        }
    });

    // 4. Frissítés kiválasztása -> Infó megjelenítése
    updateSelect.addEventListener('change', (e) => {
        const selectedGame = gameSelect.value;
        const selectedYear = yearSelect.value;
        const selectedUpdate = e.target.value;

        if (selectedUpdate) {
            const updateInfo = gameData[selectedGame].years[selectedYear].updates[selectedUpdate];
            
            updateTitle.textContent = updateInfo.name;
            updateDesc.textContent = updateInfo.desc;
            
            updateQuestions.innerHTML = ''; 
            updateInfo.questions.forEach(q => {
                const li = document.createElement('li');
                li.textContent = q;
                updateQuestions.appendChild(li);
            });

            infoSection.style.display = 'block';
        } else {
            infoSection.style.display = 'none';
        }
    });
</script>

</body>
</html>
