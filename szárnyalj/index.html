<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #4b4b4b;
        }

        /* 6 Másodperces Duolingo Töltőképernyő */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #58cc02;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }

        .loader-text {
            margin-top: 25px;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
        }

        .loader-subtext {
            margin-top: 8px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0.9;
        }

        /* Ceruza Animáció CSS */
        .pencil {
            display: block;
            width: 10em;
            height: 10em;
        }

        .pencil__body1,
        .pencil__body2,
        .pencil__body3,
        .pencil__eraser,
        .pencil__eraser-skew,
        .pencil__point,
        .pencil__rotate,
        .pencil__stroke {
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .pencil__body1,
        .pencil__body2,
        .pencil__body3 {
            transform: rotate(-90deg);
        }

        .pencil__body1 { animation-name: pencilBody1; }
        .pencil__body2 { animation-name: pencilBody2; }
        .pencil__body3 { animation-name: pencilBody3; }

        .pencil__eraser {
            animation-name: pencilEraser;
            transform: rotate(-90deg) translate(49px,0);
        }

        .pencil__eraser-skew {
            animation-name: pencilEraserSkew;
            animation-timing-function: ease-in-out;
        }

        .pencil__point {
            animation-name: pencilPoint;
            transform: rotate(-90deg) translate(49px,-30px);
        }

        .pencil__rotate { animation-name: pencilRotate; }

        .pencil__stroke {
            animation-name: pencilStroke;
            transform: translate(100px,100px) rotate(-113deg);
        }

        @keyframes pencilBody1 {
            from, to { stroke-dashoffset: 351.86; transform: rotate(-90deg); }
            50% { stroke-dashoffset: 150.8; transform: rotate(-225deg); }
        }
        @keyframes pencilBody2 {
            from, to { stroke-dashoffset: 406.84; transform: rotate(-90deg); }
            50% { stroke-dashoffset: 174.36; transform: rotate(-225deg); }
        }
        @keyframes pencilBody3 {
            from, to { stroke-dashoffset: 296.88; transform: rotate(-90deg); }
            50% { stroke-dashoffset: 127.23; transform: rotate(-225deg); }
        }
        @keyframes pencilEraser {
            from, to { transform: rotate(-45deg) translate(49px,0); }
            50% { transform: rotate(0deg) translate(49px,0); }
        }
        @keyframes pencilEraserSkew {
            from, 32.5%, 67.5%, to { transform: skewX(0); }
            35%, 65% { transform: skewX(-4deg); }
            37.5%, 62.5% { transform: skewX(8deg); }
            40%, 45%, 50%, 55%, 60% { transform: skewX(-15deg); }
            42.5%, 47.5%, 52.5%, 57.5% { transform: skewX(15deg); }
        }
        @keyframes pencilPoint {
            from, to { transform: rotate(-90deg) translate(49px,-30px); }
            50% { transform: rotate(-225deg) translate(49px,-30px); }
        }
        @keyframes pencilRotate {
            from { transform: translate(100px,100px) rotate(0); }
            to { transform: translate(100px,100px) rotate(720deg); }
        }
        @keyframes pencilStroke {
            from { stroke-dashoffset: 439.82; transform: translate(100px,100px) rotate(-113deg); }
            50% { stroke-dashoffset: 164.93; transform: translate(100px,100px) rotate(-113deg); }
            75%, to { stroke-dashoffset: 439.82; transform: translate(100px,100px) rotate(112deg); }
        }

        /* Duolingo Stílusú Főfelület */
        #main-content {
            display: none;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .duo-header {
            background-color: #58cc02;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 5px solid #46a302;
        }

        .duo-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
            border-radius: 24px;
            padding: 32px;
        }

        .duo-speech-bubble {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: #ddf4ff;
            border: 2px solid #84d8ff;
            border-bottom: 4px solid #84d8ff;
            padding: 16px 20px;
            border-radius: 18px;
            margin-bottom: 28px;
            font-size: 17px;
            font-weight: 800;
            color: #1cb0f6;
        }

        .duo-owl {
            font-size: 36px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 16px;
            color: #4b4b4b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            border-radius: 16px;
            background-color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            color: #4b4b4b;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        select:focus {
            border-color: #1cb0f6;
            border-bottom-color: #1899d6;
        }

        #year-section, #update-section, #info-section {
            display: none;
            animation: duoPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .info-box {
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
            border-radius: 22px;
            padding: 24px;
            margin-top: 30px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #58cc02;
            font-size: 24px;
            font-weight: 900;
        }

        .info-box p {
            font-size: 17px;
            line-height: 1.5;
            color: #4b4b4b;
            font-weight: 700;
        }

        .questions-title {
            margin-top: 22px;
            margin-bottom: 16px;
            color: #1cb0f6;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* Interaktív Kérdés Opciók */
        .q-block {
            margin-bottom: 22px;
            background-color: #f7f7f7;
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #e5e5e5;
        }

        .q-text {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #3c3c3c;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            border-radius: 14px;
            background: #ffffff;
            font-weight: 800;
            font-size: 16px;
            color: #4b4b4b;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f0f0f0;
        }

        .option-btn.selected {
            border-color: #84d8ff;
            border-bottom-color: #1cb0f6;
            background-color: #ddf4ff;
            color: #1cb0f6;
        }

        .option-btn.correct {
            border-color: #58cc02 !important;
            border-bottom-color: #46a302 !important;
            background-color: #d7ffb8 !important;
            color: #2e5a00 !important;
        }

        .option-btn.wrong {
            border-color: #ff4b4b !important;
            border-bottom-color: #ea2b2b !important;
            background-color: #ffdfe0 !important;
            color: #ea2b2b !important;

        /* Beküldés gomb */

            border-bottom: 5px solid #46a302;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: background 0.1s ease;
        }

        .submit-btn:hover {

        }

        .submit-btn:active {

            border-bottom-width: 3px;
        }

        .result-box {

            border-radius: 16px;

            font-weight: 900;

            background-color: #d7ffb8;
            color: #2e5a00;

            color: #ea2b2b;
            border: 2px solid #ff4b4b;
            border-bottom: 4px solid #ea2b2b;
        }

        @keyframes duoPop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

                                {
                                    text: "Ki a híres karakter, aki visszatért a GTA IV-ből a Chop Shop frissítésben?",
                                    options: ["Yusuf Amir", "Niko Bellic", "Roman Bellic"],
                                    correct: 0
                                }
                            ]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "drug_wars": {
                            name: "Los Santos Drug Wars",
                            desc: "Csatlakozunk a Fooliganz csapatához, hogy egy hatalmas mozgó laboratóriumban indítsunk új üzletet.",
                            questions: [
                                {
                                    text: "Melyik nagyméretű jármű alakítható át Acid Lab-bé?",
                                    options: ["Brickade 6x6", "Terrorbyte", "Avenger"],
                                    correct: 0
                                }
                            ]
                        }
                    }
                }
            }
        }
    };

    const gameSelect = document.getElementById('game-select');
    const yearSection = document.getElementById('year-section');
    const yearSelect = document.getElementById('year-select');
    const updateSection = document.getElementById('update-section');
    const updateSelect = document.getElementById('update-select');
    const infoSection = document.getElementById('info-section');
    const updateTitle = document.getElementById('update-title');
    const updateDesc = document.getElementById('update-desc');
    const updateQuestions = document.getElementById('update-questions');
    const submitBtn = document.getElementById('submit-answers');
    const resultBox = document.getElementById('result-box');

    let userAnswers = {};

    for (const [key, game] of Object.entries(gameData)) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = game.name;
        gameSelect.appendChild(option);
    }

    gameSelect.addEventListener('change', (e) => {
        const selectedGame = e.target.value;
        
        yearSelect.innerHTML = '<option value="">-- Melyik év érdekel? --</option>';
        updateSelect.innerHTML = '<option value="">-- Melyik frissítést tanuljuk meg? --</option>';
        updateSection.style.display = 'none';
        infoSection.style.display = 'none';

        if (selectedGame) {
            const years = Object.keys(gameData[selectedGame].years).sort((a, b) => b - a);
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + " 📅";
                yearSelect.appendChild(option);
            });
            yearSection.style.display = 'block';
        } else {
            yearSection.style.display = 'none';
        }
    });

    yearSelect.addEventListener('change', (e) => {
        const selectedGame = gameSelect.value;
        const selectedYear = e.target.value;

        updateSelect.innerHTML = '<option value="">-- Melyik frissítést tanuljuk meg? --</option>';
        infoSection.style.display = 'none';

        if (selectedYear) {
            const updates = gameData[selectedGame].years[selectedYear].updates;
            for (const [updateKey, updateInfo] of Object.entries(updates)) {
                const option = document.createElement('option');
                option.value = updateKey;
                option.textContent = updateInfo.name;
                updateSelect.appendChild(option);
            }
            updateSection.style.display = 'block';
        } else {
            updateSection.style.display = 'none';
        }
    });

    updateSelect.addEventListener('change', (e) => {
        const selectedGame = gameSelect.value;
        const selectedYear = yearSelect.value;
        const selectedUpdate = e.target.value;

        if (selectedUpdate) {
            const updateInfo = gameData[selectedGame].years[selectedYear].updates[selectedUpdate];
            
            updateTitle.textContent = updateInfo.name;
            updateDesc.textContent = updateInfo.desc;
            
            // Kérdések generálása
            updateQuestions.innerHTML = ''; 
            userAnswers = {};
            resultBox.style.display = 'none';
            submitBtn.disabled = false;

            updateInfo.questions.forEach((qObj, qIdx) => {
                const qBlock = document.createElement('div');
                qBlock.className = 'q-block';

                const qText = document.createElement('div');
                qText.className = 'q-text';
                qText.textContent = `${qIdx + 1}. ${qObj.text}`;
                qBlock.appendChild(qText);

                qObj.options.forEach((optText, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = optText;
                    btn.type = 'button';

                    btn.addEventListener('click', () => {
                        qBlock.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        userAnswers[qIdx] = optIdx;
                    });

                    qBlock.appendChild(btn);
                });

                updateQuestions.appendChild(qBlock);
            });

            infoSection.style.display = 'block';
        } else {
            infoSection.style.display = 'none';
        }
    });

    // Ellenőrzés és válasz kiértékelés
    submitBtn.addEventListener('click', () => {
        const selectedGame = gameSelect.value;
        const selectedYear = yearSelect.value;
        const selectedUpdate = updateSelect.value;
        const updateInfo = gameData[selectedGame].years[selectedYear].updates[selectedUpdate];
        const totalQuestions = updateInfo.questions.length;

        if (Object.keys(userAnswers).length < totalQuestions) {
            alert('Kérlek válaszolj minden kérdésre a beküldés előtt!');
            return;
        }

        let correctCount = 0;

        updateInfo.questions.forEach((qObj, qIdx) => {
            const qBlock = updateQuestions.children[qIdx];
            const buttons = qBlock.querySelectorAll('.option-btn');
            const chosenIndex = userAnswers[qIdx];

            buttons.forEach((btn, optIdx) => {
                btn.disabled = true;

                if (optIdx === qObj.correct) {
                    btn.classList.add('correct');
                }
                if (chosenIndex === optIdx && chosenIndex !== qObj.correct) {
                    btn.classList.add('wrong');
                }
            });

            if (chosenIndex === qObj.correct) {
                correctCount++;
            }
        });

        resultBox.style.display = 'block';
        if (correctCount === totalQuestions) {
            resultBox.className = 'result-box success';
            resultBox.textContent = `🎉 JÓ VÁLASZ! Hibátlan teljesítmény: ${correctCount}/${totalQuestions}! (+10 XP)`;
        } else {
            resultBox.className = 'result-box error';
            resultBox.textContent = `❌ ROSSZ! ${correctCount}/${totalQuestions} helyes válasz. Nézd meg a zölddel jelölt jó válaszokat!`;
        }

        submitBtn.disabled = true;
    });
</script>

</body>
</html>
