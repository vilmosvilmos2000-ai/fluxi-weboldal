<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://fluxi.hu/szarnyalj/tanulás</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #08192f 0%, #0d2342 100%);
            color: #e8f4ff;
        }

        /* 6 Másodperces Duolingo Töltőképernyő */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #0b1d39 0%, #123f66 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #eaf7ff;
        }

        .loader-text {
            margin-top: 25px;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
        }

        .loader-subtext {
            margin-top: 8px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0.9;
        }

        /* Ceruza Animáció CSS */
        .pencil {
            display: block;
            width: 10em;
            height: 10em;
        }

        .pencil__body1, .pencil__body2, .pencil__body3,
        .pencil__eraser, .pencil__eraser-skew, .pencil__point,
        .pencil__rotate, .pencil__stroke {
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .pencil__body1, .pencil__body2, .pencil__body3 { transform: rotate(-90deg); }
        .pencil__body1 { animation-name: pencilBody1; }
        .pencil__body2 { animation-name: pencilBody2; }
        .pencil__body3 { animation-name: pencilBody3; }
        .pencil__eraser { animation-name: pencilEraser; transform: rotate(-90deg) translate(49px,0); }
        .pencil__eraser-skew { animation-name: pencilEraserSkew; animation-timing-function: ease-in-out; }
        .pencil__point { animation-name: pencilPoint; transform: rotate(-90deg) translate(49px,-30px); }
        .pencil__rotate { animation-name: pencilRotate; }
        .pencil__stroke { animation-name: pencilStroke; transform: translate(100px,100px) rotate(-113deg); }

        @keyframes pencilBody1 { from, to { stroke-dashoffset: 351.86; transform: rotate(-90deg); } 50% { stroke-dashoffset: 150.8; transform: rotate(-225deg); } }
        @keyframes pencilBody2 { from, to { stroke-dashoffset: 406.84; transform: rotate(-90deg); } 50% { stroke-dashoffset: 174.36; transform: rotate(-225deg); } }
        @keyframes pencilBody3 { from, to { stroke-dashoffset: 296.88; transform: rotate(-90deg); } 50% { stroke-dashoffset: 127.23; transform: rotate(-225deg); } }
        @keyframes pencilEraser { from, to { transform: rotate(-45deg) translate(49px,0); } 50% { transform: rotate(0deg) translate(49px,0); } }
        @keyframes pencilEraserSkew { from, 32.5%, 67.5%, to { transform: skewX(0); } 35%, 65% { transform: skewX(-4deg); } 37.5%, 62.5% { transform: skewX(8deg); } 40%, 45%, 50%, 55%, 60% { transform: skewX(-15deg); } 42.5%, 47.5%, 52.5%, 57.5% { transform: skewX(15deg); } }
        @keyframes pencilPoint { from, to { transform: rotate(-90deg) translate(49px,-30px); } 50% { transform: rotate(-225deg) translate(49px,-30px); } }
        @keyframes pencilRotate { from { transform: translate(100px,100px) rotate(0); } to { transform: translate(100px,100px) rotate(720deg); } }
        @keyframes pencilStroke { from { stroke-dashoffset: 439.82; transform: translate(100px,100px) rotate(-113deg); } 50% { stroke-dashoffset: 164.93; transform: translate(100px,100px) rotate(-113deg); } 75%, to { stroke-dashoffset: 439.82; transform: translate(100px,100px) rotate(112deg); } }

        /* Duolingo Stílusú Főfelület */
        #main-content {
            display: none;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .duo-header {
            background: linear-gradient(180deg, #0f2e57 0%, #123d6b 100%);
            color: #ecf9ff;
            padding: 18px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 5px solid #0a2345;
        }

        .duo-header h1 {
            margin: 0;
            font-size: clamp(22px, 2vw, 34px);
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .container {
            width: min(1180px, calc(100% - 36px));
            min-height: calc(100vh - 170px);
            margin: 28px auto 40px;
            background: linear-gradient(180deg, #122c4a 0%, #102640 100%);
            border: 2px solid #203c60;
            border-bottom: 6px solid #183154;
            border-radius: 28px;
            padding: 32px clamp(20px, 3vw, 42px);
            box-shadow: 0 18px 40px rgba(5, 13, 26, 0.35);
        }

        .duo-speech-bubble {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            background: linear-gradient(180deg, #dff7ff 0%, #c5ebff 100%);
            border: 2px solid #7ccaf9;
            border-bottom: 4px solid #67b8ef;
            padding: 18px 20px;
            border-radius: 18px;
            margin-bottom: 28px;
            font-size: clamp(16px, 1.7vw, 20px);
            font-weight: 800;
            color: #0e6ab5;
        }

        .duo-owl {
            font-size: 36px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 16px;
            color: #dfefff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .question-dropdown + label,
        label + select {
            position: relative;
        }

        select {
            width: 100%;
            min-height: 68px;
            padding: 14px 52px 14px 18px;
            border: 2px solid #2c4a73;
            border-bottom: 5px solid #1f3e63;
            border-radius: 18px;
            background: linear-gradient(180deg, #112847 0%, #163759 100%);
            font-size: 18px;
            font-weight: 800;
            color: #edf7ff;
            cursor: pointer;
            outline: none;
            transition: all 0.18s ease;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #8de0ff 50%), linear-gradient(135deg, #8de0ff 50%, transparent 50%);
            background-position: calc(100% - 20px) calc(50% - 3px), calc(100% - 14px) calc(50% - 3px);
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            box-shadow: 0 6px 0 rgba(13, 55, 90, 0.75);
        }

        select:invalid {
            color: #b9d9f5;
        }

        select option {
            background: linear-gradient(180deg, #163759 0%, #112847 100%);
            color: #edf7ff;
            font-size: 17px;
            font-weight: 800;
            padding: 14px 14px;
            line-height: 1.5;
        }

        select option:checked,
        select option:hover,
        select option:focus {
            background: linear-gradient(180deg, #2c6cb2 0%, #215b97 100%);
            color: #f4fbff;
        }

        select:hover {
            border-color: #79d7ff;
            box-shadow: 0 8px 0 rgba(55, 155, 219, 0.35);
        }

        select:focus {
            border-color: #7dd3ff;
            border-bottom-color: #58bce9;
            box-shadow: 0 0 0 4px rgba(125, 211, 255, 0.18), 0 8px 0 rgba(55, 155, 219, 0.25);
        }

        #game-select {
            background-color: #163759;
            border-radius: 20px;
        }

        #game-select option {
            padding: 16px 14px;
            margin: 4px 0;
        }

        .question-dropdown {
            margin-top: 10px;
        }

        #year-section, #update-section, #info-section {
            display: none;
            animation: duoPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .info-box {
            background: linear-gradient(180deg, #112847 0%, #102640 100%);
            border: 2px solid #234270;
            border-radius: 22px;
            padding: clamp(20px, 2.5vw, 30px);
            margin-top: 30px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #eef9ff;
            font-size: 24px;
            font-weight: 900;
        }

        .info-box p {
            font-size: 17px;
            line-height: 1.5;
            color: #bfdaf6;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* Gomb dizájn */
        .submit-btn {
            display: block;
            width: 100%;
            background-color: #58cc02;
            color: white;
            border: none;
            border-bottom: 5px solid #46a302;
            border-radius: 16px;
            padding: 16px;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 20px;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 1px;
        }

        .submit-btn:active {
            transform: translateY(5px);
            border-bottom: 0px solid #46a302;
            margin-bottom: 5px;
        }

        /* Visszajelzés (Jó vagy Rossz) */
        .feedback-message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 18px;
            text-align: center;
            animation: duoPop 0.3s ease;
        }

        .feedback-success {
            background-color: #d7ffb8;
            color: #3b8200;
            border: 2px solid #58cc02;
        }

        .feedback-error {
            background-color: #ffdfe0;
            color: #ea2b2b;
            border: 2px solid #ea2b2b;
        }

        @keyframes duoPop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<!-- 6 Másodperces Betöltőképernyő -->
<div id="loader-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" height="200px" width="200px" viewBox="0 0 200 200" class="pencil">
        <defs><clipPath id="pencil-eraser"><rect height="30" width="30" ry="5" rx="5"></rect></clipPath></defs>
        <circle transform="rotate(-113,100,100)" stroke-linecap="round" stroke-dashoffset="439.82" stroke-dasharray="439.82 439.82" stroke-width="2" stroke="#ffffff" fill="none" r="70" class="pencil__stroke"></circle>
        <g transform="translate(100,100)" class="pencil__rotate">
            <g fill="none">
                <circle transform="rotate(-90)" stroke-dashoffset="402" stroke-dasharray="402.12 402.12" stroke-width="30" stroke="#ffc800" r="64" class="pencil__body1"></circle>
                <circle transform="rotate(-90)" stroke-dashoffset="465" stroke-dasharray="464.96 464.96" stroke-width="10" stroke="#ffde59" r="74" class="pencil__body2"></circle>
                <circle transform="rotate(-90)" stroke-dashoffset="339" stroke-dasharray="339.29 339.29" stroke-width="10" stroke="#e6b400" r="54" class="pencil__body3"></circle>
            </g>
            <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
                <g class="pencil__eraser-skew">
                    <rect height="30" width="30" ry="5" rx="5" fill="#ff4b4b"></rect>
                    <rect clip-path="url(#pencil-eraser)" height="30" width="5" fill="#ea2b2b"></rect>
                    <rect height="20" width="30" fill="#e5e5e5"></rect>
                    <rect height="20" width="15" fill="#cccccc"></rect>
                    <rect height="20" width="5" fill="#dddddd"></rect>
                    <rect height="2" width="30" y="6" fill="rgba(0,0,0,0.15)"></rect>
                    <rect height="2" width="30" y="13" fill="rgba(0,0,0,0.15)"></rect>
                </g>
            </g>
            <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
                <polygon points="15 0,30 30,0 30" fill="#f5c280"></polygon>
                <polygon points="15 0,6 30,0 30" fill="#e0a960"></polygon>
                <polygon points="15 0,20 10,10 10" fill="#4b4b4b"></polygon>
            </g>
        </g>
    </svg>
    <div class="loader-text">Betöltés...</div>
</div>

<!-- Duolingo Fő Tartalom -->
<div id="main-content">
    <header class="duo-header">
        <h1>Szárnyalj</h1>
    </header>

    <div class="container">
        <div class="duo-speech-bubble">
            <span>Szia! Válassz egy játékot, majd teszteld a tudásod a frissítésekből!</span>
        </div>

        <div class="form-group">
            <label for="game-select">Válassz játékot:</label>
            <select id="game-select">
                <option value="">-- Kattints a választáshoz --</option>
            </select>
        </div>

        <div class="form-group" id="year-section">
            <label for="year-select">Válassz évet:</label>
            <select id="year-select">
                <option value="">-- Melyik év érdekel? --</option>
            </select>
        </div>

        <div class="form-group" id="update-section">
            <label for="update-select">Válassz frissítést:</label>
            <select id="update-select">
                <option value="">-- Melyik frissítést tanuljuk meg? --</option>
            </select>
        </div>

        <!-- Ide kerülnek dinamikusan a kérdések -->
        <div id="info-section">
            <div class="info-box">
                <h3 id="update-title">Lecke címe</h3>
                <p id="update-desc">Itt jelenik meg a leírás...</p>

                <div id="questions-container">
                    <!-- A JavaScript ide generálja a lenyíló kérdéseket -->
                </div>

                <button class="submit-btn" id="submit-btn">Beküldés</button>
                <div id="feedback-message" class="feedback-message"></div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
