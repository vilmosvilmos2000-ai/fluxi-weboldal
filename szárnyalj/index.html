<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Games - Napi Lecke</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #4b4b4b;
        }

        /* 6 Másodperces Duolingo Töltőképernyő */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #58cc02;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }

        .loader-text {
            margin-top: 25px;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
        }

        .loader-subtext {
            margin-top: 8px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0.9;
        }

        /* Ceruza Animáció CSS */
        .pencil {
            display: block;
            width: 10em;
            height: 10em;
        }

        .pencil__body1,
        .pencil__body2,
        .pencil__body3,
        .pencil__eraser,
        .pencil__eraser-skew,
        .pencil__point,
        .pencil__rotate,
        .pencil__stroke {
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .pencil__body1,
        .pencil__body2,
        .pencil__body3 {
            transform: rotate(-90deg);
        }

        .pencil__body1 { animation-name: pencilBody1; }
        .pencil__body2 { animation-name: pencilBody2; }
        .pencil__body3 { animation-name: pencilBody3; }

        .pencil__eraser {
            animation-name: pencilEraser;
            transform: rotate(-90deg) translate(49px,0);
        }

        .pencil__eraser-skew {
            animation-name: pencilEraserSkew;
            animation-timing-function: ease-in-out;
        }

        .pencil__point {
            animation-name: pencilPoint;
            transform: rotate(-90deg) translate(49px,-30px);
        }

        .pencil__rotate { animation-name: pencilRotate; }

        .pencil__stroke {
            animation-name: pencilStroke;
            transform: translate(100px,100px) rotate(-113deg);
        }

        @keyframes pencilBody1 {
            from, to { stroke-dashoffset: 351.86; transform: rotate(-90deg); }
            50% { stroke-dashoffset: 150.8; transform: rotate(-225deg); }
        }
        @keyframes pencilBody2 {
            from, to { stroke-dashoffset: 406.84; transform: rotate(-90deg); }
            50% { stroke-dashoffset: 174.36; transform: rotate(-225deg); }
        }
        @keyframes pencilBody3 {
            from, to { stroke-dashoffset: 296.88; transform: rotate(-90deg); }
            50% { stroke-dashoffset: 127.23; transform: rotate(-225deg); }
        }
        @keyframes pencilEraser {
            from, to { transform: rotate(-45deg) translate(49px,0); }
            50% { transform: rotate(0deg) translate(49px,0); }
        }
        @keyframes pencilEraserSkew {
            from, 32.5%, 67.5%, to { transform: skewX(0); }
            35%, 65% { transform: skewX(-4deg); }
            37.5%, 62.5% { transform: skewX(8deg); }
            40%, 45%, 50%, 55%, 60% { transform: skewX(-15deg); }
            42.5%, 47.5%, 52.5%, 57.5% { transform: skewX(15deg); }
        }
        @keyframes pencilPoint {
            from, to { transform: rotate(-90deg) translate(49px,-30px); }
            50% { transform: rotate(-225deg) translate(49px,-30px); }
        }
        @keyframes pencilRotate {
            from { transform: translate(100px,100px) rotate(0); }
            to { transform: translate(100px,100px) rotate(720deg); }
        }
        @keyframes pencilStroke {
            from { stroke-dashoffset: 439.82; transform: translate(100px,100px) rotate(-113deg); }
            50% { stroke-dashoffset: 164.93; transform: translate(100px,100px) rotate(-113deg); }
            75%, to { stroke-dashoffset: 439.82; transform: translate(100px,100px) rotate(112deg); }
        }

        /* Duolingo Stílusú Főfelület */
        #main-content {
            display: none;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .duo-header {
            background-color: #58cc02;
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #46a302;
        }

        .duo-header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

       

        .container {
            max-width: 650px;
            margin: 40px auto;
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
            border-radius: 24px;
            padding: 32px;
        }

        .duo-speech-bubble {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: #ddf4ff;
            border: 2px solid #84d8ff;
            border-bottom: 4px solid #84d8ff;
            padding: 16px 20px;
            border-radius: 18px;
            margin-bottom: 28px;
            font-size: 17px;
            font-weight: 800;
            color: #1cb0f6;
        }

        .duo-owl {
            font-size: 36px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 16px;
            color: #4b4b4b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            border-radius: 16px;
            background-color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            color: #4b4b4b;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        select:focus {
            border-color: #1cb0f6;
            border-bottom-color: #1899d6;
        }

        #year-section, #update-section, #info-section {
            display: none;
            animation: duoPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .info-box {
            background-color: #d7ffb8;
            border: 2px solid #58cc02;
            border-bottom: 6px solid #46a302;
            border-radius: 22px;
            padding: 24px;
            margin-top: 30px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #3b8200;
            font-size: 24px;
            font-weight: 900;
        }

        .info-box p {
            font-size: 17px;
            line-height: 1.5;
            color: #2e5a00;
            font-weight: 700;
        }

        .questions-title {
            margin-top: 22px;
            margin-bottom: 12px;
            color: #1cb0f6;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
        }

        ul {
            padding-left: 0;
            list-style: none;
            margin: 0;
        }

        li {
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            font-weight: 800;
            color: #4b4b4b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        li::before {
            content: "⚡";
            font-size: 20px;
        }

        @keyframes duoPop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<!-- 6 Másodperces Betöltőképernyő -->
<div id="loader-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" height="200px" width="200px" viewBox="0 0 200 200" class="pencil">
        <defs>
            <clipPath id="pencil-eraser">
                <rect height="30" width="30" ry="5" rx="5"></rect>
            </clipPath>
        </defs>
        <circle transform="rotate(-113,100,100)" stroke-linecap="round" stroke-dashoffset="439.82" stroke-dasharray="439.82 439.82" stroke-width="2" stroke="#ffffff" fill="none" r="70" class="pencil__stroke"></circle>
        <g transform="translate(100,100)" class="pencil__rotate">
            <g fill="none">
                <circle transform="rotate(-90)" stroke-dashoffset="402" stroke-dasharray="402.12 402.12" stroke-width="30" stroke="#ffc800" r="64" class="pencil__body1"></circle>
                <circle transform="rotate(-90)" stroke-dashoffset="465" stroke-dasharray="464.96 464.96" stroke-width="10" stroke="#ffde59" r="74" class="pencil__body2"></circle>
                <circle transform="rotate(-90)" stroke-dashoffset="339" stroke-dasharray="339.29 339.29" stroke-width="10" stroke="#e6b400" r="54" class="pencil__body3"></circle>
            </g>
            <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
                <g class="pencil__eraser-skew">
                    <rect height="30" width="30" ry="5" rx="5" fill="#ff4b4b"></rect>
                    <rect clip-path="url(#pencil-eraser)" height="30" width="5" fill="#ea2b2b"></rect>
                    <rect height="20" width="30" fill="#e5e5e5"></rect>
                    <rect height="20" width="15" fill="#cccccc"></rect>
                    <rect height="20" width="5" fill="#dddddd"></rect>
                    <rect height="2" width="30" y="6" fill="rgba(0,0,0,0.15)"></rect>
                    <rect height="2" width="30" y="13" fill="rgba(0,0,0,0.15)"></rect>
                </g>
            </g>
            <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
                <polygon points="15 0,30 30,0 30" fill="#f5c280"></polygon>
                <polygon points="15 0,6 30,0 30" fill="#e0a960"></polygon>
                <polygon points="15 0,20 10,10 10" fill="#4b4b4b"></polygon>
            </g>
        </g>
    </svg>
    <div class="loader-text">Duo előkészíti a mai leckédet...</div>
    <div class="loader-subtext">Tartsd életben a szériádat minden nap! 🔥</div>
</div>

<!-- Duolingo Fő Tartalom -->
<div id="main-content">
    <header class="duo-header">
        <h1>DUOLINGO GAMES</h1>
        <div class="stats-bar">
            <div class="stat-item">🔥 14</div>
            <div class="stat-item">💎 450</div>
            <div class="stat-item">❤️ 5</div>
        </div>
    </header>

    <div class="container">
        <div class="duo-speech-bubble">
            <span class="duo-owl">🦉</span>
            <span>Szia! Válassz egy játékot, és teljesítsd a mai frissítés-leckét!</span>
        </div>

        <div class="form-group">
            <label for="game-select">Válassz játékot:</label>
            <select id="game-select">
                <option value="">-- Kattints a választáshoz --</option>
            </select>
        </div>

        <div class="form-group" id="year-section">
            <label for="year-select">Válassz évet:</label>
            <select id="year-select">
                <option value="">-- Melyik év érdekel? --</option>
            </select>
        </div>

        <div class="form-group" id="update-section">
            <label for="update-select">Válassz frissítést:</label>
            <select id="update-select">
                <option value="">-- Melyik frissítést tanuljuk meg? --</option>
            </select>
        </div>

        <div id="info-section">
            <div class="info-box">
                <h3 id="update-title">Lecke címe</h3>
                <p id="update-desc">Itt jelenik meg a leírás...</p>
                <div class="questions-title">🎯 Lecke kérdések (+10 XP):</div>
                <ul id="update-questions">
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    // 6 másodperces töltőképernyő
    setTimeout(() => {
        document.getElementById('loader-wrapper').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
    }, 6000);

    // Adatbázis
    const gameData = {
        "minecraft": {
            name: "Minecraft 🟩",
            years: {
                "2024": {
                    updates: {
                        "1_21": {
                            name: "1.21 - Tricky Trials",
                            desc: "A Tricky Trials frissítés új kihívásokat, Trial Chambereket, a Breeze mobot és a Crafter automatizáló blokkot hozta el.",
                            questions: ["Milyen lootot ad az Ominous Vault?", "Mire lehet használni a Mace (Buzogány) fegyvert?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "1_20": {
                            name: "1.20 - Trails & Tales",
                            desc: "Behozta a gyönyörű cseresznyefás ligeteket (Cherry Grove), az archeológiát, az ecsetet, a tevét és a Sniffert.",
                            questions: ["Hogyan lehet kikelteni egy Sniffer tojást?", "Hol találhatók a gyanús homok (suspicious sand) blokkok?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "1_19": {
                            name: "1.19 - The Wild Update",
                            desc: "Megérkezett a Deep Dark biome, az Ancient City, a félelmetes Warden és a mocsári békák.",
                            questions: ["Hogyan lehet elkerülni, hogy a Warden meghalljon?", "Mit esznek a békák a játékban?"]
                        }
                    }
                }
            }
        },
        "roblox": {
            name: "Roblox 🟥",
            years: {
                "2024": {
                    updates: {
                        "dynamic_heads": {
                            name: "Dynamic Heads & Facial Animation",
                            desc: "A Roblox karakterek arcai animálttá váltak, és a kamerán keresztül a valós arckifejezésünket is átvihetjük a játékba.",
                            questions: ["Hogyan kell bekapcsolni a kamera-alapú arckövetést?", "Minden játék támogatja az animált arcokat?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "voice_chat": {
                            name: "Voice Chat széleskörű kiterjesztése",
                            desc: "A térbeli hangalapú csevegés (Spatial Voice) sokkal elérhetőbbé vált a közösség számára.",
                            questions: ["Hány éves kortól használható a Voice Chat hivatalosan?", "Hogyan működik a Spatial Audio (térbeli hang)?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "layered_clothing": {
                            name: "Layered Clothing (Réteges ruházat)",
                            desc: "A játékosok végre 3D-s ruhákat (kabátokat, pulóvereket) vehettek fel egymásra rétegezve az avatárjukon.",
                            questions: ["Hány réteg ruhát lehet maximum ráadni egy karakterre?", "Működik a Layered Clothing a régi R6 avatárokon?"]
                        }
                    }
                }
            }
        },
        "fortnite": {
            name: "Fortnite 🟦",
            years: {
                "2024": {
                    updates: {
                        "ch5_s2": {
                            name: "Chapter 5 Season 2 - Myths & Mortals",
                            desc: "A görög mitológia ihlette szezon, ahol Zeusz, Hádész és más istenek képességeit lehetett használni.",
                            questions: ["Milyen mitológiai képességeket lehetett találni a pályán?", "Hol volt Hádész alvilági bázisa?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "og": {
                            name: "Fortnite OG",
                            desc: "Egy nosztalgikus szezon, ami visszahozta az eredeti Chapter 1 térképeit, fegyvereit és járműveit.",
                            questions: ["Melyik ikonikus helyszín volt a legnépszerűbb?", "Milyen régi járművek tértek vissza a játékba?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "zero_build": {
                            name: "Zero Build mód bevezetése",
                            desc: "Megjelent a Chapter 3 Season 2, ami bevezette a Zero Build módot – az építés nélküli pörgős játékélményt.",
                            questions: ["Milyen új védelmi funkciót kaptak a játékosok (Overshield)?", "Hogyan változtatta meg a Zero Build a meccseket?"]
                        }
                    }
                }
            }
        },
        "fnaf": {
            name: "Five Nights at Freddy's 🐻",
            years: {
                "2024": {
                    updates: {
                        "into_the_pit": {
                            name: "Into the Pit Megjelenés",
                            desc: "Egy vadonatúj, 2D-s pixel art stílusú túlélő horror, ami a Fazbear Frights könyvsorozatot dolgozza fel.",
                            questions: ["Hogyan lehet utazni az időben a játékban?", "Ki a főellenség, aki üldözi Oswaldot?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "ruin": {
                            name: "Security Breach - Ruin DLC",
                            desc: "Cassie a lepusztult Pizzaplexben próbálja megtalálni Gregory-t a V.A.N.N.I. maszk segítségével.",
                            questions: ["Hogyan változtatja meg a maszk a környezetet?", "Mi a Mimic igazi célja?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "xbox_port": {
                            name: "Security Breach Console Ports",
                            desc: "A hatalmas PizzaPlex megnyitotta kapuit az Xbox és Nintendo Switch konzolokon is.",
                            questions: ["Milyen nehézséget okozott a Switch portolása?", "Melyik animatronic üldöz folyamatosan a játék elején?"]
                        }
                    }
                }
            }
        },
        "gtav": {
            name: "Grand Theft Auto V 🚗",
            years: {
                "2024": {
                    updates: {
                        "bottom_dollar": {
                            name: "Bottom Dollar Bounties",
                            desc: "Saját fejvadász irodát nyithatunk, és Maude Eccles lányával kaphatjuk el Los Santos bűnözőit.",
                            questions: ["Hogyan működik az óvadék (Bail) rendszer?", "Kiket kell elkapni a legnagyobb jutalomért?"]
                        }
                    }
                },
                "2023": {
                    updates: {
                        "chop_shop": {
                            name: "The Chop Shop",
                            desc: "Egy autóbontó vállalkozás, ahol Yusuf Amir segítségével luxusautókat lophatunk el.",
                            questions: ["Milyen extra bevételt hoz a bontóüzem?", "Hogyan működnek a heti autólopós küldetések?"]
                        }
                    }
                },
                "2022": {
                    updates: {
                        "drug_wars": {
                            name: "Los Santos Drug Wars",
                            desc: "Csatlakozunk a Fooliganz csapatához, hogy egy hatalmas mozgó laboratóriumban indítsunk új üzletet.",
                            questions: ["Melyik járműben található az Acid Lab?", "Ki vezeti a Fooliganz bandát?"]
                        }
                    }
                }
            }
        }
    };

    const gameSelect = document.getElementById('game-select');
    const yearSection = document.getElementById('year-section');
    const yearSelect = document.getElementById('year-select');
    const updateSection = document.getElementById('update-section');
    const updateSelect = document.getElementById('update-select');
    const infoSection = document.getElementById('info-section');
    const updateTitle = document.getElementById('update-title');
    const updateDesc = document.getElementById('update-desc');
    const updateQuestions = document.getElementById('update-questions');

    for (const [key, game] of Object.entries(gameData)) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = game.name;
        gameSelect.appendChild(option);
    }

    gameSelect.addEventListener('change', (e) => {
        const selectedGame = e.target.value;
        
        yearSelect.innerHTML = '<option value="">-- Melyik év érdekel? --</option>';
        updateSelect.innerHTML = '<option value="">-- Melyik frissítést tanuljuk meg? --</option>';
        updateSection.style.display = 'none';
        infoSection.style.display = 'none';

        if (selectedGame) {
            const years = Object.keys(gameData[selectedGame].years).sort((a, b) => b - a);
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + " 📅";
                yearSelect.appendChild(option);
            });
            yearSection.style.display = 'block';
        } else {
            yearSection.style.display = 'none';
        }
    });

    yearSelect.addEventListener('change', (e) => {
        const selectedGame = gameSelect.value;
        const selectedYear = e.target.value;

        updateSelect.innerHTML = '<option value="">-- Melyik frissítést tanuljuk meg? --</option>';
        infoSection.style.display = 'none';

        if (selectedYear) {
            const updates = gameData[selectedGame].years[selectedYear].updates;
            for (const [updateKey, updateInfo] of Object.entries(updates)) {
                const option = document.createElement('option');
                option.value = updateKey;
                option.textContent = updateInfo.name;
                updateSelect.appendChild(option);
            }
            updateSection.style.display = 'block';
        } else {
            updateSection.style.display = 'none';
        }
    });

    updateSelect.addEventListener('change', (e) => {
        const selectedGame = gameSelect.value;
        const selectedYear = yearSelect.value;
        const selectedUpdate = e.target.value;

        if (selectedUpdate) {
            const updateInfo = gameData[selectedGame].years[selectedYear].updates[selectedUpdate];
            
            updateTitle.textContent = updateInfo.name;
            updateDesc.textContent = updateInfo.desc;
            
            updateQuestions.innerHTML = ''; 
            updateInfo.questions.forEach(q => {
                const li = document.createElement('li');
                li.textContent = q;
                updateQuestions.appendChild(li);
            });

            infoSection.style.display = 'block';
        } else {
            infoSection.style.display = 'none';
        }
    });
</script>

</body>
</html>
