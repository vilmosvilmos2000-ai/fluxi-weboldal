<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZombiCraft – Zöld mezők</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e12;--panel:#111318;--line:#2a2d35;--tx:#f2f3f5;--mut:#8b8f99;--blue:#2f6bff;--amber:#f5a623;--purple:#8b5cf6;--teal:#2dd4a0;--red:#ef4444;
--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--sans:Inter,'Segoe UI',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans)}
canvas{display:block;position:absolute;inset:0}
.m{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:500}
.b{display:inline-block;font:700 12px var(--mono);padding:5px 8px;color:#fff;background:var(--blue)}
.tag{display:inline-block;font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:5px 8px;border:1px solid currentColor}
.craft{color:var(--teal)}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;
padding:0 24px;background:rgba(13,14,18,.92);border-bottom:1px solid var(--line);z-index:10;pointer-events:none}
#bar .l{display:flex;align-items:center;gap:22px}
.logo{font:700 20px var(--sans);letter-spacing:.04em}
.chip{padding:7px 10px;color:var(--mut)} .chip.on{background:#fff;color:#000}
#hud{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,150px);
background:rgba(13,14,18,.9);border:1px solid var(--line);z-index:5;pointer-events:none}
.cell{padding:12px 14px;border-right:1px solid var(--line)} .cell:last-child{border:0}
.cell .m{color:var(--mut);font-size:11px;margin-left:8px}
.cell .v{font:700 30px var(--sans);margin-top:10px}
#bw{height:3px;background:var(--line);margin-top:8px} #bf{height:100%;width:100%;background:var(--teal)}
#xh{position:fixed;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid #fff;mix-blend-mode:difference;pointer-events:none;z-index:4}
#xh:after{content:"";position:absolute;inset:4px;background:#fff}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 25%,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/12.5% 100%,rgba(13,14,18,.93)}
.card{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line)}
.card .top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);color:var(--mut)}
.card .body{padding:26px 20px 8px}
h1{margin:0;font:700 44px/1.1 var(--sans);letter-spacing:-.01em}
#sub{color:var(--mut);margin:10px 0 20px;font-size:16px}
.keys{border-top:1px solid var(--line);margin-top:22px}
.keys div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);color:var(--mut)}
.keys b{color:var(--tx);font-weight:500}
.act{padding:20px}
button{width:100%;padding:16px;font:700 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;background:#fff;color:#000;border:0;border-radius:0;cursor:pointer}
button:hover{background:#d9dbe0} button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
@media(max-width:560px){#hud{grid-template-columns:repeat(3,1fr);right:12px;left:12px}h1{font-size:34px}}
</style>
</head>
<body>
<div id="bar"><div class="l"><span class="logo">ZOMBI<span class="craft">CRAFT</span></span><span class="m chip on">Játék</span><span class="m chip">Túlélő mód</span></div><span class="m chip">Zöld mezők</span></div>

<div id="hud">
 <div class="cell"><span class="b">01</span><span class="m">Élet</span><div class="v" id="hp">100</div><div id="bw"><div id="bf"></div></div></div>
 <div class="cell"><span class="b" style="background:var(--amber);color:#000">02</span><span class="m">Pont</span><div class="v" id="score">0</div></div>
 <div class="cell"><span class="b" style="background:var(--purple)">03</span><span class="m">Zombik</span><div class="v" id="zc">0</div></div>
</div>
<div id="xh"></div>

<div id="ov">
 <div class="card">
  <div class="top m"><span class="b" id="badge">01</span><span>Túlélő mód · v1.0</span></div>
  <div class="body">
   <span class="tag" id="tag">Készen áll</span>
   <h1 id="title" style="margin-top:16px"></h1>
   <p id="sub"></p>
   <div class="keys m"><div><b>WASD</b><span>Mozgás</span></div><div><b>Egér</b><span>Körbenézés</span></div><div><b>Bal gomb</b><span>Lövés</span></div><div><b>Esc</b><span>Szünet</span></div></div>
  </div>
  <div class="act"><button id="btn" onclick="start()">Indítás</button></div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id), V = THREE.Vector3;
let scene, camera, renderer, clock, gun;
let zombies = [], bullets = [], hp = 100, score = 0, state = 'menu';
let yaw = 0, pitch = 0, cd = 0, spawnT = 1;
const keys = {}, tmp = new V(), zc = new V();
const bGeo = new THREE.SphereGeometry(.05, 8, 8), bMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
const zBody = new THREE.BoxGeometry(.6, 1.4, .4), zHead = new THREE.BoxGeometry(.4, .4, .4);
const zBodyM = new THREE.MeshStandardMaterial({ color: 0x388e3c }), zHeadM = new THREE.MeshStandardMaterial({ color: 0x66bb6a });

const SCREENS = {
  menu:  ['01', 'ZOMBI<span class="craft">CRAFT</span>', 'Védd meg magad a zöld mezőn: lődd le a zombikat, és maradj életben.', 'Készen áll', 'var(--teal)', 'Indítás'],
  pause: ['02', 'SZÜNET', 'A játék áll. Folytasd ott, ahol abbahagytad.', 'Szüneteltetve', 'var(--amber)', 'Folytatás'],
  dead:  ['03', 'ELVÉRZETTÉL', '', 'Játék vége', 'var(--red)', 'Újraéledés']
};
function showScreen(k) {
  const s = SCREENS[k];
  $('badge').textContent = s[0]; $('title').innerHTML = s[1];
  $('sub').textContent = k === 'dead' ? 'Elért pontszám: ' + score : s[2];
  const t = $('tag'); t.textContent = s[3]; t.style.color = s[4];
  $('btn').textContent = s[5]; $('ov').style.display = 'flex';
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 10, 150);
  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, .1, 1000);
  camera.rotation.order = 'YXZ';                       // javítva: nincs "dőlés" fordulásnál
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);
  clock = new THREE.Clock();

  scene.add(new THREE.AmbientLight(0xffffff, .7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(50, 100, 50); scene.add(sun);

  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#2e7d32'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(0,${100 + Math.random() * 155 | 0},0,0.3)`; g.fillRect(Math.random() * 512, Math.random() * 512, 4, 4); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(100, 100);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: tex }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);

  const trunkG = new THREE.CylinderGeometry(.2, .2, 2), leafG = new THREE.ConeGeometry(1.5, 4, 8);
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x5D4037 }), leafM = new THREE.MeshStandardMaterial({ color: 0x1B5E20 });
  for (let i = 0; i < 100; i++) {
    const x = (Math.random() - .5) * 400, z = (Math.random() - .5) * 400;
    if (Math.abs(x) < 10 && Math.abs(z) < 25) continue;   // ne a kezdőpontra kerüljön
    const t = new THREE.Group(), tr = new THREE.Mesh(trunkG, trunkM), lf = new THREE.Mesh(leafG, leafM);
    tr.position.y = 1; lf.position.y = 3.5; t.add(tr, lf); t.position.set(x, 0, z); scene.add(t);
  }

  gun = new THREE.Mesh(new THREE.BoxGeometry(.12, .18, .6), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  gun.position.set(.4, -.4, -.6); camera.add(gun); scene.add(camera);

  addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Escape' && state === 'play') pause(); });
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('mousemove', e => {
    if (state !== 'play') return;
    yaw -= e.movementX * .002;
    pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * .002));
  });
  addEventListener('mousedown', () => { if (state === 'play') shoot(); });
  addEventListener('blur', () => { if (state === 'play') pause(); });
  document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && state === 'play') pause(); });
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  reset(); showScreen('menu'); animate();
}

function reset() {
  hp = 100; score = 0; spawnT = 1;
  zombies.forEach(z => scene.remove(z.mesh)); zombies = [];
  bullets.forEach(b => scene.remove(b)); bullets = [];
  camera.position.set(0, 1.6, 10); yaw = pitch = 0;
}
window.start = function () {
  if (state !== 'pause') reset();                      // javítva: újraéledés után azonnal lehet játszani
  state = 'play'; $('ov').style.display = 'none';
  try { const p = document.body.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
};
function pause() {
  state = 'pause'; for (const k in keys) keys[k] = false;   // javítva: szünetben a zombik is megállnak
  showScreen('pause');
}
function die() {
  state = 'dead'; document.exitPointerLock(); showScreen('dead');
}

function shoot() {
  if (cd > 0) return; cd = .15;
  gun.position.z = -.5; setTimeout(() => gun.position.z = -.6, 50);
  const b = new THREE.Mesh(bGeo, bMat);                // közös geometria: nincs memóriaszivárgás
  b.position.copy(camera.position);
  b.userData.vel = new V(0, 0, -1).applyQuaternion(camera.quaternion).multiplyScalar(90);
  b.userData.life = 1.5;
  bullets.push(b); scene.add(b);
}

function spawnZombie() {
  const m = new THREE.Group(), body = new THREE.Mesh(zBody, zBodyM), head = new THREE.Mesh(zHead, zHeadM);
  body.position.y = .7; head.position.y = 1.6; m.add(body, head);
  const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 20;   // javítva: a játékos körül jelennek meg
  m.position.set(
    Math.max(-490, Math.min(490, camera.position.x + Math.cos(a) * d)), 0,
    Math.max(-490, Math.min(490, camera.position.z + Math.sin(a) * d)));
  zombies.push({ mesh: m, hp: 2 }); scene.add(m);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);          // javítva: képkocka-független sebesség

  if (state === 'play') {
    cd -= dt;
    camera.rotation.set(pitch, yaw, 0);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const l = Math.hypot(f, r) || 1, sp = 12 * dt / l, sy = Math.sin(yaw), cy = Math.cos(yaw);
    camera.position.x = Math.max(-490, Math.min(490, camera.position.x + (-sy * f + cy * r) * sp));
    camera.position.z = Math.max(-490, Math.min(490, camera.position.z + (-cy * f - sy * r) * sp));
    camera.position.y = 1.6;

    // golyók: hátulról előre, 3 részlépésben (nincs átlövés, nincs rossz splice)
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; let hit = false;
      for (let s = 0; s < 3 && !hit; s++) {
        b.position.addScaledVector(b.userData.vel, dt / 3);
        for (let j = zombies.length - 1; j >= 0; j--) {
          const z = zombies[j];
          zc.set(z.mesh.position.x, 1, z.mesh.position.z);
          if (b.position.distanceTo(zc) < 1) {
            hit = true;
            if (--z.hp <= 0) { scene.remove(z.mesh); zombies.splice(j, 1); score += 10; }
            break;
          }
        }
      }
      if (hit || (b.userData.life -= dt) <= 0) { scene.remove(b); bullets.splice(i, 1); }
    }

    // zombik
    const speed = 3.6 + Math.min(score / 100, 2);
    for (const z of zombies) {
      tmp.subVectors(camera.position, z.mesh.position); tmp.y = 0;
      const dist = tmp.length();
      if (dist > 1.2) z.mesh.position.addScaledVector(tmp, speed * dt / dist);
      z.mesh.lookAt(camera.position.x, 0, camera.position.z);
      if (dist < 1.5) hp -= 20 * dt;
    }
    if (hp <= 0) { hp = 0; die(); }

    spawnT -= dt;
    if (spawnT <= 0 && zombies.length < 20) { spawnZombie(); spawnT = Math.max(.4, 1.2 - score / 400); }
  }

  $('hp').textContent = Math.ceil(hp); $('score').textContent = score; $('zc').textContent = zombies.length;
  $('bf').style.width = hp + '%'; $('bf').style.background = hp < 30 ? 'var(--red)' : 'var(--teal)';
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
